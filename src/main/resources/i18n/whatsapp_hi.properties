rem.24h=🔔 *याद दिलाना: कल आपका अपॉइंटमेंट है*\n\nनमस्ते *{0}*!\n\nयह याद दिलाने के लिए है कि कल आपका अपॉइंटमेंट है:\n\n👨‍⚕️ *डॉक्टर:* डॉ. {1} {2}\n📅 *तारीख:* कल ({3})\n⏰ *समय:* {4}\n🔢 *कतार नंबर:* #{5}\n📋 *अपॉइंटमेंट आईडी:* #{6}\n\nकृपया 10 मिनट पहले पहुँचें।\nकल मिलते हैं! 👋
rem.2h=🔔 *याद दिलाना: 2 घंटे में अपॉइंटमेंट*\n\nनमस्ते *{0}*!\n\nआपका अपॉइंटमेंट जल्द है:\n\n👨‍⚕️ *डॉक्टर:* डॉ. {1} {2}\n⏰ *समय:* {3} (लगभग 2 घंटे में)\n🔢 *कतार नंबर:* #{4}\n\nकृपया निकलने की तैयारी शुरू करें।\n10 मिनट पहले पहुँचें।\n\nजल्द मिलते हैं! 👋
q.missed=नमस्ते {0}, आज {1} के साथ आपके अपॉइंटमेंट पर हम आपका इंतज़ार करते रहे।\n\nकोई बात नहीं - नया समय बुक करने के लिए कभी भी "Hi" भेजें।
q.turn=*{0}, आपकी बारी लगभग आ गई है!* 🔔\n\nअब आपके आगे कोई नहीं है। कृपया {1} के कमरे के बाहर तैयार रहें - आपको जल्द ही बुलाया जाएगा।
q.near.1=नमस्ते {0}, {1} के पास आपसे पहले सिर्फ़ *1 मरीज़* है। ⏳\n\nकृपया अभी क्लिनिक के लिए निकलें। अनुमानित समय: *{2}*।
q.near.2=नमस्ते {0}, {1} के पास आपसे पहले सिर्फ़ *2 मरीज़* हैं। ⏳\n\nकृपया अभी क्लिनिक के लिए निकलें। अनुमानित समय: *{2}*।
q.late=नमस्ते {0}, {1} आज लगभग *{2} मिनट* देरी से चल रहे हैं। 🙏\n\nआपसे पहले {3} मरीज़ हैं। नया अनुमानित समय: *{4}*।\nकतार में अपनी स्थिति जानने के लिए कभी भी *status* भेजें।
q.slot=नमस्ते {0}, {1} के साथ आपके समय ({2}) की बारी है। ⏰\n\nआपसे पहले {3} मरीज़ हैं - अनुमानित समय *{4}*।
rx.ready=नमस्ते {0}, *{1}* की ओर से आपका प्रिस्क्रिप्शन तैयार है। 📄\n\nप्रिस्क्रिप्शन नंबर: *{2}*\nडाउनलोड करें (PDF, 7 दिन तक मान्य):\n{3}\n\nइसे फ़ार्मेसी में दिखाएँ और दवाइयाँ वहीं से लें। जल्दी स्वस्थ हों!

