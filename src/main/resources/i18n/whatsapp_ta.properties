rem.24h=🔔 *நினைவூட்டல்: நாளை உங்கள் அப்பாயின்ட்மென்ட்*\n\nவணக்கம் *{0}*!\n\nநாளை உங்களுக்கு அப்பாயின்ட்மென்ட் உள்ளது என்பதை நினைவூட்டுகிறோம்:\n\n👨‍⚕️ *மருத்துவர்:* டாக். {1} {2}\n📅 *தேதி:* நாளை ({3})\n⏰ *நேரம்:* {4}\n🔢 *வரிசை எண்:* #{5}\n📋 *அப்பாயின்ட்மென்ட் எண்:* #{6}\n\nதயவுசெய்து 10 நிமிடங்கள் முன்னதாக வரவும்.\nநாளை சந்திப்போம்! 👋
rem.2h=🔔 *நினைவூட்டல்: 2 மணி நேரத்தில் அப்பாயின்ட்மென்ட்*\n\nவணக்கம் *{0}*!\n\nஉங்கள் அப்பாயின்ட்மென்ட் விரைவில் வருகிறது:\n\n👨‍⚕️ *மருத்துவர்:* டாக். {1} {2}\n⏰ *நேரம்:* {3} (சுமார் 2 மணி நேரத்தில்)\n🔢 *வரிசை எண்:* #{4}\n\nபுறப்படத் தயாராகுங்கள்.\n10 நிமிடங்கள் முன்னதாக வரவும்.\n\nவிரைவில் சந்திப்போம்! 👋
q.missed=வணக்கம் {0}, இன்று {1} உடனான உங்கள் அப்பாயின்ட்மென்ட்டில் உங்களை எதிர்பார்த்தோம்.\n\nபரவாயில்லை - புதிய நேரத்தைப் பதிவு செய்ய எப்போது வேண்டுமானாலும் "Hi" அனுப்பவும்.
q.turn=*{0}, உங்கள் முறை கிட்டத்தட்ட வந்துவிட்டது!* 🔔\n\nஇப்போது உங்களுக்கு முன் யாரும் இல்லை. {1} அறைக்கு வெளியே தயாராக இருங்கள் - விரைவில் அழைக்கப்படுவீர்கள்.
q.near.1=வணக்கம் {0}, {1} இடம் உங்களுக்கு முன் *1 நோயாளி* மட்டுமே உள்ளார். ⏳\n\nஇப்போதே கிளினிக்கிற்குப் புறப்படவும். மதிப்பிடப்பட்ட நேரம்: *{2}*.
q.near.2=வணக்கம் {0}, {1} இடம் உங்களுக்கு முன் *2 நோயாளிகள்* மட்டுமே உள்ளனர். ⏳\n\nஇப்போதே கிளினிக்கிற்குப் புறப்படவும். மதிப்பிடப்பட்ட நேரம்: *{2}*.
q.late=வணக்கம் {0}, {1} இன்று சுமார் *{2} நிமிடங்கள்* தாமதமாக இருக்கிறார். 🙏\n\nஉங்களுக்கு முன் {3} நோயாளிகள் உள்ளனர். புதிய மதிப்பீடு: *{4}*.\nவரிசையில் உங்கள் இடத்தை அறிய எப்போது வேண்டுமானாலும் *status* அனுப்பவும்.
q.slot=வணக்கம் {0}, {1} உடனான உங்கள் நேரம் ({2}) வந்துவிட்டது. ⏰\n\nஉங்களுக்கு முன் {3} நோயாளிகள் உள்ளனர் - மதிப்பிடப்பட்ட நேரம் *{4}*.
rx.ready=வணக்கம் {0}, *{1}* அவர்களின் உங்கள் மருந்துச் சீட்டு தயாராக உள்ளது. 📄\n\nமருந்துச் சீட்டு எண்: *{2}*\nபதிவிறக்கவும் (PDF, 7 நாட்களுக்குச் செல்லும்):\n{3}\n\nஇதை மருந்தகத்தில் காட்டி, அங்கேயே மருந்துகளைப் பெறுங்கள். விரைவில் குணமடையுங்கள்!

