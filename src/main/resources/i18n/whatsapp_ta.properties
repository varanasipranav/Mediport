reg.dob_prompt=நன்று! இப்போது உங்கள் *பிறந்த தேதியை* உள்ளிடவும் 📅\n\n*வடிவம்:* DD/MM/YYYY\n*உதாரணம்:* 15/05/1990\n\nஉங்கள் பிறந்த தேதியை உள்ளிடவும்:
