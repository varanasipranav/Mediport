who.intro.one=மீண்டும் வரவேற்கிறோம்! 👋 உங்கள் எண்ணில் இந்தச் சுயவிவரம் கிடைத்தது:\n\n{0}\nநீங்கள் இவருக்கு பதிவு செய்யலாம், அல்லது குடும்ப உறுப்பினரை (எ.கா. குழந்தை) சேர்க்கலாம்.
who.intro.many=மீண்டும் வரவேற்கிறோம்! 👋 உங்கள் எண்ணில் இந்தச் சுயவிவரங்கள் கிடைத்தன:\n\n{0}\nநீங்கள் இவர்களில் யாருக்கும் பதிவு செய்யலாம், அல்லது குடும்ப உறுப்பினரை (எ.கா. குழந்தை) சேர்க்கலாம்.
