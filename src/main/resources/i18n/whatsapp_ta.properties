reg.dob_invalid=❌ பிறந்த தேதி சரியில்லை.\n\n*DD/MM/YYYY* வடிவத்தில் உள்ளிடவும்\nஉதாரணம்: 15/05/1990\n\nகவனிக்கவும்:\n• நாள் 01-31 இடையே இருக்க வேண்டும்\n• மாதம் 01-12 இடையே இருக்க வேண்டும்\n• ஆண்டு சரியாக இருக்க வேண்டும் (எதிர்காலம் அல்ல)\n• வயது 1-120 இடையே இருக்க வேண்டும்
