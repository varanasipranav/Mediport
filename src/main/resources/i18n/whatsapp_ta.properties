welcome=🏥 *{0} க்கு வரவேற்கிறோம்!*\n\nவணக்கம் {1}! 👋\n\nநான் உங்கள் மெய்நிகர் உதவியாளர். நான் உங்களுக்கு இவற்றில் உதவ முடியும்:\n\n📅 அப்பாயின்ட்மென்ட் பதிவு செய்தல்\n👁️ உங்கள் அப்பாயின்ட்மென்ட்களைப் பார்த்தல்\n❌ அப்பாயின்ட்மென்ட் ரத்து செய்தல்\n🔄 அப்பாயின்ட்மென்ட் தேதியை மாற்றுதல்\n\nதொடங்கலாம்!
