reg.success=🎉 *பதிவு வெற்றிகரமாக முடிந்தது!*\n\nஎங்கள் மருத்துவமனைக்கு வரவேற்கிறோம், *{0}*!\n\nஉங்கள் நோயாளி சுயவிவரம் உருவாக்கப்பட்டது.\nநோயாளி எண்: *{1}*\n\nஉங்கள் அப்பாயின்ட்மென்ட்டைப் பதிவு செய்யலாம்! 📅
