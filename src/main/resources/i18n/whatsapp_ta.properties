book.success=🎉 *அப்பாயின்ட்மென்ட் பதிவானது!*\n\n{0}📋 *விவரங்கள்:*\n• *எண்:* #{1}\n• *மருத்துவர்:* {2}\n• *தேதி:* {3} ({4})\n• *நேரம்:* {5}\n• *வரிசை எண்:* #{6}\n\nதயவுசெய்து 10 நிமிடங்கள் முன்னதாக வரவும். உங்கள் வருகைக்கு முன் நினைவூட்டுவோம், உங்கள் முறை நெருங்கும்போதும் தெரிவிப்போம். 👋
