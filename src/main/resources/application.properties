spring.application.name=webapp

# Local secrets (gitignored). Environment variables also work: DB_PASSWORD, WHATSAPP_ACCESS_TOKEN, WHATSAPP_VERIFY_TOKEN, WHATSAPP_APP_SECRET
spring.config.import=optional:file:./secrets.properties

# Admin bootstrap (first run only). Set APP_ADMIN_PASSWORD; if blank a random one is generated and logged once.
app.admin.password=${APP_ADMIN_PASSWORD:}
app.remember-me.key=${REMEMBER_ME_KEY:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
whatsapp.webhook.test-endpoints-enabled=${WHATSAPP_TEST_ENDPOINTS:false}

# Allow bean definition overriding
spring.main.allow-bean-definition-overriding=true

# Server Configuration
server.port=8081
server.servlet.context-path=
server.servlet.session.timeout=30m

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/hospital?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
file.upload-dir=./uploads

# Storage Configuration
storage.location=upload-dir

# Static Resources Configuration
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.add-mappings=true
spring.mvc.static-path-pattern=/**

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.com.appointment.webapp=DEBUG

# Spring Security

# ========================================
# WhatsApp Business API Configuration
# ========================================
# WhatsApp Cloud API Base URL (Facebook Graph API)
whatsapp.api.base-url=https://graph.facebook.com/v22.0

# Your WhatsApp Business Phone Number ID (get from Facebook Business Manager)
whatsapp.api.phone-number-id=1016183291559791

# Your WhatsApp Business API Access Token (permanent token from Meta Business)
whatsapp.api.access-token=${WHATSAPP_ACCESS_TOKEN:}

# Webhook Verification Token (create your own secure random string)
# IMPORTANT: This is the token YOU create - it can be any secure random string
# Use this same value when configuring webhook in Facebook Developer Console
whatsapp.webhook.verify-token=${WHATSAPP_VERIFY_TOKEN:}

# Webhook App Secret (from Facebook App Dashboard - for signature verification)
# Get this from: developers.facebook.com ? Your App ? Settings ? Basic ? App Secret
whatsapp.webhook.app-secret=${WHATSAPP_APP_SECRET:}

# Conversation timeout (minutes of inactivity before session expires)
whatsapp.conversation.timeout-minutes=30

# WhatsApp API Rate Limiting
whatsapp.api.max-requests-per-minute=60


# ========================================
# Clinic identity (shown on prescriptions, PDFs and the app)
# ========================================
clinic.name=Mediport Clinic
clinic.tagline=Multi-speciality outpatient care
clinic.address=
clinic.phone=
clinic.email=
clinic.registration-no=

# Public base URL of this app (used in prescription QR codes) and the key that signs them
app.public-url=${APP_PUBLIC_URL:http://localhost:8081}
app.rx.signing-key=${RX_SIGNING_KEY:}
