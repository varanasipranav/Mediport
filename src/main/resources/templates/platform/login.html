<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mediport — Operator sign in</title>
    <link rel="stylesheet" th:href="@{/vendor/fa/css/all.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/mediport-tokens.css}"/>
    <link rel="stylesheet" th:href="@{/css/site.css}"/>
</head>
<body class="site">
<div class="wrap" style="max-width:420px;padding-top:90px">
    <div class="brand" style="justify-content:center;margin-bottom:22px">
        <span class="brand-mark"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 3v14M3 10h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></span>
        Mediport platform
    </div>
    <div class="form-card" style="padding:26px">
        <div class="alert bad" th:if="${param.error}">Invalid operator name or password.</div>
        <div class="alert good" th:if="${param.logout}">You have been signed out.</div>
        <form th:action="@{/platform/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="f"><label for="username">Operator</label><input id="username" name="username" type="text" autofocus="autofocus" required="required"/></div>
            <div class="f"><label for="password">Password</label><input id="password" name="password" type="password" required="required"/></div>
            <button class="btn btn-primary" type="submit" style="width:100%">Sign in</button>
        </form>
    </div>
</div>
</body>
</html>
