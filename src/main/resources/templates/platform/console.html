<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mediport — Console</title>
    <link rel="stylesheet" th:href="@{/vendor/fa/css/all.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/mediport-tokens.css}"/>
    <link rel="stylesheet" th:href="@{/css/site.css}"/>
</head>
<body class="site">
<header class="bar">
    <div class="wrap">
        <span class="brand"><span class="brand-mark"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 3v14M3 10h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></span> Mediport platform</span>
        <nav>
            <a class="btn btn-primary btn-sm" th:href="@{/platform/provision}"><i class="fas fa-plus"></i> New clinic</a>
            <form th:action="@{/platform/logout}" method="post" style="margin:0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="btn btn-ghost btn-sm" type="submit">Sign out</button>
            </form>
        </nav>
    </div>
</header>

<main class="wrap console">
    <div class="alert good" th:if="${notice}" th:text="${notice}"></div>
    <div class="alert bad" th:if="${error}" th:text="${error}"></div>

    <div class="stats">
        <div class="stat"><b th:text="${#lists.size(tenants)}">0</b><span>Clinics</span></div>
        <div class="stat"><b th:text="${#lists.size(tenants.?[status == 'ACTIVE'])}">0</b><span>Active</span></div>
        <div class="stat"><b th:text="${#lists.size(requests.?[status == 'NEW'])}">0</b><span>New demo requests</span></div>
        <div class="stat"><b th:text="${#lists.size(requests)}">0</b><span>All requests</span></div>
    </div>

    <h2>Demo requests</h2>
    <table class="t">
        <thead><tr><th>Clinic</th><th>Contact</th><th>Details</th><th>Status</th><th></th></tr></thead>
        <tbody>
        <tr th:each="r : ${requests}">
            <td><b th:text="${r.clinicName}">Clinic</b><div class="muted" th:text="${#temporals.format(r.createdAt, 'dd MMM yyyy HH:mm')}">date</div></td>
            <td><span th:text="${r.contactName}">Name</span><div class="muted" th:text="${r.phone}">phone</div><div class="muted" th:text="${r.email}">email</div></td>
            <td><span class="muted" th:text="${(r.city ?: '-') + ' · doctors: ' + (r.doctorsCount ?: '-')}">city</span>
                <div class="muted" th:if="${r.message}" th:text="${r.message}"></div></td>
            <td><span class="pill" th:classappend="${r.status}" th:text="${r.status}">NEW</span><div class="muted" th:if="${r.siteId}" th:text="${r.siteId}"></div></td>
            <td>
                <div class="actions" th:if="${r.status == 'NEW'}">
                    <a class="btn btn-primary btn-sm" th:href="@{/platform/provision(requestId=${r.id})}">Approve</a>
                    <form th:action="@{/platform/requests/{id}/reject(id=${r.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn btn-ghost btn-sm" type="submit">Reject</button>
                    </form>
                    <form th:action="@{/platform/requests/{id}/reject(id=${r.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="as" value="SPAM"/>
                        <button class="btn btn-danger btn-sm" type="submit">Spam</button>
                    </form>
                </div>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(requests)}"><td colspan="5" class="muted">No demo requests yet.</td></tr>
        </tbody>
    </table>

    <h2>Clinics</h2>
    <table class="t">
        <thead><tr><th>Site</th><th>Name</th><th>Status</th><th>WhatsApp number id</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="t : ${tenants}">
            <td><b th:text="${t.siteId}">site</b><div class="muted" th:text="${t.schemaName} + ' · v' + ${t.schemaVersion ?: '?'}">schema</div></td>
            <td th:text="${t.displayName}">Name</td>
            <td><span class="pill" th:classappend="${t.status}" th:text="${t.status}">ACTIVE</span>
                <div class="muted" th:if="${t.lastError}" th:text="${t.lastError}" style="color:var(--status-missed)"></div></td>
            <td>
                <form th:action="@{/platform/tenants/{s}/whatsapp(s=${t.siteId})}" method="post" class="actions">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="text" name="waPhoneNumberId" th:value="${t.waPhoneNumberId}" placeholder="phone number id" style="width:150px;padding:5px 8px;border:1px solid var(--border-strong);border-radius:8px"/>
                    <input type="password" name="waAccessToken" placeholder="new token (blank = keep none)" style="width:150px;padding:5px 8px;border:1px solid var(--border-strong);border-radius:8px"/>
                    <button class="btn btn-ghost btn-sm" type="submit">Save</button>
                </form>
            </td>
            <td>
                <div class="actions">
                    <form th:if="${t.status == 'ACTIVE'}" th:action="@{/platform/tenants/{s}/suspend(s=${t.siteId})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn btn-danger btn-sm" type="submit">Suspend</button>
                    </form>
                    <form th:if="${t.status == 'SUSPENDED'}" th:action="@{/platform/tenants/{s}/activate(s=${t.siteId})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn btn-primary btn-sm" type="submit">Activate</button>
                    </form>
                    <form th:action="@{/platform/tenants/{s}/retry-migration(s=${t.siteId})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn btn-ghost btn-sm" type="submit">Re-run migrations</button>
                    </form>
                    <form th:action="@{/platform/tenants/{s}/reset-admin(s=${t.siteId})}" method="post" onsubmit="return confirm('Generate a new admin password for this clinic?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn btn-ghost btn-sm" type="submit">Reset admin password</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
