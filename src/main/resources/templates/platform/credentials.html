<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="robots" content="noindex"/>
    <title>Mediport — Clinic ready</title>
    <link rel="stylesheet" th:href="@{/vendor/fa/css/all.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/mediport-tokens.css}"/>
    <link rel="stylesheet" th:href="@{/css/site.css}"/>
</head>
<body class="site">
<div class="wrap" style="max-width:600px;padding:50px 20px">
    <div class="form-card" style="max-width:none">
        <div class="ico" style="background:var(--brand-accent-50);color:#047857;margin-bottom:12px"><i class="fas fa-check"></i></div>
        <h2 style="font-size:24px" th:text="${result.tenant.displayName} + ' is ready'">Clinic is ready</h2>
        <div class="alert bad" style="margin-top:16px"><b>Copy these now.</b> The password is shown only once and is not stored anywhere in readable form.</div>
        <div class="cred"><small>Sign-in page</small><span id="url" th:text="${signInUrl}">url</span></div>
        <div class="cred"><small>Login</small><span th:text="${result.adminLogin}">admin@code</span></div>
        <div class="cred"><small>Password</small><span th:text="${result.adminPassword}">password</span></div>
        <p class="muted" th:if="${result.sampleDoctorsNote}" th:text="${result.sampleDoctorsNote}"></p>
        <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
            <button type="button" class="btn btn-primary" id="copy"><i class="fas fa-copy"></i> Copy details</button>
            <a class="btn btn-ghost" th:href="@{/platform}">Back to console</a>
        </div>
    </div>
</div>
<script>
document.getElementById('copy').addEventListener('click', function () {
    var rows = document.querySelectorAll('.cred');
    var text = 'Sign-in: ' + rows[0].innerText.replace(/^.*\n/, '') + '\nLogin: ' + rows[1].innerText.replace(/^.*\n/, '') + '\nPassword: ' + rows[2].innerText.replace(/^.*\n/, '');
    navigator.clipboard.writeText(text).then(function () { document.getElementById('copy').textContent = 'Copied'; });
});
</script>
</body>
</html>
