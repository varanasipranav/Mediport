<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      layout:decorate="layout">
<head>
    <title>Dashboard</title>
    <link rel="shortcut icon" type="image/png"
          th:href="@{/resources/images/logo.png}" />

</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid" >
        <div class="row">
            <div class="col-lg-3 col-6"
                 sec:authorize="hasAnyRole('ROLE_REQ_CR')">
                <div class="small-box bg-warning">
                    <div class="inner">
                        <h3 th:text="${unreleasedPR}"></h3>
                        <p>Unrelease PR LIST</p>
                    </div>
                    <div class="icon">
                        <i class="fa fa-folder-open"></i>
                    </div>
                    <a href="/prCreate/list?status=U" class="small-box-footer">More info <i
                            class="fas fa-arrow-circle-right"></i></a>
                </div>
            </div>
            <div class="col-lg-3 col-6"
                 sec:authorize="hasAnyRole('ROLE_REQ_CR')">
                <div class="small-box bg-warning">
                    <div class="inner">
                        <h3 th:text="${pendingPR}"></h3>
                        <p>Pending PR LIST</p>
                    </div>
                    <div class="icon">
                        <i class="fa fa-folder-open"></i>
                    </div>
                    <a href="/prCreate/list?status=P" class="small-box-footer">More info <i
                            class="fas fa-arrow-circle-right"></i></a>
                </div>
            </div>

            <div class="col-lg-3 col-6"
                 sec:authorize="hasAnyRole('ROLE_REQ_CR')">
                <div class="small-box bg-warning">
                    <div class="inner">
                        <h3 th:text="${releasedPR}"></h3>
                        <p>Released PR LIST</p>
                    </div>
                    <div class="icon">
                        <i class="fa fa-folder-open"></i>
                    </div>
                    <a href="/prCreate/list?status=R" class="small-box-footer">More info <i
                            class="fas fa-arrow-circle-right"></i></a>
                </div>
            </div>

        </div><!--row  close-->

        <!-- SES Section -->
        <div class="row mt-3">
            <div class="col-lg-3 col-6"
                 sec:authorize="hasAnyRole('ROLE_REQ_CR')">
                <div class="small-box bg-info">
                    <div class="inner">
                        <h3 th:text="${unreleasedSES}"></h3>
                        <p>Unreleased SES LIST</p>
                    </div>
                    <div class="icon">
                        <i class="fa fa-file-alt"></i>
                    </div>
                    <a href="/ses/list" class="small-box-footer">More info <i
                            class="fas fa-arrow-circle-right"></i></a>
                </div>
            </div>
            <div class="col-lg-3 col-6"
                 sec:authorize="hasAnyRole('ROLE_REQ_CR')">
                <div class="small-box bg-info">
                    <div class="inner">
                        <h3 th:text="${pendingSES}"></h3>
                        <p>Pending SES LIST</p>
                    </div>
                    <div class="icon">
                        <i class="fa fa-file-alt"></i>
                    </div>
                    <a href="/ses/list" class="small-box-footer">More info <i
                            class="fas fa-arrow-circle-right"></i></a>
                </div>
            </div>
            <div class="col-lg-3 col-6"
                 sec:authorize="hasAnyRole('ROLE_REQ_CR')">
                <div class="small-box bg-info">
                    <div class="inner">
                        <h3 th:text="${releasedSES}"></h3>
                        <p>Released SES LIST</p>
                    </div>
                    <div class="icon">
                        <i class="fa fa-file-alt"></i>
                    </div>
                    <a href="/ses/list" class="small-box-footer">More info <i
                            class="fas fa-arrow-circle-right"></i></a>
                </div>
            </div>
        </div><!--row  close-->

        <!-- Chart Section -->

        <div class="row mt-4">
            <div class="col-lg-6 col-md-6 col-sm-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">PR Status Summary</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="prChart" style="width:100%; height:300px;"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-lg-6 col-md-6 col-sm-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">SES Status Summary</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="sesChart" style="width:100%; height:300px;"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <!-- Chart Sectionend -->

    </div>
</div>










<div layout:fragment="scriptContent">
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // PR Chart
            const prCtx = document.getElementById('prChart').getContext('2d');
            const releasedPR = [[${releasedPR}]];
            const unreleasedPR = [[${unreleasedPR}]];

            new Chart(prCtx, {
                type: 'doughnut', // alternatives: 'pie', 'bar'
                data: {
                    labels: ['Released PRs', 'Unreleased PRs'],
                    datasets: [{
                        data: [releasedPR, unreleasedPR],
                        backgroundColor: [
                            '#033882', // Aragen Blue
                            '#ff5f00'  // Aragen Orange
                        ],
                        borderColor: '#ffffff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: { size: 14 }
                            }
                        },
                        tooltip: {
                            enabled: true,
                            backgroundColor: '#fff',
                            titleColor: '#333',
                            bodyColor: '#333',
                            borderColor: '#ccc',
                            borderWidth: 1
                        }
                    }
                }
            });

            // SES Chart
            const sesCtx = document.getElementById('sesChart').getContext('2d');
        const releasedSES = /*[[${releasedSES}]]*/ 0;
const unreleasedSES = /*[[${unreleasedSES}]]*/ 0;
const pendingSES = /*[[${pendingSES}]]*/ 0;

            new Chart(sesCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Released SES', 'Unreleased SES', 'Pending SES'],
                    datasets: [{
                        data: [releasedSES, unreleasedSES, pendingSES],
                        backgroundColor: [
                            '#28a745', // Green for Released
                            '#ffc107', // Yellow for Unreleased
                            '#dc3545'  // Red for Pending
                        ],
                        borderColor: '#ffffff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: { size: 14 }
                            }
                        },
                        tooltip: {
                            enabled: true,
                            backgroundColor: '#fff',
                            titleColor: '#333',
                            bodyColor: '#333',
                            borderColor: '#ccc',
                            borderWidth: 1
                        }
                    }
                }
            });
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/raphael/2.1.0/raphael-min.js"></script>
    <script th:src="@{/resources/plugins/morris/morris.min.js}"></script>
    <script th:src="@{/resources/plugins/sparkline/jquery.sparkline.min.js}"></script>
    <script th:src="@{/resources/plugins/jvectormap/jquery-jvectormap-1.2.2.min.js}"></script>
    <script th:src="@{/resources/plugins/jvectormap/jquery-jvectormap-world-mill-en.js}"></script>
    <script th:src="@{/resources/plugins/knob/jquery.knob.js}"></script>
    <script th:src="@{/resources/dist/js/pages/dashboard.js}"></script>

</div>

</body>
</html>
