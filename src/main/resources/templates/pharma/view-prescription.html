<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Prescription</title>
    <link rel="stylesheet" th:href="@{/css/rx.css}"/>
</head>
<body>
<div layout:fragment="content">

    <div class="mp-page-header">
        <div>
            <h1 class="mp-page-title">Prescription</h1>
            <div class="mp-page-subtitle"><span class="font-mono" th:text="${rxNumber}">RX-2026-00001</span> &middot; issued <span th:text="${#temporals.format(prescription.createdAt, 'dd MMM yyyy, HH:mm')}"></span></div>
        </div>
    </div>

    <div th:replace="~{fragments/flash :: flash}"></div>

    <div class="rx-actions">
        <a th:href="@{/pharma/dashboard}" class="mp-btn mp-btn-secondary"><i class="fas fa-arrow-left"></i> Back to queue</a>
        <span class="grow"></span>
        <form th:action="@{/pharma/prescriptions/{id}/mark-printed(id=${prescription.id})}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="mp-btn mp-btn-success"><i class="fas fa-check"></i> Mark as printed</button>
        </form>
        <form th:action="@{/prescriptions/{id}/send-whatsapp(id=${prescription.id})}" method="post" style="display:inline;margin:0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="mp-btn mp-btn-secondary" style="color:var(--wa-text);"><i class="fab fa-whatsapp" style="color:var(--wa-green);"></i> Send on WhatsApp</button>
        </form>
        <a th:href="@{/prescriptions/{id}/pdf(id=${prescription.id})}" target="_blank" class="mp-btn mp-btn-secondary"><i class="fas fa-file-pdf"></i> Download PDF</a>
        <button type="button" class="mp-btn mp-btn-primary" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
    </div>

    <th:block th:replace="~{fragments/rx-document :: document}"></th:block>
</div>
</body>
</html>
