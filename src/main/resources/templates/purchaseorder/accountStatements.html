<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
	layout:decorate="layout">
<head>
<title>Account Statement</title>
<style type="text/css">
#rejectModal {
	width: 50%;
	height: 40%;
	margin-left: 35%;
	padding: 0;
}

#apprModal {
	width: 90%;
	height: 90%;
	margin-left: 5%;
	padding: 0;
}

.modal-content {
	height: auto;
	min-height: 100%;
	border-radius: 0;
}

.group {
	/* background: #eeeeee; */
	
}

#nullifyModal {
	z-index: 1080 !important;
}
</style>
<style>
.dataTables_filter {
	display: inline;
	float: right;
}

.dataTables_length {
	display: inline;
}

.dt-buttons {
	margin-left: 25%;
}

.input-group-addon {
	padding: 2px 12px !important;
}

.text-primary {
	color: #2B56A5 !important;
}
</style>

<link rel="stylesheet" type="text/css"
	href="../../../../resources/dist/css/table.css">
</head>
<body>
	<section layout:fragment="header">
		<div class="container-fluid">
			<div class="row mb-2">
				<div class="col-sm-6">
					<h1 class="text-primary text-bold text-lg ml-2">Account Statement</h1>
				</div>
				<div class="col-sm-6">
					<ol class="breadcrumb float-sm-right">
						<li class="breadcrumb-item"><a href="#">Account Statement</a></li>
						<li class="breadcrumb-item active">List</li>
					</ol>
				</div>
			</div>
		</div>
		<!-- /.container-fluid -->
	</section>
	<div class="container-fluid" layout:fragment="content">
		<div th:if="${success!= null}"
			class="alert alert-success alert-dismissible auto-dismiss">
			<i class="icon fa fa-check"></i> <span th:text="${success}"></span>
		</div>
		<div th:if="${error!= null}"
			class="alert alert-danger alert-dismissible auto-dismiss">
			<i class="icon fa fa-check"></i> <span th:text="${error}"></span>
		</div>
		<div class="row">
			<div class="col-12">
				<div class="card">
					<div class="card-body">
											<form role="form" th:object="${listSelector}"
							th:action="@{/invoice/account-statement}" method="get" name="myForm">
							<div class="table-responsive hidden-xs">
								<table class="table table-striped" style="margin-bottom: 1%;">
									<tbody>
										<tr>
											<td><label>From Date:</label>
												<div class="input-group mb-3">
													<span class="input-group-text border-right-0"
														id="basic-addon1"><i class="fa fa-calendar"></i></span> <input
														type="text" th:field="*{fromDate}" class="form-control datepicker"
														placeholder="Start Date" aria-label="Username"
														aria-describedby="basic-addon1">
												</div></td>
											<td><label>To Date:</label>
												<div class="input-group mb-3">
													<span class="input-group-text border-right-0"
														id="basic-addon1"><i class="fa fa-calendar"></i></span> <input
														type="text" th:field="*{toDate}" class="form-control datepicker"
														placeholder="End Date" aria-label="Username"
														aria-describedby="basic-addon1">
												</div></td>

											<td>
												<div
													class="d-flex align-items-center justify-content-center mt-3">
													<button type="submit"
														class="btn btn-primary pull-right mt-3 w-100">
														Apply
														<!-- <i class="fa fa-paper-plane ml-4"></i> -->
													</button>
												</div>
											</td>
										</tr>

									</tbody>
								</table>
							</div>
						</form>

						<div class="table-responsive">
							<table id="invoiceReportTable"
								class="styled-table table text-center table-striped  table-bordered nowrap"
								cellspacing="0" width="100%">
								<thead >
									<tr>
										<th rowspan="2">Posting Date</th>
										<th rowspan="2">Particlulars</th>
										<th rowspan="2">Bill Reference</th>
										<th colspan="2">Trans Amount</th>
										<th rowspan="2">Balance</th>
									</tr>
									<tr >
										<th>Debit</th>
										<th>Credit</th>
									</tr>
								</thead>
								<tbody>
									
									 <tr th:each="statement, reportind : *{statementList}">
										<td th:text="${statement.postingDate}"></td>
										<td th:text="${statement.particulars}"></td>
										<td th:text="${statement.billReference}"></td>
										<td th:text="${#numbers.formatDecimal(statement.debitAmount, 2, 2)}"  class="amount-cell"></td>
										<td th:text="${#numbers.formatDecimal(statement.creditAmount, 2, 2)}" class="amount-cell"></td>
										<td th:text="${#numbers.formatDecimal(statement.balance, 2, 2)}"></td>
									</tr>

								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div layout:fragment="scriptContent">
		<script type="text/javascript">
			$(document)
					.ready(
							function() {
								$('.datepicker').datepicker({
									autoclose : true,
									format : 'dd/mm/yyyy'
								});
								$('#invoiceReportTable')
								.DataTable(
										{
											dom : 'lBfrtip',
											buttons : [
													{
														extend : 'excel',
														text : '<i class="fa fa-file-excel" style="color:green"> </i> EXCEL',
														title : null,
														filename : 'Download'
													},
													{
														extend : 'pdf',
														text : '<i class="fa fa-file-pdf" style="color:red"></i> PDF',
														title : null
													} ],

											language : {
												lengthMenu : '_MENU_ entries per page',
												paginate : {
													previous : '‹',
													next : '›'
												}
											}

										}

								);

							});
		</script>

	</div>

</body>
</html>
