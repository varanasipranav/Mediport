<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Create Attendant</title>
    <style>
    :root{ --primary-dark: #2D3748; --primary: #4A5568; --accent: #3B82F6; --accent-light: #60A5FA; --success: #10B981; --warning: #F59E0B; --danger: #EF4444; --light-bg: #F7FAFC; --border: #E2E8F0; --text-primary: #1A202C; --text-secondary: #718096; --muted: rgba(26,32,44,0.65); }
    .content-wrapper .container-fluid { padding-left: 28px; padding-right: 28px; }
    h1, h2, h3, h4, h5 { color: var(--text-primary); font-family: 'Segoe UI', system-ui, -apple-system, 'Inter', sans-serif; }
    .breadcrumb { background: transparent !important; padding: 0 !important; margin: 0 !important; }
    .breadcrumb .breadcrumb-item a { color: var(--accent) !important; text-decoration: none !important; }
    .breadcrumb .breadcrumb-item.active { color: var(--muted) !important; }
    .card { border-radius: 8px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.08); background: #ffffff; }
    .card-header { background: #f8f9fa; border-bottom: 1px solid var(--border); padding: 20px 24px; font-weight: 700; color: var(--text-primary); }
    .card-body { padding: 24px; }
    .btn { border-radius: 6px; padding: 10px 20px; font-weight: 600; font-size: 14px; min-width: 120px; }
    .btn-lg { padding: 12px 28px; font-size: 15px; min-width: 140px; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-light); border-color: var(--accent-light); }
    .btn-success { background: var(--success); border-color: var(--success); color: #fff; }
    .btn-warning { background: var(--warning); border-color: var(--warning); color: #212529; }
    .btn-secondary { background: #6c757d; border-color: #6c757d; color: #fff; }
    .form-control, .form-select { border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font-size: 14px; }
    .form-control:focus, .form-select:focus { border-color: var(--accent); box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.25); }
    .form-label { font-weight: 600; margin-bottom: 6px; color: var(--text-primary); font-size: 14px; }
    </style>
</head>
<body>

<div layout:fragment="header">
    <div class="container-fluid">
        <h1 style="font-size: 1.75rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.5rem;"
            th:text="${isEdit != null && isEdit} ? 'Edit Attendant' : 'Create Attendant'">Create Attendant</h1>
        <ol class="breadcrumb" style="background: transparent; padding: 0; margin: 0; font-size: 0.875rem;">
            <li class="breadcrumb-item"><a th:href="@{/dashboard}" style="color: var(--primary-color); text-decoration: none;">Home</a></li>
            <li class="breadcrumb-item"><a th:href="@{/admin/users/list}" style="color: var(--primary-color); text-decoration: none;">Users</a></li>
            <li class="breadcrumb-item active" th:text="${isEdit != null && isEdit} ? 'Edit Attendant' : 'Create Attendant'">Create Attendant</li>
        </ol>
    </div>
</div>

<div layout:fragment="content">
    <div class="container-fluid">
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row">
            <div class="col-lg-8 offset-lg-2">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-user-tie"></i> Attendant Information</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="${isEdit != null && isEdit} ? @{/admin/users/update/{id}(id=${user.id})} : @{/admin/users/create-attendant}"
                              method="post" th:object="${user}" onsubmit="return validateForm()">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <!-- Login Credentials -->
                            <div class="mb-4">
                                <h6 class="border-bottom pb-2 mb-3"><i class="fas fa-key me-2"></i>Login Credentials</h6>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="username" class="form-label">Username <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="username" th:field="*{username}"
                                               th:readonly="${isEdit != null && isEdit}" required>
                                        <small class="text-muted" th:if="${isEdit != null && isEdit}">Username cannot be changed</small>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="password" class="form-label">
                                            Password
                                            <span class="text-danger" th:if="${isEdit == null || !isEdit}">*</span>
                                            <span class="text-muted" th:if="${isEdit != null && isEdit}">(leave blank to keep current)</span>
                                        </label>
                                        <div th:if="${isEdit != null && isEdit}">
                                            <input type="password" class="form-control" id="password" name="newPassword" minlength="6">
                                        </div>
                                        <div th:if="${isEdit == null || !isEdit}">
                                            <input type="password" class="form-control" id="password" th:field="*{password}" name="password" required minlength="6">
                                        </div>
                                        <small class="text-muted d-block mt-1">Minimum 6 characters</small>
                                    </div>
                                </div>
                            </div>

                            <!-- Personal Information -->
                            <div class="mb-4">
                                <h6 class="border-bottom pb-2 mb-3"><i class="fas fa-user me-2"></i>Personal Information</h6>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="firstName" class="form-label">First Name <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="firstName" th:field="*{firstName}" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="lastName" class="form-label">Last Name <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="lastName" th:field="*{lastName}" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="phoneNumber" class="form-label">Phone Number <span class="text-danger">*</span></label>
                                        <input type="tel" class="form-control" id="phoneNumber" th:field="*{phoneNumber}" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="email" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="email" th:field="*{email}">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="gender" class="form-label">Gender</label>
                                        <select class="form-select" id="gender" th:field="*{gender}">
                                            <option value="">Select Gender</option>
                                            <option value="Male">Male</option>
                                            <option value="Female">Female</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="dateOfBirth" class="form-label">Date of Birth</label>
                                        <input type="date" class="form-control" id="dateOfBirth" th:field="*{dateOfBirth}">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="department" class="form-label">Department</label>
                                        <select class="form-select" id="department" th:field="*{department}">
                                            <option value="">Select Department</option>
                                            <option value="Reception">Reception</option>
                                            <option value="Front Desk">Front Desk</option>
                                            <option value="OPD">OPD</option>
                                            <option value="Emergency">Emergency</option>
                                        </select>
                                    </div>
                                    <div class="col-12 mb-3">
                                        <label for="address" class="form-label">Address</label>
                                        <textarea class="form-control" id="address" th:field="*{address}" rows="2"></textarea>
                                    </div>
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="d-flex justify-content-between mt-4 pt-3 border-top">
                                <a th:href="@{/admin/users/list}" class="btn btn-secondary btn-lg">
                                    <i class="fas fa-times me-2"></i>Cancel
                                </a>
                                <button type="submit" class="btn btn-warning btn-lg">
                                    <i th:class="${isEdit != null && isEdit} ? 'fas fa-save me-2' : 'fas fa-user-plus me-2'"></i>
                                    <span th:text="${isEdit != null && isEdit} ? 'Update Attendant' : 'Create Attendant'">Create Attendant</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="scriptContent">
    <script th:inline="javascript">
        /*<![CDATA[*/
        const successMsg = /*[[${success}]]*/ null;
        const errorMsg = /*[[${error}]]*/ null;
        if (successMsg) { Swal.fire({icon:'success', title:'Success', text: successMsg, timer:2500}).then(()=>{ window.location.href='/admin/users/list'}); }
        if (errorMsg) { Swal.fire({icon:'error', title:'Error', text: errorMsg}); }

        function validateForm() {
            const username = document.getElementById('username').value.trim();
            const password = document.querySelector('input[name="newPassword"]') ? document.querySelector('input[name="newPassword"]').value : document.getElementById('password').value;
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            const isEdit = /*[[${isEdit}]]*/ false;

            if (!username || !firstName || !lastName || !phoneNumber) {
                Swal.fire({icon:'warning', title:'Missing Fields', text:'Please fill in all required fields marked with *'});
                return false;
            }

            if (!isEdit && !password) { Swal.fire({icon:'warning', title:'Password required', text:'Password required for new users'}); return false; }
            if (password && password.length < 6) { Swal.fire({icon:'warning', title:'Weak password', text:'Password must be at least 6 chars'}); return false; }
            return true;
        }

        // Removed AJAX fetch submit: allow native form submit to preserve session/CSRF
        /* No additional JS needed here - form has onsubmit="return validateForm()" */
        /*]]>*/
    </script>
</div>

</body>
</html>
