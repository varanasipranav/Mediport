<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Staff &amp; patients</title>
</head>
<body>
<div layout:fragment="content">

    <div class="mp-page-header">
        <div>
            <h1 class="mp-page-title">Staff &amp; patients</h1>
            <div class="mp-page-subtitle"><span th:text="${#lists.size(users)}">0</span> account<span th:if="${#lists.size(users) != 1}">s</span><span th:if="${roleFilter != null and !#strings.isEmpty(roleFilter)}"> · filtered</span></div>
        </div>
        <div class="mp-page-actions">
            <form th:action="@{/admin/users/seed-demo-doctors}" method="post" style="margin:0;" onsubmit="return confirm('Add six sample doctors (different specialities) with schedules for the next 30 days?');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="mp-btn mp-btn-ghost" title="For demos and first-time setup"><i class="fas fa-magic"></i> Add sample doctors</button>
            </form>
            <a th:href="@{/admin/users/create-doctor}" class="mp-btn mp-btn-secondary"><i class="fas fa-user-md"></i> Doctor</a>
            <a th:href="@{/admin/users/create-patient}" class="mp-btn mp-btn-secondary"><i class="fas fa-user-injured"></i> Patient</a>
            <a th:href="@{/admin/users/create-attendant}" class="mp-btn mp-btn-secondary"><i class="fas fa-user-check"></i> Front desk</a>
            <a th:href="@{/admin/users/create-pharma}" class="mp-btn mp-btn-primary"><i class="fas fa-plus"></i> Pharmacy</a>
        </div>
    </div>

    <div th:replace="~{fragments/flash :: flash}"></div>

    <div style="padding:0 32px 32px;">
        <div class="mp-card">
            <form method="get" th:action="@{/admin/users/list}" class="ul-filter">
                <div class="ul-tabs">
                    <a th:href="@{/admin/users/list(search=${search})}" th:classappend="${roleFilter == null or #strings.isEmpty(roleFilter)} ? 'active'">All</a>
                    <a th:each="r : ${ {'DOCTOR','PATIENT','ATTENDANT','PHARMA','ADMIN'} }" th:href="@{/admin/users/list(roleFilter=${r},search=${search})}"
                       th:classappend="${roleFilter == r} ? 'active'" th:text="${#strings.capitalize(#strings.toLowerCase(r))}">Role</a>
                </div>
                <input type="hidden" name="roleFilter" th:value="${roleFilter}"/>
                <div style="position:relative;flex:1;max-width:340px;">
                    <i class="fas fa-search" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-soft);font-size:13px;"></i>
                    <input type="text" name="search" th:value="${search}" class="mp-input" placeholder="Search name, phone, email…" style="padding-left:34px;"/>
                </div>
            </form>

            <div th:if="${#lists.isEmpty(users)}" style="padding:56px 24px;text-align:center;color:var(--text-muted);">
                <div style="font-weight:700;color:var(--text-strong);font-size:16px;">No accounts match</div>
                <div style="margin-top:4px;">Try a different filter or search.</div>
            </div>

            <div style="overflow-x:auto;" th:unless="${#lists.isEmpty(users)}">
                <table class="ul-table">
                    <thead><tr><th>Person</th><th>Role</th><th>Contact</th><th>ID</th><th>Status</th><th></th></tr></thead>
                    <tbody>
                        <tr th:each="u : ${users}" th:classappend="${!u.enabled} ? 'off'">
                            <td>
                                <div class="ul-person">
                                    <span class="mp-avatar" th:text="${#strings.substring(u.firstName != null ? u.firstName : u.username,0,1) + (u.lastName != null and !#strings.isEmpty(u.lastName) ? #strings.substring(u.lastName,0,1) : '')}">AB</span>
                                    <div>
                                        <div class="ul-name" th:text="${u.firstName + ' ' + u.lastName}">Name</div>
                                        <div class="ul-sub" th:text="${'@' + u.username}">@user</div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <span th:each="role : ${u.roles}" class="mp-pill"
                                      th:classappend="${role.name == 'ADMIN'} ? 'mp-pill-missed' : (${role.name == 'DOCTOR'} ? 'mp-pill-consult' : (${role.name == 'PATIENT'} ? 'mp-pill-completed' : (${role.name == 'PHARMA'} ? 'mp-pill-delayed' : 'mp-pill-waiting')))"
                                      th:text="${#strings.capitalize(#strings.toLowerCase(role.name))}">Role</span>
                                <div class="ul-sub" th:if="${u.specialization != null and !#strings.isEmpty(u.specialization)}" th:text="${u.specialization}" style="margin-top:4px;">spec</div>
                            </td>
                            <td>
                                <div th:text="${u.phoneNumber}">phone</div>
                                <div class="ul-sub" th:text="${u.email}">email</div>
                                <div class="ul-sub" th:if="${u.whatsappPhone != null}" style="color:var(--wa-text);"><i class="fab fa-whatsapp"></i> <span th:text="${u.whatsappPhone}"></span></div>
                            </td>
                            <td class="font-mono ul-sub" th:text="${u.patientId != null ? u.patientId : u.employeeId}">ID</td>
                            <td>
                                <span class="mp-pill mp-pill-completed" th:if="${u.enabled}">Active</span>
                                <span class="mp-pill mp-pill-missed" th:unless="${u.enabled}">Disabled</span>
                            </td>
                            <td>
                                <div class="ul-actions">
                                    <a th:href="@{/admin/users/edit/{id}(id=${u.id})}" class="mp-btn mp-btn-secondary mp-btn-sm" title="Edit"><i class="fas fa-pen"></i></a>
                                    <form th:action="@{/admin/users/toggle-status/{id}(id=${u.id})}" method="post" style="margin:0;"
                                          th:onsubmit="${u.enabled} ? 'return confirm(\'Disable this account? They will not be able to sign in.\');' : 'return true;'">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="mp-btn mp-btn-secondary mp-btn-sm" th:title="${u.enabled ? 'Disable' : 'Enable'}"><i class="fas" th:classappend="${u.enabled} ? 'fa-user-slash' : 'fa-user-check'"></i></button>
                                    </form>
                                    <form th:action="@{/admin/users/delete/{id}(id=${u.id})}" method="post" style="margin:0;" th:unless="${u.username == 'admin'}"
                                          onsubmit="return confirm('Delete this account permanently? This cannot be undone.');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="mp-btn mp-btn-danger mp-btn-sm" title="Delete"><i class="fas fa-trash"></i></button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <style>
        .ul-filter { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:14px 20px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
        .ul-tabs { display:flex; gap:4px; background:var(--bg-muted); padding:3px; border-radius:8px; flex-wrap:wrap; }
        .ul-tabs a { padding:5px 14px; border-radius:6px; font:600 12px var(--font-body); color:var(--text-muted); }
        .ul-tabs a:hover { text-decoration:none; color:var(--text-strong); }
        .ul-tabs a.active { background:#fff; color:var(--text-strong); box-shadow:0 1px 2px rgba(15,27,45,.1); }
        .ul-table { width:100%; border-collapse:collapse; }
        .ul-table th { text-align:left; font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--text-muted); font-weight:700; padding:11px 16px; background:var(--bg-subtle); border-bottom:1px solid var(--border); }
        .ul-table td { padding:12px 16px; border-bottom:1px solid var(--border); font-size:13.5px; vertical-align:middle; }
        .ul-table tr:last-child td { border-bottom:0; }
        .ul-table tbody tr:hover { background:var(--bg-subtle); }
        .ul-table tr.off { opacity:.6; }
        .ul-person { display:flex; align-items:center; gap:12px; }
        .ul-name { font-weight:700; color:var(--text-strong); }
        .ul-sub { font-size:12px; color:var(--text-muted); }
        .ul-actions { display:flex; gap:6px; justify-content:flex-end; }
    </style>
</div>
</body>
</html>
