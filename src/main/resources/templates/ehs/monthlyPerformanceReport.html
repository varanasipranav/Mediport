<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
	layout:decorate="layout">
<head>
<title>Monthly Performance Report</title>
<style>
.dataTables_filter {
	display: inline;
	float: right;
}

.dataTables_length {
	display: inline;
}

.dt-buttons {
	margin-left: 25%;
}

.input-group-addon {
	padding: 2px 12px !important;
}
</style>
</head>
<body>

	<section layout:fragment="header">
		<div class="container-fluid">
			<div class="row mb-2">
				<div class="col-sm-6">
					<h1>Monthly Performance Report</h1>
				</div>
				<div class="col-sm-6">
					<ol class="breadcrumb float-sm-right">
						<li class="breadcrumb-item"><a href="#">EHS</a></li>
						<li class="breadcrumb-item active">Performance Report</li>
					</ol>
				</div>
			</div>
		</div>
	</section>

	<div class="container-fluid" layout:fragment="content">
		<div class="row">
			<div class="col-12">
				<div class="card">
					<div class="card-body">
						<form role="form" th:action="@{/ehs/monthlyPerformanceReport}"
							method="get">
							<div class="table-responsive hidden-xs">
								<table class="table table-striped" style="margin-bottom: 1%;">
									<tbody>
										<tr>
											<td><label>From Date:</label>
												<div class="input-group date">
													<div class="input-group-addon">
														<i class="fa fa-calendar"></i>
													</div>
													<input type="date" class="form-control" name="fromDate"
														th:value="${#dates.format(fromDate, 'yyyy-MM-dd')}" />
												</div></td>
											<td><label>To Date:</label>
												<div class="input-group date">
													<div class="input-group-addon">
														<i class="fa fa-calendar"></i>
													</div>
													<input type="date" class="form-control" name="toDate"
														th:value="${#dates.format(toDate, 'yyyy-MM-dd')}" />
												</div></td>
											<td sec:authorize="hasAnyRole('ROLE_VEND')"><label>Status</label><br> <select
												class="form-control input-sm" name="status">
													<option value="">All</option>
													<option value="New" th:selected="${status == 'New'}">New</option>
													<option value="SUBMITTED"
														th:selected="${status == 'SUBMITTED'}">SUBMITTED</option>
														<option value="APPROVED"
														th:selected="${status == 'APPROVED'}">APPROVED</option>
														<option value="REJECTED"
														th:selected="${status == 'REJECTED'}">REJECTED</option>
											</select></td>
											<td>
												<button type="submit" class="btn btn-primary pull-right"
													style="margin-right: 5px;">
													Go <i class="fa fa-paper-plane"></i>
												</button>
											</td>
										</tr>
									</tbody>
								</table>
							</div>
						</form>

						<div class="table-responsive">
							<table id="example"
								class="table table-bordered dt-responsive nowrap"
								cellspacing="0" width="100%">
								<thead>
									<tr>
										<th>Doc ID</th>
										<th>Month/Year</th>
										<th>Validity</th>
										<th>Status</th>
										<th>Action</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="header : ${headers}">
										<td th:text="${header.docId}"></td>
										<td th:text="${header.monthYear}"></td>
										<td th:text="${#dates.format(header.validity, 'dd-MM-yyyy')}"></td>
										<td th:text="${header.status}"></td>
										<td><a
											th:href="@{/ehs/performanceReport(docId=${header.docId})}"
											class="btn btn-primary btn-sm">Open</a></td>
									</tr>
								</tbody>
							</table>
						</div>
						<!-- /.table-responsive -->
					</div>
					<!-- /.card-body -->
				</div>
				<!-- /.card -->
			</div>
			<!-- /.col-12 -->
		</div>
		<!-- /.row -->
	</div>
	<!-- /.container-fluid -->

	<div layout:fragment="scriptContent">
		<script th:inline="javascript">
			$(document)
					.ready(
							function() {

								$('.datepicker').datepicker({
									autoclose : true,
									format : 'dd/mm/yyyy'
								});

								$('#example')
										.DataTable(
												{
													dom : 'lBfrtip',
													buttons : [
															{
																extend : 'excel',
																text : '<i class="fa fa-file-excel-o" style="color:green"> </i> EXCEL',
																title : null,
																filename : 'Download'
															},
															{
																extend : 'pdf',
																text : '<i class="fa fa-file-pdf-o" style="color:red"></i> PDF',
																title : null
															} ]
												}

										);

							});
		</script>
	</div>

</body>
</html>
