<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      layout:decorate="layout">
<head>
    <meta charset="UTF-8">
    <title>Statutory Matrix</title>
    <script th:src="@{/resources/dist/js/utils.js}"></script> 

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        
	    .table-sticky-header thead th {
	        position: sticky;
	        top: 0;
	        background-color: #f8f9fa;
	        z-index: 2;
	        box-shadow: 0 2px 2px -1px rgba(0, 0, 0, 0.4);
	    }
	
	    table th, table td {
	        vertical-align: middle;
	    }
	
	    .table thead th {
	        font-size: 0.9rem;
	    }
	
	    .table td {
	        font-size: 0.85rem;
	    }
	
	    .text-uppercase {
	        text-transform: uppercase;
	    }
	
	    .text-nowrap {
	        white-space: nowrap;
	    }
	    .table-responsive thead th {
	        position: sticky;
	        top: 0;
	        background-color: #e3f2fd;
	        z-index: 2;
	    }     
    </style>
    
    <script>
	    function toggleView() {
	        const tableView = document.getElementById('tableView');
	        const chartView = document.getElementById('chartView');
	
	        if (tableView.style.display === 'none') {
	            tableView.style.display = 'block';
	            chartView.style.display = 'none';
	        } else {
	            tableView.style.display = 'none';
	            chartView.style.display = 'block';
	            if (!chartInitialized) {
	                renderChart();
	                chartInitialized = true;
	            }
	        }
	    } 
    </script>
</head>
<body>
	<section layout:fragment="header">
	    <div class="container-fluid">
	        <div class="row">
	            <div class="col-sm-6">
	                <h1 class="text-primary text-bold text-lg ml-2">Statutory Matrix</h1>
	            </div> 
	            <div class="col-sm-6">
	                <ol class="breadcrumb float-sm-right">
	                    <li class="breadcrumb-item"><a href="#">EHS</a></li>
	                    <li class="breadcrumb-item active">Statutory Matrix</li>
	                </ol>
	            </div>
	        </div>
	    </div>
	</section>
	
	<div class="container-fluid" layout:fragment="content">
	    <div class="row">
	        <div class="col-12">
	            <div class="card">
	                <div class="card-body"> 
						<div class="container mt-4">

							<div class="d-flex justify-content-between align-items-center mb-3">
							    <h5 class="mb-0">EHS Compliance Summary</h5>
								<div class="d-flex align-items-center gap-2">
									<form id="fyForm" method="get" class="d-flex justify-content-end" th:action="@{/ehs/statutory-matrix}">
										<div class="row">
											<div class="col-auto">
												<label for="fy" class="form-label fw-semibold mt-1">Select Financial Year:</label>
											</div>
											<div class="col-auto">
												<select class="form-select form-select-sm" id="fy" name="fy" onchange="document.getElementById('fyForm').submit();">
													<option th:each="year : ${availableFYs}"
															th:value="${year}"
															th:selected="${year} == ${selectedFY}"
															th:text="${year}">
													</option>
												</select>
											</div>
										</div>
									</form>
									<button class="btn btn-outline-primary btn-sm" id="toggleView" onclick="toggleView()">Toggle View</button>
								</div>
							</div>
							<div id="tableView" class="">   
								<table class="table table-bordered table-hover table-striped align-middle text-center table-sm shadow-sm table-sticky-header">
						            <thead class="table-primary text-uppercase">
						                <tr class="align-middle">
						                    <th class="text-nowrap">S.N</th>
						                    <th class="text-start text-nowrap">EHS Compliance Requirement</th>    
						                    <th class="text-nowrap" th:each="i : ${#numbers.sequence(0, vendorPlantResponse.vendors.size() - 1)}">
										        <a th:href="@{/ehs/requirements/{vendorCode}(vendorCode=${vendorPlantResponse.vendors[i]}, readonly=true)}"
										           class="text-decoration-none fw-semibold text-dark">
										            <span th:text="${vendorPlantResponse.plantNames[i]}"></span>
										            <i class="fas fa-eye ms-1 text-secondary" title="View"></i>
										        </a>
										    </th>
						                    <th class="text-nowrap">PCT % Actual</th>
						                </tr>
						            </thead>
						
						            <tbody>
						                <!-- Compliance Matrix Rows -->
						                <tr th:each="entry, iterStat : ${matrix}" class="align-middle">
						                    <td th:text="${iterStat.index + 1}" class="fw-semibold"></td>
						                    <td class="text-start" th:text="${entry.key}"></td>
						 
						                    <td th:each="status : ${entry.value.values()}">
						                        <i th:if="${status == 'valid'}" class="fas fa-check" style="color: green;"></i>
						                        <i th:if="${status == 'invalid'}" class="fas fa-times" style="color: gray;"></i>
						                     
						                        <span th:if="${status != 'valid' and status != 'invalid'}" class="text-muted">NA</span>
						                    </td>
						
						                    <td class="fw-bold text-primary"
						                        th:text="${#numbers.formatDecimal(requirementPercentMap[entry.key], 1, 'POINT', 2, 'POINT')} + ' %'">
						                    </td>
						                </tr>
						
						                <!-- Compliance Percentage Row -->
						                <tr class="table-info fw-bold">
						                    <td colspan="2" class="text-start">EHS Compliance %</td>
						                    <td th:each="vendorEntry : ${compliancePercentMap}"
						                        th:text="${#numbers.formatDecimal(vendorEntry.value, 1, 'POINT', 2, 'POINT')} + ' %'">
						                    </td>
						                </tr>
						            </tbody>
						        </table>
							</div>
							<div id="chartView" style="display: none;">
							    <canvas id="complianceChart" height="100"></canvas>
							    
							    
							    <div class="mt-2">
								    <h6 class="mb-1">Requirement-wise Compliance %</h6> 
								    <canvas id="horizontalComplianceChart" width="400" height="200"></canvas>
								</div>
							</div>

						</div>
					</div>
	            </div>
	        </div>  
	    </div>
	</div>

    <div layout:fragment="scriptContent">
		<script th:inline="javascript">
		/*<![CDATA[*/
			const plantLabels = /*[[${plantNames}]]*/ [];
			const plantData = /*[[${vendorComplianceList}]]*/ [];
			const avgPrevYear = /*[[${avgPrevYear}]]*/ 0;
			const avgCurrentYear = /*[[${avgCurrentYear}]]*/ 0;
			const avgPrevYearLabel = /*[[${avgPrevYearLabel}]]*/ 'Avg Prev FY';
			const avgCurrentYearLabel = 'Actual Current FY';
			const targetLabel = 'Target';
			const targetValue = 100;
		
			// Full label and data list
			const labels = [avgPrevYearLabel, ...plantLabels, avgCurrentYearLabel, targetLabel];
			const data = [avgPrevYear, ...plantData, avgCurrentYear, targetValue];
		
			let chartInitialized = false; 
		
			function getBarColor(label, value) {
				if (label.includes("Prev")) {
					return '#C00000';
				} else if (label.includes("Current")) {
					return '#0033CC';
				} else if (label === "Target") {
					return '#00B050';
				} else {
					return '#0033CC';
				}
			}

			function getBorderColor(label, value) {
				if (label.includes("Prev")) {
					return 'rgba(255, 99, 132, 1)';
				} else if (label.includes("Current")) {
					return 'rgba(255, 206, 86, 1)';
				} else if (label === "Target") {
					return 'rgba(75, 192, 192, 1)';
				} else {
					return '#00B050';
				}
			}
		
			function toggleView() {
				const tableView = document.getElementById('tableView');
				const chartView = document.getElementById('chartView');
		
				if (tableView.style.display === 'none') {
					tableView.style.display = 'block';
					chartView.style.display = 'none';
				} else {
					tableView.style.display = 'none';
					chartView.style.display = 'block';
					if (!chartInitialized) {
						renderChart();
						chartInitialized = true;
					}
				}
			}
		
			function renderChart() {
				const ctx = document.getElementById('complianceChart').getContext('2d');
				new Chart(ctx, {
    type: 'bar',
    data: {
        labels: labels,
        datasets: [{
            label: 'Compliance %',
            data: data,
            backgroundColor: labels.map((label, i) => getBarColor(label, data[i])),
            borderColor: labels.map((label, i) => getBorderColor(label, data[i])),
            borderWidth: 1,
            rPercentage: 0.5,         // 👈 make bar thinner
			categoryPercentage: 0.6
        }]
    },
    options: {
        responsive: true,
        scales: {
            yAxes: [{
                ticks: {
                    min: 70, // 👈 Y-axis starts from 70
                    max: 100,
                    callback: function(value) {
                        return value + '%';
                    }
                }
            }]
        },
        tooltips: {
            callbacks: {
                label: function(context) {
                    return context.yLabel + ' %';
                }
            }
        }
    }

				});
			}
		
			// Horizontal Requirement-wise chart
			const requirementLabels = /*[[${requirementLabels}]]*/ [];
			const requirementValues = /*[[${requirementValues}]]*/ [];
		
			function getReqBarColor(value) {
				return '#00B050';
			}
		
			function getReqBorderColor(value) {
				if (value >= 80) return 'rgba(75, 192, 75, 1)';
				if (value >= 60) return 'rgba(255, 165, 0, 1)';
				return 'rgba(255, 99, 132, 1)';
			}
		
			document.addEventListener("DOMContentLoaded", function () {
				const ctxH = document.getElementById('horizontalComplianceChart').getContext('2d');
				new Chart(ctxH, {
				  type: 'horizontalBar', // valid in v2
				  data: {
					labels: requirementLabels,
					datasets: [{
					  label: 'Requirement %',
					  data: requirementValues,
					  backgroundColor: requirementValues.map(getReqBarColor),
					  borderColor: requirementValues.map(getReqBorderColor),
					  borderWidth: 1,
					  categoryPercentage: 0.6,
					  barPercentage: 0.5 // use this in v2 to control bar thickness
					}]
				  },
				  options: {
					responsive: true,
					scales: {
					  xAxes: [{
						ticks: {
						  beginAtZero: true,
						  max: 100,
						  callback: value => value + '%'
						},
						gridLines: {
						  display: false // 👈 remove vertical grid lines
						}
					  }],
					  yAxes: [{
						gridLines: {
						  display: false // 👈 remove horizontal grid lines
						}
					  }]
					},
					tooltips: {
					  callbacks: {
						label: function(context) {
						  return context.xLabel + ' %';
						}
					  }
					},
					legend: {
					  display: false
					}
				  }
				});
			});
		/*]]>*/
		</script>
    </div>
    
</body>
