<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      layout:decorate="layout">
<head>
    <meta charset="UTF-8">
    <title>Consent Compliance Forms</title>
    <script th:src="@{/resources/dist/js/utils.js}"></script> 

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .table-sticky-header thead th {
            position: sticky;
            top: 0;
            background-color: #f8f9fa;
            z-index: 2;
            box-shadow: 0 2px 2px -1px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
	<section layout:fragment="header">
	    <div class="container-fluid">
	        <div class="row">
	            <div class="col-sm-6">
	                <h1 class="text-primary text-bold text-lg ml-2">Consent Compliance Form</h1>
	            </div> 
	            <div class="col-sm-6">
	                <ol class="breadcrumb float-sm-right">
	                    <li class="breadcrumb-item"><a href="#">EHS</a></li>
	                    <li class="breadcrumb-item active">Consent Compliance Form</li>
	                </ol>
	            </div>
	        </div>
	    </div>
	</section>
	
	<div class="container-fluid" layout:fragment="content">
	    <div class="row">
	        <div class="col-12">
	            <div class="card">
	                <div class="card-body">
	                	<table class="table table-bordered">
						    <thead>
						        <tr>
						        	<th>Config ID</th>
						            <th>Month</th>
						            <th>Actions</th> 
						        </tr>
						    </thead>
						    <tbody>
						        <tr th:each="config : ${configs}">
						        <td th:text="${config.evfmConfigId}"></td>
						            <td th:text="${config.monthYear}"></td>
						            
						            <td> 
						                <a th:href="@{'/ehs-compliance/' + ${config.evfmVendorId} + '/' + ${config.evfmConfigId}}" class="btn btn-info btn-sm">View</a>
						            </td>
						        </tr>
					        </tbody>
					    </table>
	                </div>
	            </div>
	        </div>
	    </div>
	</div>

    <div layout:fragment="scriptContent">
        <script>
        </script>
    </div>
    
</body>
