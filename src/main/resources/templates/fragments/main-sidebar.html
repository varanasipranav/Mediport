<th:block xmlns:th="http://www.thymeleaf.org"
          xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<!-- One navigation entry. match = URL prefix that marks it active. -->
<li th:fragment="item(url, icon, label, match)" class="mp-nav-item">
    <a th:href="@{${url}}" class="mp-nav-link"
       th:classappend="${currentUri != null and currentUri.startsWith(match)} ? 'mp-nav-active' : ''">
        <i th:class="${icon} + ' mp-nav-icon'"></i>
        <span class="mp-nav-label" th:text="${label}">Label</span>
    </a>
</li>

<nav th:fragment="sidebar" class="mp-sidebar">

    <!-- Brand -->
    <a th:href="@{/dashboard}" class="mp-brand">
        <span class="mp-brand-mark">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                <path d="M10 3v14M3 10h14" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
                <circle cx="10" cy="10" r="2.3" fill="#10B981"/>
            </svg>
        </span>
        <span class="mp-brand-name">Mediport</span>
    </a>

    <!-- Role label -->
    <div class="mp-nav-section">
        <th:block sec:authorize="hasRole('ADMIN')">Administration</th:block>
        <th:block sec:authorize="hasRole('DOCTOR')">Doctor</th:block>
        <th:block sec:authorize="hasRole('PATIENT')">Patient</th:block>
        <th:block sec:authorize="hasRole('ATTENDANT')">Front desk</th:block>
        <th:block sec:authorize="hasRole('PHARMA')">Pharmacy</th:block>
    </div>

    <!-- Navigation -->
    <div class="mp-nav-scroll">
        <ul class="mp-nav">

            <th:block sec:authorize="hasRole('ADMIN')">
                <th:block th:replace="~{:: item('/dashboard', 'fas fa-tachometer-alt', 'Overview', '/dashboard')}"></th:block>
                <th:block th:replace="~{:: item('/admin/users/list', 'fas fa-users', 'Staff & Patients', '/admin/users/list')}"></th:block>
                <th:block th:replace="~{:: item('/admin/users/create-doctor', 'fas fa-user-md', 'Add doctor', '/admin/users/create-doctor')}"></th:block>
                <th:block th:replace="~{:: item('/admin/users/create-patient', 'fas fa-user-injured', 'Add patient', '/admin/users/create-patient')}"></th:block>
                <th:block th:replace="~{:: item('/pharma/inventory', 'fas fa-boxes', 'Inventory', '/pharma/inventory')}"></th:block>
            </th:block>

            <th:block sec:authorize="hasRole('DOCTOR')">
                <th:block th:replace="~{:: item('/dashboard', 'fas fa-tachometer-alt', 'Dashboard', '/dashboard')}"></th:block>
                <th:block th:replace="~{:: item('/doctor/appointments/today', 'fas fa-list-ol', 'Live queue', '/doctor/appointments')}"></th:block>
                <th:block th:replace="~{:: item('/doctor/weekly-schedule', 'fas fa-calendar-week', 'Weekly schedule', '/doctor/weekly-schedule')}"></th:block>
                <th:block th:replace="~{:: item('/doctor/schedule', 'fas fa-calendar-day', 'Daily schedules', '/doctor/schedule')}"></th:block>
                <th:block th:replace="~{:: item('/doctor/prescriptions/my-prescriptions', 'fas fa-file-prescription', 'Prescriptions', '/doctor/prescriptions')}"></th:block>
            </th:block>

            <th:block sec:authorize="hasRole('PATIENT')">
                <th:block th:replace="~{:: item('/patient/dashboard', 'fas fa-tachometer-alt', 'My dashboard', '/patient/dashboard')}"></th:block>
                <th:block th:replace="~{:: item('/patient/book-appointment', 'fas fa-calendar-plus', 'Book appointment', '/patient/book-appointment')}"></th:block>
                <th:block th:replace="~{:: item('/patient/appointments', 'fas fa-calendar-check', 'My appointments', '/patient/appointments')}"></th:block>
                <th:block th:replace="~{:: item('/patient/prescriptions', 'fas fa-file-prescription', 'Prescriptions', '/patient/prescriptions')}"></th:block>
            </th:block>

            <th:block sec:authorize="hasRole('ATTENDANT')">
                <th:block th:replace="~{:: item('/attendant/check-in', 'fas fa-user-check', 'Check-in', '/attendant/check-in')}"></th:block>
                <th:block th:replace="~{:: item('/attendant/queue', 'fas fa-list-ol', 'Live queue', '/attendant/queue')}"></th:block>
            </th:block>

            <th:block sec:authorize="hasRole('PHARMA')">
                <th:block th:replace="~{:: item('/pharma/dashboard', 'fas fa-capsules', 'Dispense queue', '/pharma/dashboard')}"></th:block>
                <th:block th:replace="~{:: item('/pharma/inventory', 'fas fa-boxes', 'Inventory', '/pharma/inventory')}"></th:block>
            </th:block>

        </ul>
    </div>

    <!-- User card -->
    <div class="mp-user-card">
        <div class="mp-user-avatar"
             th:text="${#authentication != null and #authentication.name != null ? #authentication.name.substring(0,1).toUpperCase() : 'U'}">U</div>
        <div class="mp-user-meta">
            <div class="mp-user-name" th:text="${#authentication != null ? #authentication.name : 'User'}">User</div>
            <div class="mp-user-role">
                <th:block sec:authorize="hasRole('ADMIN')">Administrator</th:block>
                <th:block sec:authorize="hasRole('DOCTOR')">Doctor</th:block>
                <th:block sec:authorize="hasRole('PATIENT')">Patient</th:block>
                <th:block sec:authorize="hasRole('ATTENDANT')">Front desk</th:block>
                <th:block sec:authorize="hasRole('PHARMA')">Pharmacist</th:block>
            </div>
        </div>
        <button type="button" class="mp-user-logout" title="Sign out" onclick="document.getElementById('sidebarLogoutForm').submit()">
            <i class="fas fa-sign-out-alt"></i>
        </button>
        <form th:action="@{/logout}" method="post" id="sidebarLogoutForm" style="display:none;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        </form>
    </div>

</nav>

</th:block>
