<!-- header fragment -->
<th:block th:fragment="header" xmlns:th="http://www.thymeleaf.org"
          xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<div style="display:flex;align-items:center;width:100%;gap:16px;">

    <!-- Left: sidebar toggle + breadcrumbs -->
    <div style="display:flex;align-items:center;gap:14px;flex:1;min-width:0;">
        <button type="button" data-widget="pushmenu"
                style="background:transparent;border:none;cursor:pointer;color:var(--text-muted);display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;flex-shrink:0;transition:background 0.15s;"
                onmouseover="this.style.background='var(--bg-muted)'" onmouseout="this.style.background='transparent'">
            <i class="fas fa-bars" style="font-size:15px;"></i>
        </button>

        <!-- Page title / breadcrumbs area (filled by pages via data-* or just show role label) -->
        <div style="min-width:0;">
            <div style="font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--text-strong);letter-spacing:-0.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                <th:block sec:authorize="hasRole('ADMIN')">Mediport Admin</th:block>
                <th:block sec:authorize="hasRole('DOCTOR')">Doctor Portal</th:block>
                <th:block sec:authorize="hasRole('PATIENT')">Patient Portal</th:block>
                <th:block sec:authorize="hasRole('ATTENDANT')">Front Desk</th:block>
                <th:block sec:authorize="hasRole('PHARMA')">Pharmacy</th:block>
            </div>
        </div>
    </div>

    <!-- Center: search bar -->
    <div style="display:flex;align-items:center;gap:8px;padding:8px 13px;width:260px;background:var(--bg-muted);border-radius:8px;color:var(--text-muted);font-size:12px;font-family:var(--font-body);flex-shrink:0;">
        <i class="fas fa-search" style="font-size:13px;flex-shrink:0;"></i>
        <span style="flex:1;color:var(--text-soft);">Search patients, appointments…</span>
        <span style="font-family:var(--font-mono);font-size:10px;padding:1px 5px;border-radius:4px;background:var(--bg-card);border:1px solid var(--border);color:var(--text-muted);">⌘K</span>
    </div>

    <!-- Right: notifications + user -->
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">

        <!-- Notification bell -->
        <button type="button"
                style="position:relative;width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:var(--bg-muted);border:none;cursor:pointer;color:var(--text);transition:background 0.15s;"
                onmouseover="this.style.background='var(--border)'" onmouseout="this.style.background='var(--bg-muted)'">
            <i class="fas fa-bell" style="font-size:15px;"></i>
            <span style="position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--status-missed-bar);border:2px solid var(--bg-muted);"></span>
        </button>

        <!-- User info + logout -->
        <div style="display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);">
            <!-- Avatar -->
            <div style="width:30px;height:30px;border-radius:50%;background:var(--brand-primary-50);color:var(--brand-primary);display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:11px;flex-shrink:0;"
                 th:text="${#authentication != null and #authentication.name != null ? #authentication.name.substring(0,1).toUpperCase() : 'U'}">U</div>
            <!-- Name + role -->
            <div style="line-height:1.3;">
                <div style="font-size:12px;font-weight:600;color:var(--text-strong);white-space:nowrap;"
                     th:text="${#authentication != null ? #authentication.name : 'User'}">User</div>
                <div style="font-size:10px;color:var(--text-muted);">
                    <th:block sec:authorize="hasRole('ADMIN')">Admin</th:block>
                    <th:block sec:authorize="hasRole('DOCTOR')">Doctor</th:block>
                    <th:block sec:authorize="hasRole('PATIENT')">Patient</th:block>
                    <th:block sec:authorize="hasRole('ATTENDANT')">Attendant</th:block>
                    <th:block sec:authorize="hasRole('PHARMA')">Pharmacist</th:block>
                </div>
            </div>
            <!-- Logout button -->
            <button type="button"
                    onclick="document.getElementById('headerLogoutForm').submit()"
                    title="Sign out"
                    style="background:transparent;border:none;cursor:pointer;color:var(--text-muted);display:inline-flex;align-items:center;padding:0;transition:color 0.15s;"
                    onmouseover="this.style.color='var(--status-missed)'" onmouseout="this.style.color='var(--text-muted)'">
                <i class="fas fa-sign-out-alt" style="font-size:13px;"></i>
            </button>
        </div>

        <form th:action="@{/logout}" method="post" id="headerLogoutForm" style="display:none;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        </form>
    </div>
</div>

</th:block>
