<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="footer">
    <style>
        /* ===== FOOTER STYLES ===== */
        .main-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .footer-left a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }

        .footer-left a:hover {
            color: var(--accent-light);
            text-decoration: underline;
        }

        .footer-right {
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .main-footer {
                flex-direction: column;
                padding: 12px 16px;
                gap: 8px;
            }
        }
    </style>

    <div class="footer-left">
        <span>Copyright © 2026 <a href="#">SoftSolution Pvt Ltd.</a> All rights reserved.</span>
    </div>

    <div class="footer-right">
        <span>Version 1.0.0</span>
    </div>

    <input type="hidden" name="_csrf" id="csrf" th:value="${_csrf != null ? _csrf.token : ''}"/>
</div>

</body>
</html>
