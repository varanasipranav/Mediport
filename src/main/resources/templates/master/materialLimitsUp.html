<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
	layout:decorate="layout">
<head>
<meta charset="ISO-8859-1">
<title>List Materials</title>
<style>
.dataTables_filter
{
    display: inline;
    float: right;
}

.dataTables_length
{
   display: inline;
}
.dt-buttons
{
   margin-left:25%;
}
.input-group-addon {
    padding: 2px 12px !important;
 }
</style>
</head>
<body>
	<section layout:fragment="header">
		<h1>Material Limit Upload</h1>
		<ol class="breadcrumb">
			<li><a th:href="@{/dashboard/index.html}"><i
					class="fa fa-dashboard"></i> Material Limits</a></li>
			<li class="active">Add/Change</li>
		</ol>
	</section>
	<div layout:fragment="content">
	<div th:if="${success!= null}" class="alert alert-success alert-dismissible">
    			<i class="icon fa fa-check"></i>
    			<span th:text="${success}" ></span>
    	
    	</div>
		<!-- <form role="form" th:action="@{#}"  th:method="GET" > -->
		<div class="box">
			<div class="box-header">
				<!-- <h3 class="box-title">Data Table With Full Features</h3> -->
			</div>
			<!-- /.box-header -->
			<div class="box-body">
						<a href="/master/matSamp" class="btn btn-warning"><i class="fa fa-refresh"  style="color:green"> </i> DOWNLOAD SAMPLE</a>	
						<a data-toggle="modal" data-target="#uploadExcelFrag" href="#" class="btn btn-warning"><i class="fa fa-upload" style="color:green"></i>UPLOAD</a>				
			</div>
			<!-- /.box-body -->
		</div>
		<div th:replace="modals/uploadExcelModal.html:: uploadExcel(action='/master/matLimitUpload',title='Excel Upload')"></div>
		<!-- /.box-body -->
		<!-- 
	</form>
 -->
	
	
	<!-- Models End -->
	
	</div>
	
	<!-- Script Start -->
	<div layout:fragment="scriptContent">
		<script th:inline="javascript">
			$(document).ready(function() {
				$('#example').DataTable({
					 dom: 'lBfrtip',
					 buttons: [ {text: '<i class="fa fa-refresh"  style="color:green"> </i> DOWNLOAD SAMPLE',action: function ( e, dt, node, config ) {location.href="/master/matSamp";}}, {text: '<i class="fa fa-upload" style="color:orange"> <a data-toggle="modal" data-target="#uploadExcelFrag">UPLOAD</a></i> ',action: function ( e, dt, node, config ) {}}, { extend: 'excel', text: '<i class="fa fa-file-excel-o" style="color:green"> </i> EXCEL',title:null,filename:'Download' },{ extend: 'pdf', text: '<i class="fa fa-file-pdf-o" style="color:red"></i> PDF',title:null }]
				
					}
						
				);

				$('#closeModal').click((e)=>{
					
					e.preventDefault();
					$('#editMatModal').modal('toggle');
				});
				
						
				
			});	
/* 			$( window ).on("unload",function() {
					Pace.restart();
			})
 */			
			function openModal(modelType,matId){
				if(modelType === "edit"){
					
					$.ajax({
						url: "/modal/edit-material/" + matId,
						success: function(data){
							$("#editMatModalHolder").html(data);
							$('#editMatModal').modal({
								backdrop: 'static'
							});
						}
					});
					
				}
				if(modelType === "delete"){
					
					$.ajax({
						url: "/modal/delete-material/" + matId,
						success: function(data){
							$("#deleteMatModalHolder").html(data);
							$('#deleteMatModal').modal({
								backdrop: 'static'
							});
						}
					});
					
					
				}
				
			}
			function validate(event){
					event.preventDefault();
					var formdata = $('edit-dist-form').serialize();
					
					debugger;
					$.ajax({
							
						type : "POST",
						url : "/master/edit-dist", 
						data : formdata,
						success : function(response) {
								
							if(response.status == 'FAIL') {
								showFormError(response.errorMessageList);
							} else {
								//everything is O.K. user logged in successfully.
							
							}
						},
						error : function(ex) {
							console.log(ex);
						}
					});
			}
						
		</script>
	</div>
</body>
</html>
