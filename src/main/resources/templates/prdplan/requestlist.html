<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
	  layout:decorate="layout">
<head>
	<title>List</title>
	<style>
		#rejectModal {
            width: 50%;
            height: 40%;
            margin-left: 35%;
            padding: 0;
        }

        #apprModal {
            width: 90%;
            height: 90%;
            margin-left: 5%;
            padding: 0;
        }

        .modal-content {
            height: auto;
            min-height: 100%;
            border-radius: 0;
        }

        .dataTables_filter {
            float: right;
        }

        .dataTables_length {
            display: inline;
        }

        .dt-buttons {
            margin-left: 25%;
        }

        .input-group-addon {
            padding: 2px 12px !important;
        }

        #nullifyModal {
            z-index: 1080 !important;
        }
	</style>
	<link rel="stylesheet" type="text/css" href="../../../../resources/dist/css/table.css">
</head>
<body>
<section layout:fragment="header">
	<div class="container-fluid">
		<div class="row">
			<div class="col-sm-6">
				<h1 class="text-primary text-bold text-lg ml-2">Monthly List</h1>
			</div>
			<div class="col-sm-6">
				<ol class="breadcrumb float-sm-right">
					<li class="breadcrumb-item"><a href="#">Production Plan</a></li>
					<li class="breadcrumb-item active">Monthly List</li>
				</ol>
			</div>
		</div>
	</div>
</section>

<div class="container-fluid" layout:fragment="content">
	<div class="row">
		<div class="col-12">
			<div class="card">
				<div class="card-body">
					<form role="form" th:object="${listSelector}" th:action="@{/prdplan/list}" method="get">
						<div class="table-responsive hidden-xs">
							<table class="table table-striped">
								<tbody>
								<tr>
									<td>
										<label>From Date:</label>
										<div class="input-group mb-3">
											<span class="input-group-text border-right-0"><i class="fa fa-calendar"></i></span>
											<input type="text" class="form-control datepicker" placeholder="Start Date"
												   id="fromDate" name="fromDate" th:field="*{fromDate}">
										</div>
									</td>
									<td>
										<label>To Date:</label>
										<div class="input-group mb-3">
											<span class="input-group-text border-right-0"><i class="fa fa-calendar"></i></span>
											<input type="text" class="form-control datepicker" placeholder="End Date"
												   id="toDate" name="toDate" th:field="*{toDate}">
										</div>
									</td>
									<td>
										<label for="listType">Status</label>
										<div class="input-group">
											<select class="form-control input-sm" th:field="*{status}">
												<option value="" th:selected="*{status==''}">All</option>
												<option value="SUBMITTED" th:selected="*{status=='S'}">Submitted</option>
												<option value="APPROVED" th:selected="*{status=='A'}">Approved</option>
												<option value="REJECTED" th:selected="*{status=='R'}">Rejected</option>
											</select>
										</div>
									</td>
									<td>
										<div class="d-flex align-items-center justify-content-center mt-3">
											<button type="submit" class="btn btn-primary w-100 mt-3">Apply</button>
										</div>
									</td>
								</tr>
								</tbody>
							</table>
						</div>
					</form>

					<div class="table-responsive">
						<table id="example" class="table styled-table table-bordered dt-responsive nowrap" width="100%">
							<thead>
							<tr>
								<th>Doc ID (Hidden)</th>
								<th>Plan Id</th>
								<th>Month Yr</th>
								<th>Vendor</th>
								<th>Created By</th>
								<th>Created On</th>
								<th>Status</th>
								<th>Pending With</th>
							</tr>
							</thead>
							<tbody>
							<tr th:each="row : ${reqList}">
								<td th:text="${row.docId}"></td>
								<td>
									<a th:href="@{'/prdplan/view/' + ${row.docId}}"
									   th:text="${#dates.format(row.createdOn, 'ddMMyyyy') + ' - ' + row.docId}"></a>
								</td>
								<td th:text="${row.monthYear}"></td>
								<td th:text="${locationGrp[row.outSrcLoc] + '[' + row.outSrcLoc + ']'}"></td>
								<td th:text="${row.createdBy}"></td>
								<td th:text="${#dates.format(row.createdOn, 'dd/MM/yyyy')}"></td>
<!--								<td th:text="${row.status == 'SUBMITTED' ? 'Submitted' : row.status == 'APPROVED' ? 'Approved' : row.status == 'REJECTED' ? 'Rejected' : 'Posted To SAP'}"></td>-->

								<td class="text-center align-middle">
									<span th:if="${row.status == 'REJECTED'}"
										  class="badge rounded-pill bg-danger py-2 fs-6 px-3 d-inline-block">Rejected</span>

									<span th:if="${row.status == 'SUBMITTED'}"
										  class="badge rounded-pill bg-warning text-dark py-2 fs-6 px-3 d-inline-block">Submitted</span>

									<span th:if="${row.status == 'APPROVED'}"
										  class="badge rounded-pill bg-success py-2 fs-6 px-3 d-inline-block">Approved</span>

									<span th:if="${row.status != 'REJECTED' and row.status != 'SUBMITTED' and row.status != 'APPROVED'}"
										   class="badge rounded-pill bg-info py-2 fs-6 px-3 d-inline-block">Posted To SAP</span>
								</td>

								<td th:text="${row.nextPart}"></td>
							</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<div layout:fragment="scriptContent">
	<script type="text/javascript">
		function getQueryParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        $(document).ready(function () {
            let role = getQueryParam('role'); // e.g., ROLE_CPT or CPTTEAM or VendorCode
            console.log("Role from URL:", role);

            $('.datepicker').datepicker({
                autoclose: true,
                format: 'dd/mm/yyyy'
            });

            var table = $('#example').DataTable({
                deferRender: true,
                dom: 'lBfrtip',
                buttons: [
                    {
                        extend: 'excel',
                        text: '<i class="fa fa-file-excel" style="color:green"></i> EXCEL',
                        title: null,
                        filename: 'Download'
                    },
                    {
                        extend: 'pdf',
                        text: '<i class="fa fa-file-pdf" style="color:red"></i> PDF',
                        title: null
                    }
                ],
                language: {
                    lengthMenu: '_MENU_ entries per page',
                    paginate: {
                        previous: '‹',
                        next: '›'
                    }
                },
                columnDefs: [
                    {
                        targets: 0,
                        visible: false,
                        searchable: false
                    }
                ]
            });

            // If role is provided in URL, filter column index 3 (Vendor column)
            if (role) {
            	if(role == 'DELCOMP'){
            		table.column(7).search("ROLE_VEND").draw();
            	}
                else {
                	table.column(7).search(role).draw();
                }
            }
        });
	</script>
</div>
</body>
</html>
