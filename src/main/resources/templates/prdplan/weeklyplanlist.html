<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
	layout:decorate="layout">
<head>
<title>List</title>
<style type="text/css">
#rejectModal {
	width: 50%;
	height: 40%;
	margin-left: 35%;
	padding: 0;
}

#apprModal {
	width: 90%;
	height: 90%;
	margin-left: 5%;
	padding: 0;
}

.modal-content {
	height: auto;
	min-height: 100%;
	border-radius: 0;
}

.group {
	/* background: #eeeeee; */
	
}

#nullifyModal {
	z-index: 1080 !important;
}
</style>
<style>
.dataTables_filter {
	display: inline;
	float: right;
}

.dataTables_length {
	display: inline;
}

.dt-buttons {
	margin-left: 25%;
}

.input-group-addon {
	padding: 2px 12px !important;
}
</style>

<link rel="stylesheet" type="text/css"
	href="../../../../resources/dist/css/table.css">
</head>
<body>
	<section layout:fragment="header">
		<div class="container-fluid">
			<div class="row">
				<div class="col-sm-6">
					<h1 class="text-primary text-bold text-lg ml-2">Weekly List</h1>
				</div>
				<div class="col-sm-6">
					<ol class="breadcrumb float-sm-right">
						<li class="breadcrumb-item"><a href="#">Production Plan</a></li>
						<li class="breadcrumb-item active">Weekly List</li>
					</ol>
				</div>
			</div>
		</div>
		<!-- /.container-fluid -->
	</section>
	<div class="container-fluid" layout:fragment="content">
		<div class="row">
			<div class="col-12">
				<div class="card">
					<div class="card-body">

						<form role="form" th:object="${listSelector}"
							th:action="@{/prdplan/weeklylist}" method="get" name="myForm">
							<div class="table-responsive hidden-xs">
								<table class="table table-striped" style="margin-bottom: 1%;">
									<tbody>
										<tr>
											<td>
												<label>From Date:</label>
											
												<div class="input-group mb-3">
													<span class="input-group-text border-right-0" id="basic-addon1">
														<i class="fa fa-calendar"></i>
													</span>
													<input type="text" class="form-control datepicker" placeholder="Start Date" aria-label="Start Date"
														 aria-describedby="basic-addon1" id="fromDate" name="fromDate" th:field="*{fromDate}">
												</div>
											</td>
											<td><label>To Date:</label>
											
											
											<div class="input-group mb-3">
													<span class="input-group-text border-right-0" id="basic-addon1">
														<i class="fa fa-calendar"></i>
													</span>
													<input type="text" class="form-control datepicker" placeholder="Start Date" aria-label="Start Date"
														 aria-describedby="basic-addon1" id="fromDate" name="fromDate" th:field="*{toDate}">
												</div>
											</td>

											<td>
												<div class="d-flex align-items-center justify-content-center mt-3">
													<button type="submit" class="btn btn-primary pull-right mt-3 w-100">
														Apply 
														<!-- <i class="fa fa-paper-plane"></i> -->
													</button>
												</div>
											</td>
										</tr>

									</tbody>
								</table>
							</div>
						</form>
						
						<div class="d-flex align-items-center justify-content-start my-2">
													<span class="badge badge-danger">New</span>
													<span class="badge badge-warning mx-2">In Process</span>
													<span class="badge badge-success">Approved</span>
												</div>
						<div class="table-responsive">
							<table id="example"
								class="table table-bordered dt-responsive nowrap styled-table"
								cellspacing="0" width="100%">
								<thead>
									<tr>
									 	<th style="display:none">Doc ID (Hidden)</th> <!-- Hidden column -->
										<th>Plan Id</th>
										<th>Month Year</th>
										<th>Vendor</th>
										<th></th>
										<th></th>
										<th></th>
										<th></th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="row : ${reqList}">
										<td style="display:none" th:text="${row.planId}"></td> <!-- Hidden docId -->
										<td><a th:href="${'/prdplan/view/' + {row.planId}}"
											th:text="${#dates.format(row.createdOn, 'ddMMyyyy') + ' - ' +  row.planId}"></a></td>
										<td th:text="${row.monthYr}"></td>
										<td th:text="${locationGrp[row.plant]+'['+row.plant+']'}"></td>
										<td>
											<input type="hidden" th:feild="${row.week1Sts}">
											<a
											th:href="${'/prdplan/viewweeklyplanall/' + {row.planId}+'/1'}"
											th:class="${'btn btn-sm '+{row.week1Sts == 'NEW'?'btn-danger':row.week1Sts == 'SUBMITTED'?'btn-warning':row.week1Sts == 'APPROVED'?'btn-success':''}}">WEEK1</a></td>
										<td>
											<input type="hidden" th:feild="${row.week2Sts}">
											<a
											th:href="${'/prdplan/viewweeklyplanall/' + {row.planId}+'/2'}"
											th:class="${'btn btn-sm '+{row.week2Sts == 'NEW'?'btn-danger':row.week2Sts == 'SUBMITTED'?'btn-warning':row.week2Sts == 'APPROVED'?'btn-success':''}}">WEEK2</a></td>
										<td>
											<input type="hidden" th:feild="${row.week3Sts}">
											<a
											th:href="${'/prdplan/viewweeklyplanall/' + {row.planId}+'/3'}"
											th:class="${'btn btn-sm '+{row.week3Sts == 'NEW'?'btn-danger':row.week3Sts == 'SUBMITTED'?'btn-warning':row.week3Sts == 'APPROVED'?'btn-success':''}}">WEEK3</a></td>
										<td>
											<input type="hidden" th:feild="${row.week3Sts}">
											<a
											th:href="${'/prdplan/viewweeklyplanall/' + {row.planId}+'/4'}"
											th:class="${'btn btn-sm '+{row.week4Sts == 'NEW'?'btn-danger':row.week4Sts == 'SUBMITTED'?'btn-warning':row.week4Sts == 'APPROVED'?'btn-success':''}}">WEEK4</a></td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div layout:fragment="scriptContent">

		<script type="text/javascript">
			$(document)
					.ready(
							function() {

								$('.datepicker').datepicker({
									autoclose : true,
									format : 'dd/mm/yyyy'
								});

								$('#example')
								.DataTable(
										{
											dom : 'lBfrtip',
											buttons : [
													{
														extend : 'excel',
														text : '<i class="fa fa-file-excel" style="color:green"> </i> EXCEL',
														title : null,
														filename : 'Download'
													},
													{
														extend : 'pdf',
														text : '<i class="fa fa-file-pdf" style="color:red"></i> PDF',
														title : null
													} ],
													
											  language: {
												    lengthMenu: '_MENU_ entries per page',
												    paginate: {
												        previous: '‹',
												        next: '›'
												    }
											  },
											    columnDefs: [
											        {
											            targets: 0,            // 0 = hidden docId
											            visible: false,
											            searchable: false
											        }
											    ],
										}

								);

							});
		</script>


	</div>

</body>
</html>
