		let selectedWeek = document.getElementById('selWeek').value;
		console.log("Selected Week: ", selectedWeek);  
		  
		function splitAverage(total, count) {
			  const avg = Math.floor(total / count);        // Basic average without decimals
			  const remainder = total % count;              // Remainder to distribute
			  const result = [];

			  for (let i = 0; i < count; i++) {
			    if (i < remainder) {
			      result.push(avg + 1);  // Add 1 to first 'remainder' items
			    } else {
			      result.push(avg);
			    }
			  }

			  return result;
			}
		var maxLineNo = parseInt($("#maxLineNo").val());
		
		$(document).ready(function() {  

			
			
			 $(".deleteRow").click(function () {
			        let row = $(this).closest("tr");
			        let deleteIndicator = row.find(".itemIndicator");

			        // Toggle delete status
			        if (row.hasClass("table-danger")) {
			            row.removeClass("table-danger"); // Remove red highlight
			            deleteIndicator.val("");    // Reset delete indicator
			        } else {
			            row.addClass("table-danger");    // Highlight row in red
			            deleteIndicator.val("D");     // Mark for deletion
			        }
			    });
			
		    function updateProposedQty() {
		    	console.log("CALLED");
		        $("tr").each(function () {
		            let row = $(this);
		            let totalWeight = 0;

		            // Loop through each week's weight (KG values) in the row
		            row.find(".week1Wt, .week2Wt, .week3Wt, .week4Wt").each(function () {
		                let weight = parseFloat($(this).text().replace(/,/g, "")) || 0;
		                totalWeight += weight;
		            });

		            // Update the Proposed QTY column
		            row.find(".proposedQty").text(totalWeight.toLocaleString());
		        });
		    }

		    // Call function initially to calculate the proposed quantities
		    updateProposedQty();

		    // Recalculate when week input values change
		    $(".week1Qty, .week2Qty, .week3Qty, .week4Qty").on("input", function () {
		        setTimeout(updateProposedQty, 500); // Delay ensures the value is updated
		    });
			
			
			let week1Qty = 0;
			let week2Qty = 0;
			let week3Qty = 0;
			let week4Qty = 0;
			let week1Wt = 0;
			let week2Wt = 0;
			let week3Wt = 0;
			let week4Wt = 0;
			
			let propQty = 0;
			let vendQty = 0;
			let finalQty = 0;
			let totalProposedQty = 0;

	            week1Qty += parseFloat($(this).find('.week1Qty').val()) || 0;
	            week2Qty += parseFloat($(this).find('.week2Qty').val()) || 0;
	            week3Qty += parseFloat($(this).find('.week3Qty').val()) || 0;
	            week4Qty += parseFloat($(this).find('.week4Qty').val()) || 0;
	            
	            week1Wt += parseFloat($(this).find('.week1Wt').text().replace(/,/g, '')) || 0;
	            week2Wt += parseFloat($(this).find('.week2Wt').text().replace(/,/g, '')) || 0;
	            week3Wt += parseFloat($(this).find('.week3Wt').text().replace(/,/g, '')) || 0;
	            week4Wt += parseFloat($(this).find('.week4Wt').text().replace(/,/g, '')) || 0;
	            
	            propQty += parseFloat($(this).find('.prop-qty').val()) || 0;
	            vendQty += parseFloat($(this).find('.vend-qty').val()) || parseFloat($(this).find('.vend-qty').text()) || 0;
	            finalQty += parseFloat($(this).find('.final-qty').val()) || 0;
	            totalProposedQty += parseFloat($(this).find('.week1Wt').text().replace(/,/g, '')) || 0;
	            totalProposedQty += parseFloat($(this).find('.week2Wt').text().replace(/,/g, '')) || 0;
	            totalProposedQty += parseFloat($(this).find('.week3Wt').text().replace(/,/g, '')) || 0;
	            totalProposedQty += parseFloat($(this).find('.week4Wt').text().replace(/,/g, '')) || 0;
	            
	            const vendPropQty = parseFloat($(this).find(".vend-qty").text());
	            
	            if(vendPropQty && vendPropQty != $(this).find(".week"+selectedWeek+"Qty").val()) {
	            	$(this).addClass("bg-info"); 
	            }
	             
	            if(vendPropQty) parseFloat($(this).find(".week"+selectedWeek+"Qty").val(vendPropQty));

		 function updateLoadingPercent() {
        let selectedWeek = $("#selWeek").val(); // e.g., '1', '2', etc.

        $('table tbody tr').each(function () {
            let row = $(this);
            let monthlyTotal = parseFloat(row.find('.monthlyTotal').val()) || 0;
            let weekQty = 0;

            if (selectedWeek == "1") {
                weekQty = parseFloat(row.find('.week1Qty').val()) || 0;
            } else if (selectedWeek == "2") {
                weekQty = parseFloat(row.find('.week2Qty').val()) || 0;
            } else if (selectedWeek == "3") {
                weekQty = parseFloat(row.find('.week3Qty').val()) || 0;
            } else if (selectedWeek == "4") {
                weekQty = parseFloat(row.find('.week4Qty').val()) || 0;
            }

            let loadingPer = 0;
            if (monthlyTotal > 0) {
                loadingPer = (weekQty / monthlyTotal) * 100;
            }

            row.find('.loadingPer').text(loadingPer.toFixed(2) + "%");
        });
    }

		            let data = e.target.result;
		            let workbook = XLSX.read(data, { type: "binary" });
		            let sheet = workbook.Sheets[workbook.SheetNames[0]]; // Read first sheet
		            let jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1 });
					
		            // Assuming first row contains headers and data starts from row 2
		            let headers = jsonData[0];
		            console.log(headers, "HEADERS");
		            //debugger;  
		            let week1Index = headers.indexOf("WEEK" + selectedWeek);
		            let totalIndex = headers.indexOf("MONTHLY TOTAL"); 
		            let identifierIndex = headers.indexOf("LINE NO"); // Assuming ID exists to match rows

		            if (week1Index === -1 || totalIndex === -1 || identifierIndex === -1) {
		                alert("Invalid file format. Ensure columns: id, WEEK1, MONTHLY TOTAL exist.");
		                return;
		            }

		            jsonData.slice(1).forEach(row => {
		                let rowId = row[identifierIndex]; // Unique identifier
		                let week1Value = row[week1Index];
		                let totalValue = row[totalIndex];

		                let matchingRow = $("tr[data-id='" + rowId + "']"); // Find row with same ID

		                if (matchingRow.length > 0) {
		                    matchingRow.find(".week"+selectedWeek+"Qty").val(week1Value);
		                    matchingRow.find(".monthlyTotal").val(totalValue).trigger("input"); // Trigger change for recalculating weeks 2-4
		                }
		            });

		            alert("Excel file uploaded successfully!");
		        };
		    });

    document.getElementById("exportBtn").addEventListener("click", function () {
        let table = document.getElementById("poPlanTable");
        let rows = table.rows;
        
        let excelContent = 
            '<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?>' +
            '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"' +
            ' xmlns:o="urn:schemas-microsoft-com:office:office"' +
            ' xmlns:x="urn:schemas-microsoft-com:office:excel"' +
            ' xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"' +
            ' xmlns:html="http://www.w3.org/TR/REC-html40">' +
            '<Worksheet ss:Name="Sheet1"><Table>';

        // Loop through rows
        for (let i = 0; i < rows.length; i++) {
        	
        	if(rows[i].className == "skipExport" || rows[i].className == "hiderow")
        		continue;
            excelContent += "<Row>";
            let cols = rows[i].cells;

            // Loop through columns
            for (let j = 0; j < cols.length; j++) {
                let cell = cols[j];
                let data = "";

                // Check if cell contains an input field
                let input = cell.querySelector("input");
                if (input) {
                	debugger;
                    data = input.value; // Get input value
                } else {
                    data = cell.innerText.trim(); // Get text content
                }

                excelContent += `<Cell><Data ss:Type="String">${data}</Data></Cell>`;
            }
            excelContent += "</Row>";
        }

        excelContent += "</Table></Worksheet></Workbook>";

        // Convert to Blob
        let blob = new Blob([excelContent], { type: "application/vnd.ms-excel" });

        // Create download link
        let a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "Production_Plan.xls"; // Use .xls (works in Excel)
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    });
    function callAddQtyApi() {
		{
			
			const plantNo = $("#selOutPlant").val();
			const materialInput = $("#materialInput").val();
			const storageLocationInput = $("#storageLocationInput").val();
			const uomInput = $("#uomInput").val();
			
			if(materialInput == "")
			{
				alert("Please Enter Material");
	            return;
			}
			if(storageLocationInput == "")
			{
				alert("Please Enter Storage Location");
	            return;
			}
			const payload = {
                    _csrf: $('input[name="_csrf"]').val()
                };
			$.ajax({
                url: '/getmaterialdetapi',
                type: 'GET',
                headers: {
                	"X-CSRF-TOKEN": payload._csrf
                },
                contentType: 'application/json',
                data: {
                	materials: materialInput,
                	plant:plantNo
                },
                success: function (response) {
                    
                	debugger;

                }
            });
		}
