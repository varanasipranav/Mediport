<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
	layout:decorate="layout">
<head>
<style type="text/css">
.hide {
	display: none;
}

.datepicker {
	width: 30%;
}
</style>

<link rel="stylesheet" type="text/css"
	href="../../../../resources/dist/css/table.css">

<title>Price Approval</title>
</head>
<body>
	<section layout:fragment="header">
		<div class="container-fluid">
			<div class="row mb-2">
				<div class="col-sm-3">
					<h1 class="text-primary text-bold text-lg ml-2">Production
						Plan</h1>
				</div>
				<div class="col-sm-6">
					<ul class="nav nav-tabs" sec:authorize="hasAnyRole('ROLE_CPT')">
						  <li class="nav-item" th:each="item : ${otherPlantPlans}">
						    <a class="nav-link" th:classappend="${item[2]} == ${prdPlanFormDetInput.selOutPlant} ? ' active'" th:href="${'/prdplan/view/' + {item[0]}}" th:text="${item[2]}">Active</a>
						  </li>
						</ul>
				</div>
				<div class="col-sm-3">
					<ol class="breadcrumb float-sm-right">
						<li class="breadcrumb-item"><a href="#">Production Plan</a></li>
						<li class="breadcrumb-item active">View</li>
					</ol>
				</div>
			</div>
		</div>
		<!-- /.container-fluid -->
	</section>
	<div layout:fragment="content">
		<div class="card card-primary">
			<form data-toggle="validator" role="form" id="myForm" name="myForm"
				th:object="${prdPlanFormDetInput}"
				th:action="@{/prdplan/updateRequest}" method="post">
				<div class="card-body">

					<input type="hidden" th:field="*{docId}" /> <input type="hidden"
						th:field="*{selVendor}" /> <input type="hidden"
						th:field="*{selOutPlant}" /> <input type="hidden"
						th:field="*{selMonthYr}" /> <input type="hidden"
						th:field="*{selPurGrp}" />
					<div class="row bg-light px-2 pt-1">
						<div class="col-md-2">
							<strong>Vendor:</strong>
						</div>
						<div class="col-md-2">
							<span th:text="*{selVendor}"></span>
						</div>
						<div class="col-md-2">
							<strong>Month/Year:</strong>
						</div>
						<div class="col-md-2">
							<span th:text="*{selMonthYr}"></span>
						</div>
						<div class="col-md-2">
							<strong>Plant:</strong>
						</div>
						<div class="col-md-2">
							<span th:text="*{selOutPlant}"></span>
						</div>
						<div class="mt-3 col-md-2">
							<p class="text-green pull-right " style="margin-right: 10px">
								<Strong>No Of Records :<span
									th:text="*{#lists.size(prdPlanRequestItems)}"></span>
								</Strong>
							</p>
						</div>
						
						

					</div>
					<div class="text-right mr-2" style="margin-top:-35px">
						    <button id="exportBtn" type="button" class="btn btn-sm btn-warning px-4">Export to Excel</button>
						</div>
					<div class="table-responsive table-container"
						style="margin-top: 2%" th:if="*{!prdPlanRequestItems.empty}">
						<table id="poPlanTable"
							class="col-sm-12 table table-bordered no-wrap styled-table table-striped">
							<thead class="primary">
								<tr>
									<th rowspan=2>Category</th>
									<th rowspan=2>Material</th>
									<th rowspan=2>Description</th>
									<th rowspan=2>Weight</th>
									<th rowspan=2>UOM</th>
									<th rowspan=2>Storage Loc.</th>
									<th>Week1</th>
									<th>Week2</th>
									<th>Week3</th>
									<th>Week4</th>
									<th rowspan=2>Final Qty</th>
									<th rowspan=2>Proposed Qty</th>
									<th rowspan=2>Vendor Qty</th>
									<th rowspan=2>Vendor Remarks</th>
									<th rowspan=2>CPT Remarks</th>
								</tr>
								<tr>

									<th th:text="*{w1PO}"></th>
									<th th:text="*{w2PO}"></th>
									<th th:text="*{w3PO}"></th>
									<th th:text="*{w4PO}"></th>

								</tr>
							</thead>
							<tbody>
								<tr th:if="*{prdPlanRequestItems.empty}">
									<td colspan="2">No Data</td> 
								</tr>
								<tr th:each="row, itemStat : *{prdPlanRequestItems}">
									<td
										th:text="*{prdPlanRequestItems[__${itemStat.index}__].category}"></td>
									<td
										th:text="*{prdPlanRequestItems[__${itemStat.index}__].material}"></td>
									<td
										th:text="*{prdPlanRequestItems[__${itemStat.index}__].materialDesc}"></td>
									<td
										th:text="*{prdPlanRequestItems[__${itemStat.index}__].weight}"></td>
									<td th:text="*{prdPlanRequestItems[__${itemStat.index}__].uom}"></td>
									<td
										th:text="*{prdPlanRequestItems[__${itemStat.index}__].storageLocation}"></td>
									<td><input readonly type="text" class="form-control week1Qty"
										
										th:field="*{prdPlanRequestItems[__${itemStat.index}__].week1Qty}" /><strong>KG:</strong><span class="week1Wt"
										th:text="*{#numbers.formatDecimal(prdPlanRequestItems[__${itemStat.index}__].week1Qty*prdPlanRequestItems[__${itemStat.index}__].netWt, 0, 'COMMA', 2, 'POINT')}"></span></td>
									<td><input readonly type="text" class="form-control week2Qty"
										
										th:field="*{prdPlanRequestItems[__${itemStat.index}__].week2Qty}" /><strong>KG:</strong><span class="week2Wt"
										th:text="*{#numbers.formatDecimal(prdPlanRequestItems[__${itemStat.index}__].week2Qty*prdPlanRequestItems[__${itemStat.index}__].netWt, 0, 'COMMA', 2, 'POINT')}"></span></td>
									<td><input readonly type="text" class="form-control week3Qty"
										
										th:field="*{prdPlanRequestItems[__${itemStat.index}__].week3Qty}" /><strong>KG:</strong><span class="week3Wt"
										th:text="*{#numbers.formatDecimal(prdPlanRequestItems[__${itemStat.index}__].week3Qty*prdPlanRequestItems[__${itemStat.index}__].netWt, 0, 'COMMA', 2, 'POINT')}"></span></td>
									<td><input readonly type="text" class="form-control week4Qty"
										 
										th:field="*{prdPlanRequestItems[__${itemStat.index}__].week4Qty}" /><strong>KG:</strong><span class="week4Wt"
										th:text="*{#numbers.formatDecimal(prdPlanRequestItems[__${itemStat.index}__].week4Qty*prdPlanRequestItems[__${itemStat.index}__].netWt, 0, 'COMMA', 2, 'POINT')}"></span></td>
									<td>
										<input th:readonly="*{!showApprove}" type="text" 
											class="form-control final-qty monthlyTotal" 
											th:field="*{prdPlanRequestItems[__${itemStat.index}__].totCPTAcpQty}" />
  										<strong>KG:</strong><span th:text="*{#numbers.formatDecimal(prdPlanRequestItems[__${itemStat.index}__].totCPTAcpQty*prdPlanRequestItems[__${itemStat.index}__].netWt, 0, 'COMMA', 2, 'POINT')}" class="final-qty-wt"></span>
									</td>    
									<td 
										 class="prop-qty">   
										<span th:text="*{prdPlanRequestItems[__${itemStat.index}__].total}"></span>
										<strong>KG:</strong><span th:text="*{#numbers.formatDecimal(prdPlanRequestItems[__${itemStat.index}__].total*prdPlanRequestItems[__${itemStat.index}__].netWt, 0, 'COMMA', 2, 'POINT')}" class="proposedQty"></span>
										</td>  
									<td><input th:if="*{showSubmit}" type="text" 
										class="form-control vend-qty"
										th:field="*{prdPlanRequestItems[__${itemStat.index}__].totVendAcpQty}" />
										<span th:unless="*{showSubmit}"
										th:text="*{prdPlanRequestItems[__${itemStat.index}__].totVendAcpQty}" class="vend-qty"></span>
									</td>
									
									<td><input type="hidden"
										th:field="*{prdPlanRequestItems[__${itemStat.index}__].lineNo}" />

										<!-- <textarea placeholder="+ Add a note" th:readonly="*{!showSubmit}" rows="2" cols="10" class="form-control"></textarea> -->

										<input th:if="*{showSubmit}" type="text" class="form-control"
										placeholder="+ Add a reason" list="list-reasons"
										id="input-datalist"
										th:field="*{prdPlanRequestItems[__${itemStat.index}__].vendAcpRemarks}">
										<datalist id="list-reasons">
											<option>Machine Breakdown</option>
											<option>Raw Material Shortage</option>
										</datalist> <span th:unless="*{showSubmit}"
										th:text="*{prdPlanRequestItems[__${itemStat.index}__].vendAcpRemarks}"></span>
									</td>
									<td><input th:if="*{showApprove}" type="text"
										class="form-control" placeholder="+ Add a reason"
										th:field="*{prdPlanRequestItems[__${itemStat.index}__].cptAcpRemarks}">
										<span th:unless="*{showApprove}"
										th:text="*{prdPlanRequestItems[__${itemStat.index}__].cptAcpRemarks}"></span>
									</td>
								</tr>
							</tbody>
							<tfoot>
								<tr>
									<td colspan="6"> Total </td>		
									<td id="week1Sum"></td>	
									<td id="week2Sum"></td>	
									<td id="week3Sum"></td>	
									<td id="week4Sum"></td>
									<td id="finalQtySum"></td>
									<td id="propQtySum"></td>	
									<td id="vendorQtySum"></td>	
									<td colspan="2"></td>				
								</tr>
							</tfoot>
						</table>
					</div>
				</div>
				<div class="card-footer d-flex justify-content-end">
					<!-- <button type="button" id="subBtn" onclick="funSubmit()" class="btn btn-primary pull-right" style="margin-left:5px"><i class="fa fa-arrow-circle-right fa-lg"></i>&nbsp;Submit</button>
                <button type="button" id="backBtn" class="btn btn-primary pull-right" style="margin-left:5px"><i class="fa fa-arrow-left fa-lg"></i>&nbsp;Back</button> -->
					<button type="button" id="subBtn" th:if="*{showSubmit}"
						class="btn btn-success pull-right" style="margin-left: 5px">
						<i class="fa fa-check fa-lg"></i>&nbsp;Submit
					</button>
					<button type="button" id="aprBtn" th:if="*{showApprove}"
						class="btn btn-success pull-right" style="margin-left: 5px">
						<i class="fa fa-check fa-lg"></i>&nbsp;Create PO
					</button>
				</div>
			</form>
		</div>
		<div id="woModal" class="modal fade" tabindex="-1" role="dialog">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-body">
						<button type="button" class="close" data-dismiss="modal"
							aria-hidden="true">&times;</button>
						<span id="modalcontent"></span>
					</div>
				</div>
			</div>
		</div>

	</div>
	<div layout:fragment="scriptContent">
		<script type="text/javascript">
		$(document).ready(function() {
			
		    function updateProposedQty() {
		        $("tr").each(function () {
		            let row = $(this);
		            let totalWeight = 0;
		            let totalQty = 0;

		            // Loop through each week's weight (KG values) in the row
		            row.find(".week1Wt, .week2Wt, .week3Wt, .week4Wt").each(function () {
		                let weight = parseFloat($(this).text().replace(/,/g, "")) || 0;
		                totalWeight += weight;
		            });
		            
		           row.find(".week1Qty, .week2Qty, .week3Qty, .week4Qty").each(function () {
		                let qty = parseFloat($(this).val().replace(/,/g, "")) || 0; 
		                totalQty += qty;
		            });

		            // Update the Proposed QTY column
		            //row.find(".proposedQty").text(totalWeight.toLocaleString());
		            row.find(".monthlyTotal").val(totalQty);
		        });
		    }

		    // Call function initially to calculate the proposed quantities
		    updateProposedQty(); 
		    // Recalculate when week input values change
		    //$(".week1Qty, .week2Qty, .week3Qty, .week4Qty").on("input", function () {
		    //    setTimeout(updateProposedQty, 500); // Delay ensures the value is updated
		    //});
			
			
			let week1Qty = 0;
			let week2Qty = 0;
			let week3Qty = 0;
			let week4Qty = 0;
			let week1Wt = 0;
			let week2Wt = 0;
			let week3Wt = 0;
			let week4Wt = 0;
			
			let propQty = 0;
			let vendQty = 0;
			let finalQty = 0;
			let finalQtyWt = 0;
			let totalProposedQty = 0;

			$('table tbody tr').each(function () {
	            week1Qty += parseFloat($(this).find('.week1Qty').val()) || 0;
	            week2Qty += parseFloat($(this).find('.week2Qty').val()) || 0;
	            week3Qty += parseFloat($(this).find('.week3Qty').val()) || 0;
	            week4Qty += parseFloat($(this).find('.week4Qty').val()) || 0;
	            
	            week1Wt += parseFloat($(this).find('.week1Wt').text().replace(/,/g, '')) || 0;
	            week2Wt += parseFloat($(this).find('.week2Wt').text().replace(/,/g, '')) || 0;
	            week3Wt += parseFloat($(this).find('.week3Wt').text().replace(/,/g, '')) || 0;
	            week4Wt += parseFloat($(this).find('.week4Wt').text().replace(/,/g, '')) || 0;
	            
	            propQty += parseFloat($(this).find('.prop-qty').text()) || 0;
	            vendQty += parseFloat($(this).find('.vend-qty').val()) || parseFloat($(this).find('.vend-qty').text()) || 0;
	            finalQty += parseFloat($(this).find('.final-qty').val()) || 0;
	            finalQtyWt += parseFloat($(this).find('.final-qty-wt').text().replace(/,/g, '')) || 0;
	            totalProposedQty += parseFloat($(this).find('.proposedQty').text().replace(/,/g, '')) || 0;
	            
	            
	        });
			$("#week1Sum").text(`${week1Qty.toFixed(2)}  KG:${week1Wt.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`);
			$("#week2Sum").text(`${week2Qty.toFixed(2)}  KG:${week2Wt.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`);
			$("#week3Sum").text(`${week3Qty.toFixed(2)}  KG:${week3Wt.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`);
			$("#week4Sum").text(`${week4Qty.toFixed(2)}  KG:${week4Wt.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`);
			
			
			$("#finalQtySum").text(`${finalQty.toFixed(2)} KG:${finalQtyWt.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`);
			$("#propQtySum").text(`${propQty.toFixed(2)} KG:${totalProposedQty.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`);
			$("#vendorQtySum").text(vendQty.toFixed(2));
		});
		
document.addEventListener('DOMContentLoaded', e => {
    $('#input-datalist').autocomplete()
}, false);
    $(function () {
    	
    	 $('.datepicker').datepicker({
        	 autoclose: true,
             format: 'dd/mm/yyyy'
        });
	
		$("#backBtn").click(function(){
			//Pace.restart();
			$("#backBtn").hide();
			$("#subBtn").hide();
			$("#calBtn").hide();
			$('#pleaseWaitDialog').modal('show');
			$("#myForm").attr("action", "/priceapr/onBackToSelect");
			$("#myForm").submit();
			
		});
		$("#subBtn").click(function(){
			//Pace.restart();
			//$('#pleaseWaitDialog').modal('show');
			document.myForm.action="/prdplan/submitRequest";
			document.myForm.submit();
		});
		$("#aprBtn").click(function(){
			//Pace.restart();
			//$('#pleaseWaitDialog').modal('show');
			loader.start();
			document.myForm.action="/prdplan/approveRequest";
			document.myForm.submit();
		});
		
		function splitAverage(total, count) {
			  const avg = Math.floor(total / count);        // Basic average without decimals
			  const remainder = total % count;              // Remainder to distribute
			  const result = [];

			  for (let i = 0; i < count; i++) {
			    if (i < remainder) {
			      result.push(avg + 1);  // Add 1 to first 'remainder' items
			    } else {
			      result.push(avg);
			    }
			  }

			  return result;
			}
		
		  
        $(".week1Qty, .monthlyTotal").on("input", function () {
        	
            let row = $(this).closest("tr"); // Get the current row
            
            let week1Qty = parseFloat(row.find(".week1Qty").val()) || 0;
            let monthlyTotal = parseFloat(row.find(".monthlyTotal").val()) || 0;
            
            console.log(row, monthlyTotal, week1Qty);

            if (monthlyTotal >= week1Qty) {
                let remaining = monthlyTotal - week1Qty;
                const result = splitAverage(remaining, 3);
                row.find(".week2Qty").val(result[0]);
                row.find(".week3Qty").val(result[1]);
                row.find(".week4Qty").val(result[2]);
            }
            else {
            	row.find(".week2Qty").val(0);
                row.find(".week3Qty").val(0);
                row.find(".week4Qty").val(0);
            }
            let finalQty = 0;
            $('table tbody tr').each(function () {
	            	finalQty += parseFloat($(this).find('.final-qty').val()) || 0;
	            	$("#finalQtySum").text(finalQty.toFixed(2));
	            }
            )
        });
		
	 });

    function showLog(status,msg)
	{
    	$('#modalcontent').html(msg);
		$('#woModal').modal({show:true});
	}
    function funSubmit()
    {
    	//$('#pleaseWaitDialog').modal('show');
    	$("#backBtn").hide();
		$("#subBtn").hide();
		$("#calBtn").hide();
    	document.myForm.action="/prdplan/updateRequest";
    	document.myForm.submit();
    }
    
    document.getElementById("exportBtn").addEventListener("click", function () {
        let table = document.getElementById("poPlanTable");
        let rows = table.rows;
        let excelContent = 
            '<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?>' +
            '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"' +
            ' xmlns:o="urn:schemas-microsoft-com:office:office"' +
            ' xmlns:x="urn:schemas-microsoft-com:office:excel"' +
            ' xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"' +
            ' xmlns:html="http://www.w3.org/TR/REC-html40">' +
            '<Worksheet ss:Name="Sheet1"><Table>';

        // Loop through rows
        for (let i = 0; i < rows.length; i++) {
            excelContent += "<Row>";
            let cols = rows[i].cells;

            // Loop through columns
            for (let j = 0; j < cols.length; j++) {
                let cell = cols[j];
                let data = "";

                // Check if cell contains an input field
                let input = cell.querySelector("input");
                if (input) {
                    data = input.value; // Get input value
                } else {
                    data = cell.innerText.trim(); // Get text content
                }

                excelContent += `<Cell><Data ss:Type="String">${data}</Data></Cell>`;
            }
            excelContent += "</Row>";
        }

        excelContent += "</Table></Worksheet></Workbook>";

        // Convert to Blob
        let blob = new Blob([excelContent], { type: "application/vnd.ms-excel" });

        // Create download link
        let a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "Production_Plan.xls"; // Use .xls (works in Excel)
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    });
   </script>
	</div>
</body>
</html>
