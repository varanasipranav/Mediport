<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
	layout:decorate="layout">
<head>
<link rel="stylesheet" type="text/css"
	href="../../../../resources/dist/css/table.css">
<style type="text/css">
.hide {
	display: none;
}
</style>
<title>Production Plan</title>
</head>
<body>	
	<section layout:fragment="header">
		<div class="container-fluid">
			<div class="row">
				<div class="col-sm-6">
					<h1 class="text-primary text-bold text-lg ml-2">Production Plan</h1>
				</div>
				<div class="col-sm-6">
					<ol class="breadcrumb float-sm-right">
						<li class="breadcrumb-item"><a href="#">Production Plan</a></li>
						<li class="breadcrumb-item active">View</li>
					</ol>
				</div>
			</div>
		</div>
	</section>
	
	<div layout:fragment="content">
		<div th:if="${success!= null}"
			class="alert alert-success alert-dismissible">
			<i class="icon fa fa-check"></i> <span th:text="${success}"></span>
		</div>
		<div class="card card-primary">
			<form data-toggle="validator" role="form" id="myForm" name="myForm"
				th:object="${prdPlanFormDetInput}"
				th:action="@{/prdplan/createRequest}" method="post">
				<div class="card-body">

					<input type="hidden" th:field="*{selVendor}" /> <input
						type="hidden" th:field="*{selOutPlant}" /> <input type="hidden"
						th:field="*{selMonthYr}" /> <input type="hidden"
						th:field="*{selPurGrp}" />

					<div class="" style="margin-top: 2%"
						th:if="*{!prdPlanRequestItems.empty}">
						<p class="text-green pull-right" style="margin-right: 10px">
							<Strong>No Of Records :<span
								th:text="*{#lists.size(prdPlanRequestItems)}"></span>
							</Strong>
						</p>
						<div class="table-container">
							<table
								class="col-sm-12 table table-bordered table-condensed table-striped styled-table">
								<thead class="primary">
									<tr>
										<th>Plant</th>
										<th>Category</th>
										<th>Material<br>
										<th>Description</th>
										<th>Weight</th>
										<th>UOM</th>
										<th>Storage Loc.</th>
										<th>Week1</th>
										<th>Week2</th>
										<th>Week3</th>
										<th>Week4</th>
										<th>Total</th>
										<th>Status</th>
									</tr>
								</thead>
								<tbody>
									<tr th:if="*{prdPlanRequestItems.empty}">
										<td colspan="2">No Data</td>
									</tr>
									<tr th:each="row, itemStat : *{prdPlanRequestItems}">

										<td
											th:text="*{prdPlanRequestItems[__${itemStat.index}__].plant}"></td>
										<td
											th:text="*{prdPlanRequestItems[__${itemStat.index}__].category}"></td>
										<td
											th:text="*{prdPlanRequestItems[__${itemStat.index}__].material}"></td>
										<td
											th:text="*{prdPlanRequestItems[__${itemStat.index}__].materialDesc}"></td>
										<td
											th:text="*{prdPlanRequestItems[__${itemStat.index}__].weight}"></td>
										<td
											th:text="*{prdPlanRequestItems[__${itemStat.index}__].uom}"></td>
										<td
											th:text="*{prdPlanRequestItems[__${itemStat.index}__].storageLocation}"></td>
										<td
											th:text="*{prdPlanRequestItems[__${itemStat.index}__].week1Qty}"
											class="week1Qty"></td>
										<td
											th:text="*{prdPlanRequestItems[__${itemStat.index}__].week2Qty}"
											class="week2Qty"></td>
										<td
											th:text="*{prdPlanRequestItems[__${itemStat.index}__].week3Qty}"
											class="week3Qty"></td>
										<td
											th:text="*{prdPlanRequestItems[__${itemStat.index}__].week4Qty}"
											class="week4Qty"></td>
										<td
											th:text="*{#numbers.formatDecimal(prdPlanRequestItems[__${itemStat.index}__].week1Qty+prdPlanRequestItems[__${itemStat.index}__].week2Qty+prdPlanRequestItems[__${itemStat.index}__].week3Qty+prdPlanRequestItems[__${itemStat.index}__].week4Qty, 0, 'COMMA', 2, 'POINT')}"
											class="totalQty"></td>
										<td>
										<input type="hidden"
											th:field="*{prdPlanRequestItems[__${itemStat.index}__].plant}" />
										<input type="hidden"
											th:field="*{prdPlanRequestItems[__${itemStat.index}__].category}" />
											<input type="hidden"
											th:field="*{prdPlanRequestItems[__${itemStat.index}__].categoryCode}" />
											<input type="hidden"
											th:field="*{prdPlanRequestItems[__${itemStat.index}__].material}" />
											<input type="hidden"
											th:field="*{prdPlanRequestItems[__${itemStat.index}__].materialDesc}" />
											<input type="hidden"
											th:field="*{prdPlanRequestItems[__${itemStat.index}__].weight}" />
											<input type="hidden"
											th:field="*{prdPlanRequestItems[__${itemStat.index}__].uom}" />
											<input type="hidden"
											th:field="*{prdPlanRequestItems[__${itemStat.index}__].week1Qty}" />
											<input type="hidden"
											th:field="*{prdPlanRequestItems[__${itemStat.index}__].week2Qty}" />
											<input type="hidden"
											th:field="*{prdPlanRequestItems[__${itemStat.index}__].week3Qty}" />
											<input type="hidden"
											th:field="*{prdPlanRequestItems[__${itemStat.index}__].week4Qty}" />
											<input type="hidden"
											th:field="*{prdPlanRequestItems[__${itemStat.index}__].total}" />
											<input type="hidden"
											th:field="*{prdPlanRequestItems[__${itemStat.index}__].storageLocation}" />
											<input type="hidden"
											th:field="*{prdPlanRequestItems[__${itemStat.index}__].errFlag}" />

											<span class="badge bg-success"
											th:if="*{prdPlanRequestItems[__${itemStat.index}__].errFlag != 'Y'}">OK</span>
											<span class="badge bg-danger"
											th:if="*{prdPlanRequestItems[__${itemStat.index}__].errFlag == 'Y'}"
											th:data-id="*{prdPlanRequestItems[__${itemStat.index}__].errText}"
											th:onclick="|showLog('E',this.getAttribute('data-id'))|">Error</span>
										</td>
									</tr>
								</tbody>

								<tfoot>
									<tr>
										<td colspan="7">Total</td>
										<td id="week1Sum"></td>
										<td id="week2Sum"></td>
										<td id="week3Sum"></td>
										<td id="week4Sum"></td>

										<td id="totalSum"></td>
										<td></td>
									</tr>
								</tfoot>
							</table>
						</div>

					</div>
				</div>
				<div class="d-flex justify-content-between p-3">
					<button type="button" id="backBtn"
						class="btn btn-secondary pull-right">
						<i class="fa fa-arrow-left fa-lg"></i>&nbsp;Back
					</button>
					<button type="button" id="subBtn" onclick="funSubmit()"
						class="btn btn-primary pull-right">
						<i class="fa fa-arrow-circle-right fa-lg"></i>&nbsp;Submit
					</button>
					<!-- <button type="button" id="calBtn" class="btn btn-primary pull-right" style="margin-left:5px"><i class="fa fa-calculator fa-lg"></i>&nbsp;Calculate</button> -->
				</div>
			</form>
		</div>
		<div id="woModal" class="modal fade" tabindex="-1" role="dialog">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-body">
						<button type="button" class="close" data-dismiss="modal"
							aria-hidden="true">&times;</button>
						<span id="modalcontent"><</span>
					</div>
				</div>
			</div>
		</div>

	</div>
	<div layout:fragment="scriptContent">
		<script type="text/javascript">
			$(document).ready(
					function() {
						let week1Qty = 0;
						let week2Qty = 0;
						let week3Qty = 0;
						let week4Qty = 0;
						let totalSum = 0;

						$('table tbody tr').each(
								function() {
									week1Qty += parseFloat($(this).find(
											'.week1Qty').text()) || 0;
									week2Qty += parseFloat($(this).find(
											'.week2Qty').text()) || 0;
									week3Qty += parseFloat($(this).find(
											'.week3Qty').text()) || 0;
									week4Qty += parseFloat($(this).find(
											'.week4Qty').text()) || 0;
									totalSum += parseFloat($(this).find(
											'.totalQty').text().replace(/,/g, '')) || 0;

								});
						$("#week1Sum").text(week1Qty.toLocaleString());
						$("#week2Sum").text(week2Qty.toLocaleString());
						$("#week3Sum").text(week3Qty.toLocaleString());
						$("#week4Sum").text(week4Qty.toLocaleString());
						$("#totalSum").text(totalSum.toLocaleString())

					});

			$(function() {
				$('.datepicker').datepicker({
					autoclose : true,
					format : 'dd/mm/yyyy'
				});

				$("#backBtn").click(function() {
					//Pace.restart();
					$("#backBtn").hide();
					$("#subBtn").hide();
					$("#calBtn").hide();
					$('#pleaseWaitDialog').modal('show');
					$("#myForm").attr("action", "/prdplan/onBackToSelect");
					$("#myForm").submit();

				});

			});

			function showLog(status, msg) {
				$('#modalcontent').html(msg);
				$('#woModal').modal({
					show : true
				});
			}
			function funSubmit() {
				//$('#pleaseWaitDialog').modal('show');
				$("#backBtn").hide();
				$("#subBtn").hide();
				$("#calBtn").hide();
				document.myForm.action = "/prdplan/createPlan";
				document.myForm.submit();
			}
		</script>
	</div>
</body>
</html>
