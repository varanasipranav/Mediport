<div id="uploadFile"  class="modal fade" role="dialog" th:fragment="uploadFile(title)">
	<div class="modal-dialog">
		<form id="fileUploadForm" enctype="multipart/form-data">
		<div class="modal-content">
			<div class="modal-header bg-primary">
				<h4 class="modal-title"><span style="font-weight:bold" th:text="${title}"></span></h4>
			</div>
				<div class="modal-body">
			    <input id="file" type="file" th:name="file">
				</div>	
				<div class="modal-footer">
					<button type="button"  id="closeModal" class="btn btn-default" data-dismiss="modal">Cancel</button>
			        <button type="button" class="btn btn-primary" id=uploadButton>Upload</button>
				</div>
		</div>
		</form>
	</div>
</div>
