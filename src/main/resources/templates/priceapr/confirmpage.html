<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorator="layout">
<head>
	<style type="text/css">
.table-container {
    height: 10em;
}
table {
    display: flex;
    flex-flow: column;
    height: auto;
    width: 100%;
}
table thead {
    /* head takes the height it requires, 
    and it's not scaled when table is resized */
    flex: 0 0 auto;
    width: calc(100% - 0.9em);
}
table tbody {
    /* body takes all the remaining available space */
    flex: 1 1 auto;
    display: block;
    overflow-y: scroll;
}
table tbody tr {
    width: 100%;
}
table thead, table tbody tr {
    display: table;
    table-layout: fixed;
}
    td{
    	padding:0px !important;
    }
    </style>
    <title>Price Approval</title>
</head>
<body>
<section layout:fragment="header"> 
    <h1>Confirmation</h1>
    <ol class="breadcrumb">
        <li><a href="/"><i class="fa fa-dashboard"></i> Price Approval</a></li>
        <li class="active">Confirmation</li>
    </ol>
</section>
<div layout:fragment="content">
	
    <div class="box">
    	     <form data-toggle="validator" role="form"  id="myForm" name="myForm" th:object="${output}" th:action="@{/dashboard/index.html}" method="post" >
            <input type="hidden" id="offline" th:value="${session.offline}"/>  
            <div class="box-body">
                <div class="table-responsive" style="margin-top:2%">
					<div th:if="*{type == 'success'}" class="alert alert-success alert-dismissible">
						<i class="icon fa fa-check"></i>
						<span th:text="*{text}" ></span>
					</div>
					<div th:if="*{type == 'error'}" class="alert alert-danger alert-dismissible">
						<i class="icon fa fa-check"></i>
						<span th:text="*{text}" ></span>
					</div>        
            </div>
            </div>
            <div class="box-footer">
                <a class="btn btn-success pull-right" th:href="@{/dashboard/index.html}" style="margin-left:5px"><i class="fa fa-check fa-lg"></i>&nbsp;OK</a>
                
            </div> 
        </form>
    </div>
    
    
</div>
<div layout:fragment="scriptContent">
<script type="text/javascript">
     
    $(function () {
    	if($('#offline').val() == "true")
    	{
    		$('#mainHeader').hide();
    		$('#sideMenuBar').hide();
    		$("#logoLink").attr("href","#");
    		$('#sidebarBtn').trigger('click');
    	}
		$('.select2').select2();
		$("#okBtn").click(function(){
			//Pace.restart();
			$('#pleaseWaitDialog').modal('show');
			if($('#offline').val() == "true")
	    	{
				document.myForm.action="/logout";
	    	}
			else
			{
				//document.myForm.action="/dashboard/home";
			}
			document.myForm.submit();
		});
	 });
    $('input').on('paste', function(e){
        var $this = $(this);
        $.each(e.originalEvent.clipboardData.items, function(i, v){
            if (v.type === 'text/plain'){
                v.getAsString(function(text){
                    var x = $this.closest('td').index(),
                        y = $this.closest('tr').index(),
                        obj = {};
                    text = text.trim('\r\n');
                    $.each(text.split('\r\n'), function(i2, v2){
                        $.each(v2.split('\t'), function(i3, v3){
                            var row = y+i2, col = x+i3;
                            obj['cell-'+row+'-'+col] = v3;
                            $this.closest('table').find('tr:eq('+row+') td:eq('+col+') input').val(v3);
                        });
                    });
                    //$('div').text(JSON.stringify(obj));
                });
            }
        });
        return false;
       
    });
   </script>
</div>
</body>
</html>
