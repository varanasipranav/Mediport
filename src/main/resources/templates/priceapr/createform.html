<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorator="layout">
<head>
    <title>Price Approval</title>
</head>
<body>
<section layout:fragment="header"> 
    <h1>Create Request</h1>
    <ol class="breadcrumb">
        <li><a href="/"><i class="fa fa-dashboard"></i> Price Approval</a></li>
        <li class="active">Create Request</li>
    </ol>
</section>
<div layout:fragment="content">
	<div th:if="${success!= null}" class="alert alert-success alert-dismissible">
   			<i class="icon fa fa-check"></i>
   			<span th:text="${success}" ></span>
   	</div>
   	<div th:if="${error!= null}" class="alert alert-danger alert-dismissible">
   			<i class="icon fa fa-check"></i>
   			<span th:text="${error}" ></span>
   	</div>
    <div class="box">
    	     <form data-toggle="validator" enctype="multipart/form-data" role="form" name="myForm" id="myForm" th:object="${priceReqInput}" th:action="@{/priceapr/submitReqInput}" method="post" >

					    <option th:each="option : *{condTypes}" th:value="${option.value1+'##'+option.value2}" th:text="${option.value1+'-'+option.value2}"></option>

					</select>
				</td>
				</tr>
				<tr>

					    <option value="">--Select Dist Chnl--</option>

					</select>

					    <option value="">--Select Sub Chnl--</option>
					    <option th:each="option : *{subChnl}" th:value="${option.value1}" th:text="${option.value1+'-'+option.value2}"></option>
					</select> -->

					    <option value="">--Select Sub Chnl--</option>
					    
					</select>

				</td>

						<option value="DSNR##Sinnar - Depot">DSNR--Sinnar - Depot</option>

						<option value="DUMY##Dummy Plant">DUMY--Dummy Plant</option>

						<option value="PHDW##Haridwar-Manufacturing Plant">PHDW--Haridwar-Manufacturing Plant</option>
						<option value="PJAL##Jalgaon Plant - No Operation">PJAL--Jalgaon Plant - No Operation</option>
						<option value="PMGL##Bangladesh Mfg Unit">PMGL--Bangladesh Mfg Unit</option>
						<option value="PMLC##VIP Acc BD Pvt Ltd.">PMLC--VIP Acc BD Pvt Ltd.</option>
						<option value="PNAG##Nagpur Plant - No Operations">PNAG--Nagpur Plant - No Operations</option>
						<option value="PNSK##Nasik-Manufacturing Plant">PNSK--Nasik-Manufacturing Plant</option>
						<option value="PSNR##Sinnar-Manufacturing Plant">PSNR--Sinnar-Manufacturing Plant</option>

						<option value="VAMD##Ahmedabad-Branch">VAMD--Ahmedabad-Branch</option>
						<option value="VBGR##Bangalore-Branch">VBGR--Bangalore-Branch</option>

						<option value="VCHI##CHINA-Branch">VCHI--CHINA-Branch</option>

						<option value="VIDR##Indore-Branch">VIDR--Indore-Branch</option>
						<option value="VJMU##Jammu-Branch">VJMU--Jammu-Branch</option>
						<option value="VJPR##Jaipur-Branch">VJPR--Jaipur-Branch</option>
						<option value="VKOL##Kolkatta-Branch">VKOL--Kolkatta-Branch</option>
						<option value="VLKW##Lucknow -Branch">VLKW--Lucknow -Branch</option>
						<option value="VMUM##Mumbai-Branch">VMUM--Mumbai-Branch</option>
						<option value="VNAG##Nagpur-Branch">VNAG--Nagpur-Branch</option>
						<option value="VPNA##Pune-Branch">VPNA--Pune-Branch</option>
						<option value="VPRW##Parwanoo-Branch">VPRW--Parwanoo-Branch</option>
						<option value="VPTN##Patna-Branch">VPTN--Patna-Branch</option>
						<option value="VRAI##Raipur-Branch">VRAI--Raipur-Branch</option>
						<option value="VRAN##Ranchi-Branch">VRAN--Ranchi-Branch</option>
						<option value="VVIJ##Vijaywada-Branch">VVIJ--Vijaywada-Branch</option>
						<option value="VZIR##Zirakpur-Branch">VZIR--Zirakpur-Branch</option>
						<option value="VZIR##Zirakpur-Branch">VZIR--Zirakpur-Branch</option>
						<option value="RDW1##RDC Mumbai">RDW1--RDC Mumbai</option>
						<option value="RDE1##RDC Kolkata">RDE1--RDC Kolkata</option>

	                </select>
               </td>
               </tr>
               <tr>
				<th>Brand</th>
				<td>	
					<select class="form-control" th:field="*{selBrand}"  id="selBrand" style="width:100%">
					    <option value="">--Select Brand--</option>
					    <option th:each="option : *{brands}" th:value="${option.value1}" th:text="${option.value1+'-'+option.value2}"></option>
					</select>
				</td>
				<th>Dist Cat</th>
				<td>	
					<select class="form-control" th:field="*{selDistCat}"  id="selDistCat" style="width:100%">
					    <option value="">--Select Dist Cat--</option>
					    <option th:each="option : *{distCat}" th:value="${option.value1}" th:text="${option.value1}"></option>
					</select>
				</td>
				</tr>
               <tr>
               	<th>
                    Upload File
                </th>
                <td colspan=3>
                	<input type="file" id="inputFile" th:field="*{file}">
                </td>
                <td>
               </tr>
               <tr>
               <td colspan=4>
                
                	<textarea cols=100 class="form-control" th:field="*{comments}" placeholder="Enter Comments" rows="2"></textarea>
                </td>
                </tr>
                </table>
            </div>
            </div>
            <div class="box-footer" th:if="*{showFormDet}">                
                <button type="button" id="subBtn" class="btn btn-primary pull-right" style="margin-left:5px"><i class="fa fa-arrow-circle-right fa-lg"></i>&nbsp;Continue</button>
                <button type="button" id="downloadBtn" class="btn btn-primary pull-left" style="margin-left:5px"><i class="fa fa-download fa-lg"></i>&nbsp;Download Sample</button>
                <button type="button" id="uploadBtn" class="btn btn-primary pull-left" style="margin-left:5px"><i class="fa fa-upload fa-lg"></i>&nbsp;Upload Excel</button>
            </div> 
        </form>
    </div>
    
    
</div>
<div layout:fragment="scriptContent">
<script type="text/javascript">
     
    $(function () {
		$('.select2').select2();
		//$("#uploadBtn").hide();
		//$("#downloadBtn").hide();
		$("#subBtn").click(function(){
			//alert($("#myForm").validationEngine('validate'))
			
			if($("#myForm").validationEngine('validate'))
			{
				var selCondTypes=$("#selCondTypes").val().split("##")[0];
				var seqId=$("input:radio.selSeq:checked").val();
				var selDistChnl=$("#selDistChnl").val();
				//alert("seqId::"+seqId);
				
				if(selCondTypes  != 'ZMRP' && selCondTypes  != 'ZLP')
				{
					if($('#valArea').val() == "")
					{
						$('#valArea').validationEngine('showPrompt', 'Please select area', '');
						return ;
					}
				}
				if(selDistChnl  == 'TT' || selDistChnl  == 'EB')
				{
					if($('#selDistCat').val() == "")
					{
						$('#selDistCat').validationEngine('showPrompt', 'Please select Dist Cat', '');
						return ;
					}
				}
				if(typeof seqId == "undefined" || seqId == "")
				{
					//alert("Please select the sequence");
					$('.selSeq').validationEngine('showPrompt', 'Please select the sequence', '')
				}
				else
				{
					$('#pleaseWaitDialog').modal('show');
					$("#myForm").attr("action", "/priceapr/submitReqInput");
					$("#myForm").submit();
				}
				
				//Pace.restart();
			}
		});
		$("#uploadBtn").click(function(){
			//alert($("#myForm").validationEngine('validate'))
			if($("#myForm").validationEngine('validate'))
			{
				var selCondTypes=$("#selCondTypes").val().split("##")[0];
				var seqId=$("input:radio.selSeq:checked").val();
				//alert("seqId::"+seqId);
				
				if(selCondTypes  != 'ZMRP' && selCondTypes  != 'ZLP')
				{
					if($('#valArea').val() == "")
					{
						$('#valArea').validationEngine('showPrompt', 'Please select area', '');
						return ;
					}
				}
				
				if(typeof seqId == "undefined" || seqId == "")
				{
					//=alert("Please select the sequence");
					$('.selSeq').validationEngine('showPrompt', 'Please select the sequence', '')
					return ;
				}
				
				//alert("test")
				if($('#inputFile').val() == '')
				{
					alert("Please upload file");
					return ;
				}
				var ext = $('#inputFile').val().split('.').pop().toLowerCase();
				if($.inArray(ext, ['xls','xlsx']) == -1) {
				    alert('Please upload file format xls or xlsx');
				    return ;
				}
				$('#pleaseWaitDialog').modal('show');
				$("#myForm").attr("action", "/priceapr/submitReqUpload");
				$("#myForm").submit();
				//Pace.restart();
			}
		});
		$("#downloadBtn").click(function(){
			var seqId=$("input:radio.selSeq:checked").val();
			//alert("seqId::"+seqId);
			if(typeof seqId == "undefined" || seqId == "")
			{
				//=alert("Please select the sequence");
				$('.selSeq').validationEngine('showPrompt', 'Please select the sequence', '')
			}
			else
			{
				location.href="/priceapr/sampExcel/"+seqId+"/"+$("#selCondTypes").val().split("##")[0];
			}
		});
		$("#selCondTypes").change(function(){
			$("#myForm").attr("action", "/priceapr/onChangeCondType");
			$("#myForm").submit();
			Pace.restart();
		});
		 /* $('input[type="radio"]').click(function(){
		        var inputValue = $(this).attr("value");
		        if(inputValue == 3)
		        {
		        	$("#uploadBtn").show();
		        	$("#downloadBtn").show();
		        }
		        else
		        {
		        	$("#uploadBtn").hide();
		        	$("#downloadBtn").hide();
		        }
		    }); */
		$.each($(".select2-container"), function (i, n) {
		    $(n).next().show().fadeTo(0, 0).height("0px").css("left", "auto"); // make the original select visible for validation engine and hidden for us
		    $(n).prepend($(n).next());
		    $(n).delay(500).queue(function () {
		        $(this).removeClass("validate[required]"); //remove the class name from select2 container(div), so that validation engine dose not validate it
		        $(this).dequeue();
		    });
		});
		 $('#selMainChnl').change(
			        function() {
			            $.getJSON("/priceapr/getSubChannel", {
			            	mainChannel : $(this).val(),
			                ajax : 'true'
			            }, function(data) {
			                var html = '<option value="">--Select Sub Channel--</option>';
			                var len = data.length;
			                for ( var i = 0; i < len; i++) {
			                    html += '<option value="' + data[i].value1 + '">'
			                            + data[i].value1+'-'+data[i].value2 + '</option>';
			                }
			                html += '</option>';
			                $('#selSubChnl').html(html);
			                if($('#tempSelSubChnl').val() != "")
			                	$("#selSubChnl").val($('#tempSelSubChnl').val());
			                else
			                	$('#tempSelSubChnl').val("");
			                
			            });
			        }); 
		
		if($('#selMainChnl').val() != "")
		{
			$('#selMainChnl').val($('#selMainChnl').val()).trigger("change");
			//debugger;
	 
		}
	 });
   </script>
</div>
</body>
</html>
