<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="layout">

<head>
    <meta charset="ISO-8859-1">
    <title>Edit User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        .has-error { border-color: #dc3545 !important; }
        .card { box-shadow: 0 0.75rem 1.5rem rgba(18, 38, 63, 0.03); border-radius: 1rem; margin-top: 30px; }
        .form-label i { margin-right: 5px; color: #0d6efd; }
        .select2-container { width: 100% !important; }
        .vendor-only { display: none; }
        /* Custom dropdown styles for pills */
        .custom-dropdown { position: relative; width: 100%; }
        .custom-dropdown-toggle { width: 100%; padding: 8px 12px; border: 1px solid #ced4da; border-radius: 0.375rem; background-color: #fff; cursor: pointer; display: flex; justify-content: space-between; align-items: center; min-height: 38px; }
        .custom-dropdown-toggle:hover { border-color: #86b7fe; }
        .custom-dropdown-toggle:focus { outline: none; border-color: #86b7fe; box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25); }
        .custom-dropdown-menu { position: absolute; top: 100%; left: 0; right: 0; background-color: #fff; border: 1px solid #ced4da; border-radius: 0.375rem; box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15); z-index: 1050; max-height: 200px; overflow-y: auto; display: none; }
        .custom-dropdown-menu.show { display: block; }
        .custom-dropdown-item { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #f1f3f4; }
        .custom-dropdown-item:hover { background-color: #f8f9fa; }
        .custom-dropdown-item:last-child { border-bottom: none; }
        .custom-dropdown-item input[type="checkbox"] { margin-right: 8px; }
        .dropdown-placeholder { color: #6c757d; }
        .selected-count { background-color: #007bff; color: #fff; border-radius: 12px; padding: 2px 8px; font-size: 0.75rem; margin-left: 8px; }
        .selected-items { display: flex; flex-wrap: wrap; gap: 4px; max-height: 60px; overflow-y: auto; align-items: center; }
        .selected-item { background-color: #e3f2fd; color: #1976d2; border-radius: 16px; padding: 4px 8px; font-size: 0.75rem; display: inline-flex; align-items: center; max-width: 150px; }
        .selected-item-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .selected-item .fa-times { margin-left: 6px; cursor: pointer; }
        .dropdown-arrow { transition: transform 0.2s ease; }
        .dropdown-arrow.rotated { transform: rotate(180deg); }
        .select2-container--default .select2-selection--single{ height: 40px;}
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container mt-4">
        <div class="card p-4">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="fa fa-user-edit"></i> Edit User</h4>
            </div>
            <div class="card-body">
                <form id="userForm" name="userForm" th:action="@{/user/editSave}" th:object="${userForm}" method="POST">
                    <input type="hidden" th:field="*{id}" />
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="userId"><i class="fa fa-id-badge"></i> User Id</label>
                            <input type="text" th:field="*{userId}" id="userId" class="form-control" readonly />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="firstName"><i class="fa fa-user"></i> First Name</label>
                            <input type="text" th:field="*{firstName}" id="firstName" class="form-control" placeholder="Enter First Name" th:errorclass="has-error" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="lastName"><i class="fa fa-user"></i> Last Name</label>
                            <input type="text" th:field="*{lastName}" id="lastName" class="form-control" placeholder="Enter Last Name" th:errorclass="has-error" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="email"><i class="fa fa-envelope"></i> E-Mail</label>
                            <input type="email" th:field="*{email}" id="email" class="form-control" placeholder="Enter E-Mail" th:errorclass="has-error" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="role"><i class="fa fa-user-shield"></i> Role</label>
                            <select class="form-select select2" th:field="*{role}" id="roleDropdown">
                                <option value="">-- Select Role --</option>
                                <option th:each="role : ${roles}" th:value="${role.roleId}" th:utext="${role.roleDesc}" />
                            </select>
                        </div>
                        <!-- Privileges (custom dropdown, vendor-only) -->
                        <div class="vendor-only col-md-6">
                            <label class="form-label"><i class="fa fa-key"></i> Privileges</label>
                            <div class="custom-dropdown" id="privilegesDropdown">
                                <div class="custom-dropdown-toggle" tabindex="0">
                                    <span class="dropdown-placeholder">-- Select Privileges --</span>
                                    <i class="fa fa-chevron-down dropdown-arrow"></i>
                                </div>
                                <div class="custom-dropdown-menu">
                                    <div th:each="privilege : ${privileges}" class="custom-dropdown-item">
                                        <input type="checkbox" th:value="${privilege.id}" th:id="'privilege-' + ${privilege.id}">
                                        <label th:for="'privilege-' + ${privilege.id}" th:text="${privilege.desc}"></label>
                                    </div>
                                </div>
                            </div>
                            <input type="hidden" th:field="*{privilegeIds}" id="privilegesHidden">
                        </div>
                        <!-- Vendor (vendor-only) -->
                        <div class="vendor-only col-md-6">
                            <label class="form-label" for="vendorCode"><i class="fa fa-industry"></i> Vendor</label>
                            <select class="form-select select2" th:field="*{vendorCode}" id="vendorCode">
                                <option value="">-- Select --</option>
                                <option th:each="vendorCode : ${vendorCodes}" th:value="${vendorCode.value1}" th:utext="${vendorCode.value2}" />
                            </select>
                        </div>
                    </div>
                    <div class="text-end mt-4">
                        <button type="submit" class="btn btn-success px-4"><i class="fa fa-save"></i> Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="scriptContent">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script th:inline="javascript">
        $(document).ready(function () {
            // Show/hide vendor-only fields
            function toggleVendorFields() {
                const selectedRole = $('#roleDropdown option:selected').text().toLowerCase();
                if (selectedRole.includes('vendor')) {
                    $('.vendor-only').slideDown();
                } else {
                    $('.vendor-only').slideUp();
                }
            }
            toggleVendorFields();
            $('#roleDropdown').on('change', function () {
                toggleVendorFields();
            });

            // Select2 for single selects
            $('.select2').select2({ allowClear: false });

            // Custom dropdown for privileges
            function initCustomDropdown(dropdownId, hiddenInputId, selectedIds) {
                const dropdown = $('#' + dropdownId);
                const toggle = dropdown.find('.custom-dropdown-toggle');
                const menu = dropdown.find('.custom-dropdown-menu');
                const arrow = dropdown.find('.dropdown-arrow');
                const hiddenInput = $('#' + hiddenInputId);
                const placeholderSpan = toggle.find('span');

                // Pre-select checkboxes if editing
                if (selectedIds && selectedIds.length > 0) {
                    menu.find('input[type="checkbox"]').each(function() {
                        if (selectedIds.includes($(this).val())) {
                            $(this).prop('checked', true);
                        }
                    });
                }

                // Toggle dropdown
                toggle.on('click', function(e) {
                    e.stopPropagation();
                    menu.toggleClass('show');
                    arrow.toggleClass('rotated');
                });

                // Handle checkbox changes
                menu.on('change', 'input[type="checkbox"]', function() {
                    updateSelection();
                });

                // Remove pill on cross click
                toggle.on('click', '.fa-times', function(e) {
                    e.stopPropagation();
                    const value = $(this).data('value');
                    menu.find('input[type="checkbox"][value="' + value + '"]').prop('checked', false);
                    updateSelection();
                });

                // Prevent menu close when clicking inside
                menu.on('click', function(e) { e.stopPropagation(); });

                // Close dropdown when clicking outside
                $(document).on('click', function() {
                    menu.removeClass('show');
                    arrow.removeClass('rotated');
                });

                function updateSelection() {
                    const selectedValues = [];
                    const selectedTexts = [];
                    menu.find('input[type="checkbox"]:checked').each(function() {
                        selectedValues.push($(this).val());
                        selectedTexts.push($(this).next('label').text());
                    });
                    hiddenInput.val(selectedValues.join(','));
                    // Pills
                    if (selectedValues.length === 0) {
                        placeholderSpan.html('<span class="dropdown-placeholder">-- Select Privileges --</span>');
                    } else {
                        let itemsHtml = selectedValues.map((val, idx) =>
                            '<span class="selected-item"><span class="selected-item-text">' + selectedTexts[idx] + '</span><i class="fa fa-times ms-1" data-value="' + val + '"></i></span>'
                        ).join('');
                        placeholderSpan.html('<div class="selected-items">' + itemsHtml + '</div>');
                    }
                }
                updateSelection();
            }

            // Parse selected privilegeIds from hidden input (for edit)
            let selectedPrivilegeIds = $('#privilegesHidden').val();
            let selectedIdsArr = selectedPrivilegeIds ? selectedPrivilegeIds.split(',') : [];
            initCustomDropdown('privilegesDropdown', 'privilegesHidden', selectedIdsArr);
        });
    </script>
</div>
</body>
</html>
