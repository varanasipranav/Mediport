<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      layout:decorate="layout">
<body>
	<section layout:fragment="header">
		<div class="container-fluid">
			<div class="row">
				<div class="col-sm-6">
					<h1 class="text-primary text-bold text-lg ml-2">Initiate Request for PPAP</h1>
				</div>
				<div class="col-sm-6">
					<ol class="breadcrumb float-sm-right">
						<li class="breadcrumb-item"><a href="#">Initiate Request for PPAP</a></li>
						<li class="breadcrumb-item active">Create</li>
					</ol>
				</div>
			</div>
		</div>
	</section>
<div layout:fragment="content"  class="container-fluid">

<div class="row">
			<div class="col-12">
				<div class="card">
					<div class="card-body">

	<div th:if="${success!= null}" class="alert alert-success alert-dismissible">
   			<i class="icon fa fa-check"></i>
   			<span th:text="${success}" ></span>
   	</div>
   	<div th:if="${error!= null}" class="alert alert-danger alert-dismissible">
   			<i class="icon fa fa-check"></i>
   			<span th:text="${error}" ></span>
   	</div>
   <div class="container-fluid">
        <div class="row">
          <!-- left column -->
          <div class="col-md-6">
            <!-- general form elements -->
            <div class="card card-primary">
              <div class="card-header">
                <h3 class="card-title">Create</h3>
              </div>
              <!-- /.card-header -->
              <!-- form start -->
              <form data-toggle="validator" enctype="multipart/form-data" role="form" name="myForm" id="myForm" th:object="${ppapReqInput}" th:action="@{/ppap/submitReqInput}" method="post" >
			   <div class="card-body">
                  <div class="form-group">
                    <label for="selMatType">Select Material Type*</label> 
                    <select class="form-control  validate[required]" th:field="*{selMaterialType}"  id="selMaterialType" style="width:100%">
						    <option value="">--Select Type--</option>
						    <option th:each="option : *{materialTypes}" th:value="${option}" th:text="${option}"></option>
					</select>
                  </div>
                  <div class="form-group">
                    <label for="selMaterial">Enter Material Code*</label>
                    <input type="text"  placeholder="Enter Material Code" class="form-control validate[required]" th:field="*{selMaterial}"  id="selMaterial">
                  </div>
				  <div class="form-group"> 
                    <label for="descripton">Description</label> 
					<input type="text"  placeholder="Description"  class="form-control validate[required]" th:field="*{selDesc}"  readonly   id="selDesc">
                  </div>
<!--                    <div class="form-group"> 
                    <label for="selType">Select Type*</label>
                     <ul> 
					<li th:each="typeOfBusiness, iterStat : *{typeOfBusinessList}" 
					    th:if="${typeOfBusiness != 'CEAT Tech. Specification'}">
					    <label th:for="${'typeOfBusiness_' + iterStat.index}" th:text="${typeOfBusiness}"></label>
					    <input type="checkbox" class="validate[required]" th:id="${'typeOfBusiness_' + iterStat.index}" 
					           th:field="*{selectedTypeOfBusiness}" 
					           th:value="${typeOfBusiness}" />
					</li>	       
		           </ul> 
                  </div> -->
                  
                  
                  <div class="form-group">
					  <label for="selType">Select Type*</label>
					  <div class="row">
					    <div class="col-md-6" th:each="typeOfBusiness, iterStat : *{typeOfBusinessList}" 
					         th:if="${typeOfBusiness != 'CEAT Tech. Specification'}">
					      <div class="form-check">
					        <input type="checkbox"
					               class="form-check-input validate[required]"
					               th:id="${'typeOfBusiness_' + iterStat.index}"
					               th:field="*{selectedTypeOfBusiness}"
					               th:value="${typeOfBusiness}" />
					        <label class="form-check-label" th:for="${'typeOfBusiness_' + iterStat.index}" 
					               th:text="${typeOfBusiness}"></label>
					      </div>
					    </div>
					  </div>
					</div>
	                  
	                <!-- <div class="form-group">	
						<label for="group">Select Type*</label>
						 <select id="multiple-checkboxes" multiple class="form-control validate[required]"   data-placeholder="Select Type" th:field="*{selectedTypeOfBusiness}">
	                         <option value=""> --Select-- </option>
	                         <option th:each="typeOfBusiness : *{typeOfBusinessList}"
	                            th:value="${typeOfBusiness}"
	                            th:utext="${typeOfBusiness}"/>
	                  </select>			
					</div> -->
                  
                  <div class="form-group">	
					<label for="group">Plant*</label>
					 <select class="form-control validate[required]"   data-placeholder="Select document Type" th:field="*{docType}">
                         <option value=""> --Select-- </option>
                         <option th:each="valuemap : *{docType}"
                            th:value="${valuemap.value1}"
                            th:utext="${valuemap.value1+'-'+valuemap.value2}"/>
                  </select>			
				</div>
  				<div class="form-group"> 
                
                    <div class="input-group"> 	
                     <a onclick="showUploadModal(this)" class="btn btn-warning">
                         <i class="fa fa-upload" style="color:green"></i> Upload File(Manufacturability)
                     </a>
                      
                        <input type="hidden" name="uuid" id="uuid"   th:value="${uuid}">
                         <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                      </div>
                     
                   
                  </div>
                  <div class="form-group"> 
                
                    <table id="uploadManufacturabilityFile"></table>  
                    
                     
                   
                  </div>
                    <div class="input-group">
							    <label for="comments">Comments:</label>
							</div>
							 <div class="input-group">
							   <textarea id="comments" name="comments" rows="2" cols="50" class="form-control" 
							          th:field="*{comments}"   maxlength="100" placeholder="Enter your comments here..."></textarea>
							</div>
					 
                   
                
                <!-- /.card-body -->

                <div class="mt-3 d-flex justify-content-end">
                  <button type="submit" id="submitBtn" class="btn btn-primary">Submit</button>
                  <!-- <button type="button" id="subBtn" class="btn btn-primary pull-right" style="margin-left:5px"><i class="fa fa-arrow-circle-right fa-lg"></i>&nbsp;Continue</button> -->
                  <!-- <button type="button" id="downloadBtn" class="btn btn-primary pull-left" style="margin-left:5px"><i class="fa fa-download fa-lg"></i>&nbsp;Download Sample</button>-->
                  <!--<button type="button" id="uploadBtn" class="btn btn-primary pull-left" style="margin-left:5px"><i class="fa fa-upload fa-lg"></i>&nbsp;Upload </button>-->
                
                </div>
                </div>
              </form>
            </div>
           </div>
          </div>	
          
               </div>
           </div>
          </div>
				
			
</div>
<div class="modal fade" id="uploadExcelFrag" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog"> 
        <div class="modal-content">
            <form id="modalForm" th:action="@{/files/upload-temp}"  method="post" enctype="multipart/form-data"> 
                <div class="modal-header bg-primary">
                    <h5 class="modal-title" id="modalLabel">Upload File</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                     <input type="file" th:name="file" id="file"> 
                      <input type="hidden" name="_csrf"  th:value="${_csrf.token}" />
                        <input type="hidden" name="uuid" id="uuid" th:value="${uuid}">
                </div>
                
                <div class="modal-footer">
                    <button type="button"  id="closeModal" class="btn btn-default" data-dismiss="modal">Close</button>
                    <button type="submit"  class="btn btn-primary">Submit</button>
                </div>
            </form>
        </div>
    </div>
</div>
</div>
</body>




	

<div layout:fragment="scriptContent">
<script th:inline="javascript">

$(document).ready(function() { 
	 		$("#myForm").validationEngine();
	 		
	 	    $("#selMaterial").on("change", function () {
	 	            var materialCode = $(this).val();
	 	           var csrfToken = document.querySelector('input[name="_csrf"]').value;
	 	            if (materialCode) {
	 	                $.ajax({
	 	                    type: "GET",
	 	                   headers: {
	 	                    	"X-CSRF-TOKEN": csrfToken
	 	                    },
	 	                    url: `/ppap/getMaterialDesc/${materialCode}`, // Spring Boot Controller Endpoint
	 	                    success: function (response) {
	 	                    	 if (response.errFlag==='Y') {
	 	                           alert(response.errText);
	 	                          $("#selDesc").val("");
	 	                        } else {
	 	                           
	 	                            $("#selDesc").val(response.materialDesc); // Update description field
	 	                        }
	 	                    },
	 	                    error: function () {
	 	                        alert("Error fetching material description.");
	 	                    }
	 	                });
	 	            }
	 	        });
	 	   
	        $('#uploadExcelFrag').on('submit', function (event) {
	            event.preventDefault(); // Prevent default form submission
	            const form = document.getElementById('modalForm');
	            const formData = new FormData(form); // Create a FormData object
	            var maxSize = 30 * 1024 * 1024; // 30MB in bytes
	            var fileInput = document.querySelector('input[type="file"]'); // Get file input
	            var csrfToken = document.querySelector('input[name="_csrf"]').value;
	            const uuId= document.getElementById("uuid");
	            if (fileInput.files.length > 0) {
	                var file = fileInput.files[0]; // Get selected file

	                // Validate file size
	                if (file.size > maxSize) {
	                    alert("File size exceeds 30MB. Please upload a smaller file.");
	                    return; // Stop form submission
	                }
	                
	            } else {
	                alert("Please select a file to upload.");
	                return; // Stop form submission
	            } 
	            

	            // Perform AJAX request
	            $.ajax({
	                url: '/files/upload-temp', // Replace with your server endpoint
	                type: 'POST',
	                headers: {
                    	"X-CSRF-TOKEN": csrfToken
                    },
	                data: formData,
	                processData: false, // Prevent jQuery from automatically processing data
	                contentType: false, // Prevent jQuery from setting the content type
	                success: function (response) { 
	                    alert(response.message);
	                    let fileHtml = `<tr><td align="left" width="95%"><input type="hidden" name="fileItem" value="${response.fileName}"><a href="#"  target="_blank">${response.fileName}</a></td><td><span onclick="deleteFile(this,'${response.filename}')"  class="fa fa-trash fa-lg"  ></span></td></tr>`;
	                    uuId.value = response.filename;
	                    $('#uploadManufacturabilityFile').append(fileHtml);   
	                    $('#uploadExcelFrag').modal('hide'); // Hide the modal 
	                },
	                error: function (xhr, status, error) { 
	                    alert('An error occurred: ' + error);
	                }
	            });
	        });
	    });

function showUploadModal()
{
	document.getElementById('file').value = '';
	$('#uploadExcelFrag').modal({show:true});
}

function deleteFile(element, filename,uuid)
{
	 if (!confirm("Are you sure you want to delete this file?")){
         return;
     }
	  var csrfToken = document.querySelector('input[name="_csrf"]').value;
     fetch(`/delete/${filename}`, {
         method: 'DELETE',
         headers: { 
         	"X-CSRF-TOKEN": csrfToken
         },	
     })
     .then(response => {
         if (true) {
             // Remove the file entry from the list
             //document.getElementById(`file-${fileId}`).remove(); 
             $(element).closest("tr").remove();
             alert("File deleted successfully!");  
         } else {
             alert("Failed to delete the file.");
         }
     })
     .catch(error => {
         console.error("Error:", error);
         alert("An error occurred while deleting the file.");
     });
     
 }
 

	$("#submitBtn").click(function(){
		//alert($("#myForm").validationEngine('validate'))
		
		if($("#myForm").validationEngine('validate'))
		{
			
			
				    const fileInput = document.getElementById("file");
				    const file = fileInput.files[0]; // Get the selected file

				    // Check if a file is selected
				    if (!file) {
				      alert("Please select a file.");
				      return false; 
				    } 
			
		   $("#myForm").attr("action", "/ppap/submitReqInput");
		   $("#myForm").submit(); 
		}});



 
   </script>
</div>

</html>
