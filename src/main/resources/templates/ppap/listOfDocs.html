<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
	layout:decorate="layout">
<head>
<title>List</title>
<style type="text/css">
#rejectModal {
	width: 50%;
	height: 40%;
	margin-left: 35%;
	padding: 0;
}

#apprModal {
	width: 90%;
	height: 90%;
	margin-left: 5%;
	padding: 0;
}

.modal-content {
	height: auto;
	min-height: 100%;
	border-radius: 0;
}

.group {
	/* background: #eeeeee; */
	
}

#nullifyModal {
	z-index: 1080 !important;
}
</style>
<style>
.dataTables_filter {
	display: inline;
	float: right;
}

.dataTables_length {
	display: inline;
}

.dt-buttons {
	margin-left: 25%;
}

.input-group-addon {
	padding: 2px 12px !important;
}
</style>
<link rel="stylesheet" type="text/css"
	href="../../../../resources/dist/css/table.css">
</head>
<body>
	<section layout:fragment="header">
		<div class="container-fluid">
			<div class="row">
				<div class="col-sm-6">
					<h1 class="text-primary text-bold text-lg ml-2">List of Documents</h1>
				</div>
				<div class="col-sm-6">
					<ol class="breadcrumb float-sm-right">
						<li class="breadcrumb-item"><a href="#">PPAP</a></li>
						<li class="breadcrumb-item active">List of Documents</li>
					</ol>
				</div>
			</div>
		</div>
	</section>
	<div th:if="${success!= null}"
		class="alert alert-success alert-dismissible">
		<i class="icon fa fa-check"></i> <span th:text="${success}"></span>
	</div>
	<div th:if="${error!= null}"
		class="alert alert-danger alert-dismissible">
		<i class="icon fa fa-check"></i> <span th:text="${error}"></span>
	</div>
	<div class="container-fluid" layout:fragment="content">
		<div class="row">
			<div class="col-12">
				<div class="card">
					<div class="card-body">

						<form role="form" th:object="${listSelector}"
							th:action="@{/ppap/docList}" method="get" name="myForm">
							<div class="table-responsive hidden-xs">
								<table class="table table-striped" style="margin-bottom: 1%;">
									<tbody>
										<tr>
											<td><label>From Date:</label>

												<div class="input-group mb-3">
													<span class="input-group-text border-right-0"
														id="basic-addon1"> <i class="fa fa-calendar"></i>
													</span> <input type="text" class="form-control datepicker"
														placeholder="Start Date" aria-label="Start Date"
														aria-describedby="basic-addon1" id="fromDate"
														name="fromDate" th:field="*{fromDate}">
												</div></td>
											<td><label>To Date:</label>


												<div class="input-group mb-3">
													<span class="input-group-text border-right-0"
														id="basic-addon1"> <i class="fa fa-calendar"></i>
													</span> <input type="text" class="form-control datepicker"
														placeholder="Start Date" aria-label="Start Date"
														aria-describedby="basic-addon1" id="fromDate"
														name="fromDate" th:field="*{toDate}">
												</div></td>
											<td><label for="listType">Status</label><br>
												<div class="input-group">
													<select class="form-control input-sm" th:field="*{status}">
														<option value="" th:selected="*{status==''}">All</option>
														<option value="SUBMITTED"
															th:selected="*{status=='SUBMITTED'}">Submitted</option>
														<option value="APPROVED"
															th:selected="*{status=='APPROVED'}">Approved</option>
														<option value="SENDBACK"
															th:selected="*{status=='SENDBACK'}">Send Back</option>
														<option value="REJECTED"
															th:selected="*{status=='REJECTED'}">Rejected</option>
													</select>
												</div></td>

											<td>
												<div
													class="d-flex align-items-center justify-content-center mt-3">
													<button type="submit"
														class="btn btn-primary pull-right mt-3 w-100">
														Apply
														<!-- <i class="fa fa-paper-plane"></i> -->
													</button>
												</div>
											</td>
										</tr>

									</tbody>
								</table>
							</div>
						</form>
						<div class="table-responsive">
							<table id="example" class="table styled-table table-bordered nowrap "
								cellspacing="0" width="100%">
								<thead>
									<tr>
										<th>Document Id</th>
										<th>Product Type</th>
										<th>Plant</th>
										<th>Material</th>
										<th>Material Description</th>
										<th>Status</th>
										<th>Pending With</th>
										<th>Current Step</th>
										<th>Created By</th>
										<th>Created On</th>

									</tr>
								</thead>
								<tbody>
									<tr th:each="doc : ${docList}">
										<td><a th:text="${doc.getDocId}"
											th:href="@{/ppap/viewDocDet/{docId}(docId=${doc.getDocId})}">
												Document Id </a></td>
										<td><span th:text="${doc.getMaterialType}">
												Product Type </span></td>
										<td><span th:text="${doc.getSupplierPlant}">
												Product Type </span></td>
										<td><span th:text="${doc.getMaterial}"> Material </span></td>
										<td><span th:text="${doc.getMaterialDescription}">
												Material Description</span></td>
										<td><span th:text="${doc.getStatus}"> Status </span></td>
										<td><span th:text="${doc.getNextParticipant}">
												Next Participant </span></td>
										<td><span th:text="${doc.getNextStep}"> Current
												Step </span></td>
										<td><span th:text="${doc.getCreatedBy}"> Created
												By </span></td>
										<td><span
											th:text="${#dates.format(doc.getCreatedOn,'dd/MM/yyyy')}">
												Created On</span></td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div layout:fragment="scriptContent">

		<script th:inline="javascript">
			$(document)
					.ready(
							function() {

								$('.datepicker').datepicker({
									autoclose : true,
									format : 'dd/mm/yyyy'
								});

								$('#example')
										.DataTable(
												{
													dom : 'lBfrtip',
													buttons : [
															{
																extend : 'excel',
																text : '<i class="fa fa-file-excel" style="color:green"> </i> EXCEL',
																title : null,
																filename : 'Download'
															},
															{
																extend : 'pdf',
																text : '<i class="fa fa-file-pdf" style="color:red"></i> PDF',
																title : null
															} ],

													language : {
														lengthMenu : '_MENU_ entries per page',
														paginate : {
															previous : '‹',
															next : '›'
														}
													}

												}

										);

							});
		</script>


	</div>

</body>
</html>
