<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      layout:decorate="layout">
<head>
</head>
<body>
<section layout:fragment="header">
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-6">
        <h1 class="text-primary text-bold text-lg ml-2">List of Documents</h1>
      </div>
      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-right">
          <li class="breadcrumb-item"><a href="#">QMIS</a></li>
          <li class="breadcrumb-item active">List of Documents</li>
        </ol>
      </div>
    </div>
  </div>
</section>

<div class="container-fluid" layout:fragment="content">
  <div th:each="entry : ${plantMaterialMap}">
    <h2 th:text="'Plant: ' + ${entry.key}" class="mt-3 text-primary">Plant Code</h2>

    <div th:each="type : ${entry.value}">
      <h3 th:text="${type}">Material Type</h3>

      <!-- Download Button -->
      <a th:href="@{/qmis/updateBudget(type=${type}, vendor=${vendorId}, vendorName=${vendorName})}"
         class="btn btn-primary mb-2">Download Excel</a>

      <!-- Upload Form -->
      <form id="readExcelForm" th:action="@{/qmis/readExcel}" method="post" enctype="multipart/form-data">
        <input type="file" name="file" required />
        <input type="hidden" name="vendor" th:value="${vendorName}" />
        <input type="hidden" name="vendorId" th:value="${vendorId}" />
        <input type="hidden" name="type" th:value="${type}" />
        <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
        <button type="submit" class="btn btn-success mt-1">Upload</button>
      </form>
      <hr />
    </div>
  </div>
</div>
<div layout:fragment="scriptContent">
  <script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        const materialTypes = [[${materialType}]];
        document.getElementById("readExcelForm").addEventListener("submit", function(event) {
          event.preventDefault();

          const form = event.target;
          const formData = new FormData(form);

          fetch('/qmis/readExcel', {
            method: 'POST',
            body: formData,
          }).then(response => {
            if (response.ok) {
              alert('Upload successful');
            } else {
              alert('Upload failed');
            }
          }).catch(error => {
            alert('Error: ' + error);
          });
        });
    });
  </script>
</div>
</body>
</html>
