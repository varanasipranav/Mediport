  <title>QMIS</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

  <script>
    function showUploadModal(button) {
        const uploadModal = document.getElementById('uploadExcelFrag');
        const fileInput = document.getElementById('incidentFile');
        const closeBtn = document.getElementById('closeModal');

          const qmisType = button.getAttribute('data-qmis-type');
          document.getElementById('qmisType').value = qmisType;

        // Initialize Bootstrap modal
        const modal = new bootstrap.Modal(uploadModal);

        // Clear file input and show modal
        if (fileInput) {
          fileInput.value = '';
        }
        modal.show();
    }
      function deleteFile(element, fileName,docNo,docType,docItemType)
      {
           if (!confirm("Are you sure you want to delete this file?")){
               return;
           }
            var csrfToken = document.querySelector('input[name="_csrf"]').value;
           fetch(`/delete/${fileName}/${docNo}/${docType}/${docItemType}`, {
               method: 'DELETE',
               headers: {
                  "X-CSRF-TOKEN": csrfToken
               },
           })
           .then(response => {
               if (response.ok) {
                   const uploadBtnEle = document.getElementById('uploadBtn_' + docItemType.replace(/\s/g, '_'));
                   if (uploadBtnEle) {
                      uploadBtnEle.style.display = 'block';
                   }
                   // Remove the file entry from the list
                  const tdToDelete = $(element).closest("td"); // The <td> containing the delete button
                  const fileTypeTd = tdToDelete.prev("td");   // The <td> containing the file name
                  const fileNameTd = fileTypeTd.prev("td");
                  const commentTd = fileNameTd.prev("td");

                  // Remove both <td> elements
                  tdToDelete.remove();
                  fileTypeTd.remove();
                  fileNameTd.remove();
              <!--                        if("PPAP_INITIATION" === docType){-->
              <!--                            commentTd.remove();-->
              <!--                        }-->
                  alert("File deleted successfully!");
               } else {
                   alert("Failed to delete the file.");
               }
           })
           .catch(error => {
               console.error("Error:", error);
               alert("An error occurred while deleting the file.");
           });

      }
  </script>

<div layout:fragment="content">

  <div class="card card-primary">
    <div class="d-flex justify-content-between align-items-center" style="margin: 0px 10px;">

        <span class="badge bg-success me-2" id="filledCount">Filled: 0</span>

        <button type="button" class="btn btn-secondary" id="openAllBtn">Open All</button>
      </div>
    </div>
    <!-- Tabs -->
    <div>
      <div class="card-body">
        <form id="qmisForm" th:action="@{/qmis/saveFormData}" method="post" enctype="multipart/form-data">
          <input type="hidden" id="eqhCurrentStep" th:value="${docHeader.eqhCurrentStep}" />
          <input type="hidden" id="eqhCurrentParticipant" th:value="${docHeader.eqhCurrentParticipant}" />
          <input type="hidden" id="eqhNextParticipant" th:value="${docHeader.eqhNextParticipant}" />
          <input type="hidden" id="eqhNextStep" th:value="${docHeader.eqhNextStep}" />

          <div class="accordion" id="qmisAccordion">
            <div th:each="template, stat : ${templates}" class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button" type="button"
                        th:classappend="${!stat.first ? 'collapsed' : ''}"
                        th:data-bs-target="'#collapse_' + ${#strings.replace(template.eqftQmisType, ' ', '_')}"
                        aria-expanded="false">
                  <span th:text="${template.eqftQmisType}"></span>
                </button>
              </h2>

              <div th:id="'collapse_' + ${#strings.replace(template.eqftQmisType, ' ', '_')}"
                   class="accordion-collapse collapse"
                   th:classappend="${stat.first ? 'show' : ''}"
                   data-bs-parent="#qmisAccordion">
                <div class="accordion-body">
                  <div class="template-row" style="display: flex; flex-direction: column;">
                    <!-- FORM SECTION -->
                    <div class="form-section" th:id="'form_section_' + ${template.eqftId}" style="display: flex; flex-wrap: wrap; gap: 20px;">
                      <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                      <input type="hidden" name="eqftId" th:value="${template.eqftId}" />
                      <input type="hidden" name="eqftMaterialType" th:value="${template.eqftMaterialType}" />
                      <input type="hidden" name="eqftType" th:value="${template.eqftType}" />
                      <input type="hidden" name="eqftQmisType" id="eqftQmisType" th:value="${template.eqftQmisType}" />

                      <div class="" id="qmisMonthValueLabel" style="margin-left: 20px;">
                        <label style="margin-bottom: 0px;">Enter Value for <span class="last-month-label"></span>:</label>
                        <input type="number" class="form-control track-input" th:name="'eqftValue_' + ${template.eqftQmisType}"/>
                      </div>
                      <div class="form-group" id="fileUploadSection" style="display: flex; flex-direction: row; align-items: center; gap: 10px;padding-top: 15px">
                        <input type="hidden" name="docId" id="docId" th:value="${docId}">
                        <input type="hidden" name="qmisType" id="qmisType" th:value="${template.eqftQmisType}" />
                        <input type="hidden" name="eqftVendor" id="eqftVendor" th:value="${vendorCode}" />
                        <div class="center">
                          <button type="button" id="qmisSaveBtn" class="btn btn-primary save-section-btn"
                                  th:data-template-id="${template.eqftId}">Save</button>
                        </div>
                        <div class="form-group" style="display: flex; justify-content: center;">
                          <table class="table table-striped table-hover" style="margin: 0; border-top: none;"
                                 th:id="'uploadManufacturabilityFile_' + ${#strings.replace(template.eqftQmisType, ' ', '_')}"></table>
                        </div>
                        <div class="alert alert-success" role="alert" th:id="'success_alert_' + ${template.eqftId}"

                          Saved successfully!
                        </div>
                        <div class="alert alert-danger" role="alert" th:id="'error_alert_' + ${template.eqftId}"
                             style="text-wrap: nowrap; margin: 0px; padding: 5px;">
                          Please try again.
                        </div>
                        <div class="input-group" style="justify-content: center;">
                          <a onclick="showUploadModal(this)" class="btn btn-warning" th:id="'uploadBtn_'+${#strings.replace(template.eqftQmisType, ' ', '_')} " th:data-qmis-type="${template.eqftQmisType}">
                            <i class="fa fa-upload" style="color: green"></i> Upload File
                          </a>
                        </div>
                      </div>
                    </div>

                    <div class="chart-section" style="margin-top: 20px; height: 350px; position: relative;">
                      <canvas th:id="'chart_' + ${template.eqftQmisType}"
                              style="height: 100%; display: block; width: 100%;"></canvas>

                      <div class="status-icon" >
                        <div class="arrow-circle">
                          <div class="arrow-body">
                            <div class="arrow-text">
                              <span>G</span>
                              <span>O</span>
                              <span>O</span>
                              <span>D</span>
                            </div>
                            <div class="arrow-head"></div>
                          </div>
                        </div>
                        <div class="status-dot green" th:id="'status-dot_' + ${template.eqftQmisType}"></div>
                      </div>
                    </div>
                  </div>
              </div>
            </div>
          </div>
          <div class="center">
            <div id="submitBtnWrapper" title="">
              <button type="submit" id="submitBtn" class="btn btn-primary"
                      th:text="${userRoles.contains('ROLE_OS_CQA_CEAT') ? 'Approve' : 'Submit'}">
                Submit</button>
            </div>
          </div>
          </div>
        </form>
      </div>
    </div>
  </div>
  <!-- Modal for Upload -->
  <div class="modal fade" id="uploadExcelFrag" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="modalForm" enctype="multipart/form-data">
          <div class="modal-header">
            <h5 class="modal-title" id="modalLabel">Upload File</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="file" name="file" id="incidentFile" class="form-control">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <input type="hidden" name="uuid" id="uuid" th:value="${uuid}">
          </div>
          <div class="modal-footer">
            <button type="button" id="closeModal" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-primary">Submit</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Chart.js Script Section -->
<div layout:fragment="scriptContent">
  <script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
      const templatesLength = [[${#lists.size(templates)}]];
      const UOM = [[${UOM}]];
      const chartInstances = {};
      const chartDataSeries = [[${chartData}]];
      console.log(chartDataSeries);
      const currentMonth = [[${currentMonth}]];
      const currentYear = [[${currentYear}]];
      const monthNameMap = {
        1: "Jan", 2: "Feb", 3: "Mar", 4: "Apr", 5: "May", 6: "Jun",
        7: "Jul", 8: "Aug", 9: "Sep", 10: "Oct", 11: "Nov", 12: "Dec"
      };
      const docId = [[${docId}]];
      const docHeader = [[${docHeader}]];
      const userRoles = [[${userRoles}]];
      const userId = [[${userId}]];
      const vendorCode = [[${vendorCode}]];
      const actualByFy = [[${actualByFy}]];
      const graphFYLabel = [[${graphFYLabel}]];
      const materialType = [[${materialType}]];
      const currentParticipant = document.getElementById('eqhCurrentParticipant').value;
      console.log(userRoles, "userRoles", userId, "userId");
      let submitted = 0;
      let pending = 0;

      const elementsToHide = document.querySelectorAll('#qmisMonthValueLabel, #qmisSaveBtn');

      if (userRoles.includes("ROLE_OS_QA_CEAT") || userRoles.includes("ROLE_OS_CQA_CEAT")) {
        elementsToHide.forEach(element => {
            element.hidden = true;
        });
      }

       const observer = new MutationObserver(function(mutationsList) {
        for (const mutation of mutationsList) {
          if (mutation.type === 'childList') {
            const deleteIcons = document.querySelectorAll('.fa.fa-trash.text-danger');
            if (deleteIcons.length > 0 && userRoles.includes("ROLE_OS_CQA_CEAT")) {
                deleteIcons.forEach(icon => {
                    icon.hidden = true; // Hides each delete icon
                });
                observer.disconnect(); // Stop observing once icons are processed
            }
          }
        }
       });


       function updateInputs(){
         if(docHeader.eqhVendorStatus == "SUBMITTED" && userRoles.includes("ROLE_VEND")) {
             // get all inputs with eqftValue_type3 and disable them
            const inputs = document.querySelectorAll('input[name^="eqftValue_"]');
            inputs.forEach(input => {
              input.disabled = true;
            });
            // get all save buttons and disable them
            const saveButtons = document.querySelectorAll('.save-section-btn');
            saveButtons.forEach(button => {
              button.disabled = true;
            });
            // get all upload buttons and disable them
            const uploadButtons = document.querySelectorAll('a[id^="uploadBtn_"]');
            uploadButtons.forEach(button => {
              button.style.display = 'none';
            });
         }
         if(docHeader.eqhQaStatus == "SUBMITTED" && userRoles.includes("ROLE_OS_QA_CEAT")) {
            // get all upload buttons and disable them
            const uploadButtons = document.querySelectorAll('a[id^="uploadBtn_"]');
            uploadButtons.forEach(button => {
              button.style.display = 'none';
            });
         }
       }
      // Start observing the body for changes
      observer.observe(document.body, { childList: true, subtree: true });
       function updateCounters() {
          submitButton = document.getElementById('submitBtn');
          if(!userRoles.includes(currentParticipant) && currentParticipant !=""){
            const wrapper = document.getElementById('submitBtnWrapper');
            submitButton.disabled = true;
  <!--      const tooltipMsg = "Data submitted successfully! Next participant: " + docHeader.eqhCurrentParticipant.replace("ROLE_OS_", "");-->
            const tooltipMsg = "Data submitted successfully! Next participant: ";
            wrapper.title = tooltipMsg;
          }
          // currentUser == currentRole
          else if(userRoles.includes(currentParticipant) && currentParticipant != ""){
            if(userRoles.includes("OS_CQA")){
              docHeader.eqhQaStatus == "APPROVED" ? submitButton.disabled = true: submitButton.disabled=false;
            }
            else if(templatesLength == submitted) {
              submitButton.disabled = false;
            }
            else{
              submitButton.disabled = true;
            }
          }
          else {
            submitButton.disabled = true;
          }
          document.getElementById('filledCount').textContent = `Filled: ${submitted}`;
          document.getElementById('pendingCount').textContent = `Pending: ${pending}`;
       }

       function updateStatusDot(type3, cumulativeForecast, cumulativeActual) {
          const statusDot = document.getElementById("status-dot_" + type3);
          if (statusDot) {
            statusDot.classList.remove("green", "red");
            if (cumulativeForecast < cumulativeActual) {
              statusDot.classList.add("red");
            } else {
              statusDot.classList.add("green");
            }
          }
       }

      function updateHeader() {
           fetch(`/qmis/saveHeader/${docId}`, {
              method: 'POST',
              headers: {
                "X-CSRF-TOKEN": document.querySelector('input[name="_csrf"]').value
              },
            })
            .then(response => {
              if(response.ok) {
                  alert("Data submitted successfully!");
                    location.reload();
              } else {
<!--                console.error("Error updating header");-->
              }
            })
            .catch(error => {
                console.error("Error:", error);
                alert("An error occurred while submitting the data.");
              });
      }
      function submitQmisData(formData) {
        const csrfToken = document.querySelector('input[name="_csrf"]').value;
        fetch(`/qmis/saveFormData`, {
          method: 'POST',
          headers: {
            "X-CSRF-TOKEN": csrfToken
          },
          body: formData
        })
        .then(response => {
          if (response.ok) {
            updateHeader();

          }
          else {
            alert("Error submitting data.");
          }
        })
        .catch(error => {
          console.error("Error:", error);
          alert("An error occurred while submitting the data.");
        });
      }
      function getLastMonthInfo() {
        const currentMonth = [[${currentMonth}]];
        const currentYear = [[${currentYear}]];
        const lastMonthNumber = currentMonth;
        const lastMonthYear = currentYear;

        return {
          monthNumber: lastMonthNumber,
          yearFull: lastMonthYear,
          yearShort: lastMonthYear.toString().slice(-2),
          monthName: monthNameMap[lastMonthNumber]
        };
      }
        function getActualData(type3) {
          const series = chartDataSeries.find(item => item.type3 === type3);
          if (series) {
            return {
              qmisActualLabels: series.actualLabels,
              qmisActualValues: series.actualValues
            };
          } else {
            console.error(`No data found for type3: ${type3}`);
            return {
              qmisActualLabels: [],
              qmisActualValues: []
            };
          }
        }

        function deleteFile(element, fileName,docNo,docType,docItemType)
            {
                 if (!confirm("Are you sure you want to delete this file?")){
                     return;
                 }
                  var csrfToken = document.querySelector('input[name="_csrf"]').value;
                 fetch(`/delete/${fileName}/${docNo}/${docType}/${docItemType}`, {
                     method: 'DELETE',
                     headers: {
                        "X-CSRF-TOKEN": csrfToken
                     },
                 })
                 .then(response => {
                     if (response.ok) {
                         // Remove the file entry from the list
                        const tdToDelete = $(element).closest("td"); // The <td> containing the delete button
                        const fileTypeTd = tdToDelete.prev("td");   // The <td> containing the file name
                        const fileNameTd = fileTypeTd.prev("td");
                        const commentTd = fileNameTd.prev("td");

                        // Remove both <td> elements
                        tdToDelete.remove();
                        fileTypeTd.remove();
                        fileNameTd.remove();
                        alert("File deleted successfully!");
                     } else {
                         alert("Failed to delete the file.");
                     }
                 })
                 .catch(error => {
                     console.error("Error:", error);
                     alert("An error occurred while deleting the file.");
                 });

            }
        function createChart(ctx, type3, actualLabels, actualValues, forecastLabels, forecastValues, barLabels, barValues, cumulativeForecast, cumulativeActual, allPreviousYearValues, UOM) {
                const allLabels = [...barLabels, ...actualLabels, 'budgetYTD', 'actualYTD'];
                 Chart.plugins.register(window.ChartDataLabels);
                 const maxValue = Math.max(...actualValues, ...forecastValues, ...barValues, cumulativeForecast, cumulativeActual);

                const chart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: allLabels,
                        datasets: [
                            {
                                type: 'bar',
                                label: type3 + ' FY Performance',
                                data: [barValues[0],null,null, ...Array(actualLabels.length).fill(null), null, null],
                                backgroundColor: 'orange',
                                categoryPercentage: 0.8,
                                barPercentage: 1.0,
                                maxBarThickness: 60,
                                minBarLength: 5,
                                grouped: false,
                                stack: 'stack1',
                                order: 1
