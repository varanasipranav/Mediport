<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>My appointments</title>
</head>
<body>
<div layout:fragment="content">

    <div class="mp-page-header">
        <div>
            <h1 class="mp-page-title">My appointments</h1>
            <div class="mp-page-subtitle">Everything you've booked, newest first.</div>
        </div>
        <div class="mp-page-actions">
            <a th:href="@{/patient/book-appointment}" class="mp-btn mp-btn-primary"><i class="fas fa-calendar-plus"></i> Book appointment</a>
        </div>
    </div>

    <div th:replace="~{fragments/flash :: flash}"></div>

    <div style="padding:0 32px 32px;">
        <div class="mp-card">
            <div class="mp-card-header">
                <h3 class="mp-card-title">History</h3>
                <div class="pa-tabs" id="paTabs">
                    <button type="button" class="active" data-f="upcoming">Upcoming</button>
                    <button type="button" data-f="past">Past</button>
                    <button type="button" data-f="all">All</button>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(appointments)}" style="padding:56px 24px;text-align:center;color:var(--text-muted);">
                <div style="width:56px;height:56px;border-radius:14px;background:var(--bg-muted);display:inline-flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px;"><i class="fas fa-calendar-times"></i></div>
                <div style="font-weight:700;color:var(--text-strong);font-size:16px;">No appointments yet</div>
                <div style="margin:4px 0 16px;">Book your first visit in a few taps.</div>
                <a th:href="@{/patient/book-appointment}" class="mp-btn mp-btn-primary"><i class="fas fa-calendar-plus"></i> Book appointment</a>
            </div>

            <div id="paList">
                <div th:each="a : ${appointments}" class="pa-row"
                     th:attr="data-when=${(!a.appointmentDate.isBefore(#temporals.createToday()) and (a.status.name() == 'WAITING' or a.status.name() == 'DELAYED' or a.status.name() == 'IN_CONSULTATION')) ? 'upcoming' : 'past'}">
                    <div class="pa-date">
                        <div class="pa-day" th:text="${#temporals.format(a.appointmentDate, 'dd')}">14</div>
                        <div class="pa-mon" th:text="${#temporals.format(a.appointmentDate, 'MMM yyyy')}">Oct 2026</div>
                    </div>
                    <div class="pa-main">
                        <div class="pa-doc" th:text="${'Dr. ' + a.doctor.firstName + ' ' + a.doctor.lastName}">Dr. Name</div>
                        <div class="pa-sub" th:text="${a.doctor.specialization != null ? a.doctor.specialization : 'General practice'}">Specialization</div>
                    </div>
                    <div class="pa-slot">
                        <div class="font-mono" style="font-weight:700;color:var(--text-strong);" th:text="${#temporals.format(a.scheduledTime, 'HH:mm')}">09:00</div>
                        <div class="pa-sub">Queue #<span th:text="${a.queueNumber}">1</span></div>
                    </div>
                    <div><span th:replace="~{fragments/status-pill :: pill(${a.status})}"></span></div>
                    <div class="pa-actions">
                        <form th:if="${a.status.name() == 'WAITING' or a.status.name() == 'DELAYED'}"
                              th:action="@{/patient/appointment/{id}/cancel(id=${a.id})}" method="post" style="margin:0;"
                              onsubmit="return confirm('Cancel this appointment?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="mp-btn mp-btn-danger mp-btn-sm"><i class="fas fa-times"></i> Cancel</button>
                        </form>
                    </div>
                </div>
                <div id="paEmpty" style="display:none;padding:40px 24px;text-align:center;color:var(--text-muted);">Nothing in this view.</div>
            </div>
        </div>
    </div>

    <style>
        .pa-row { display:grid; grid-template-columns:76px minmax(0,1fr) 110px 150px 110px; gap:16px; align-items:center; padding:16px 24px; border-bottom:1px solid var(--border); }
        .pa-row:last-of-type { border-bottom:0; }
        .pa-date { text-align:center; background:var(--bg-muted); border-radius:10px; padding:8px 0; }
        .pa-day { font:800 22px var(--font-display); color:var(--text-strong); line-height:1; }
        .pa-mon { font-size:11px; color:var(--text-muted); font-weight:600; margin-top:2px; }
        .pa-doc { font-weight:700; color:var(--text-strong); }
        .pa-sub { font-size:12.5px; color:var(--text-muted); }
        .pa-actions { display:flex; justify-content:flex-end; }
        .pa-tabs { display:flex; gap:4px; background:var(--bg-muted); padding:3px; border-radius:8px; }
        .pa-tabs button { border:0; background:transparent; padding:5px 14px; border-radius:6px; font:600 12px var(--font-body); color:var(--text-muted); cursor:pointer; }
        .pa-tabs button.active { background:#fff; color:var(--text-strong); box-shadow:0 1px 2px rgba(15,27,45,.1); }
        @media (max-width: 800px) { .pa-row { grid-template-columns:64px minmax(0,1fr) auto; } .pa-slot { display:none; } .pa-actions { grid-column:1/-1; justify-content:flex-start; } }
    </style>
</div>

<th:block layout:fragment="scriptContent">
<script>
(function () {
    var rows = document.querySelectorAll('#paList .pa-row'), empty = document.getElementById('paEmpty');
    function apply(f) {
        var shown = 0;
        rows.forEach(function (r) {
            var ok = f === 'all' || r.getAttribute('data-when') === f;
            r.style.display = ok ? '' : 'none';
            if (ok) shown++;
        });
        if (empty) empty.style.display = rows.length && !shown ? '' : 'none';
    }
    document.querySelectorAll('#paTabs button').forEach(function (b) {
        b.addEventListener('click', function () {
            document.querySelectorAll('#paTabs button').forEach(function (x) { x.classList.remove('active'); });
            b.classList.add('active');
            apply(b.getAttribute('data-f'));
        });
    });
    apply(document.querySelector('#paList .pa-row[data-when="upcoming"]') ? 'upcoming' : 'all');
    if (!document.querySelector('#paList .pa-row[data-when="upcoming"]')) {
        document.querySelectorAll('#paTabs button').forEach(function (x) { x.classList.toggle('active', x.getAttribute('data-f') === 'all'); });
    }
})();
</script>
</th:block>
</body>
</html>
