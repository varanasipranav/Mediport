<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">ARAGEN | Aragen Digita X</title>

    <!-- Google Font: Source Sans Pro -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <!-- Font Awesome -->
    <link rel="stylesheet" th:href="@{/resources/lte3dot2/plugins/fontawesome-free/css/all.min.css}"/>
    <!-- DataTables -->
    <link rel="stylesheet" th:href="@{/resources/lte3dot2/plugins/datatables-bs4/css/dataTables.bootstrap4.min.css}"/>
    <link rel="stylesheet" th:href="@{/resources/lte3dot2/plugins/datatables-responsive/css/responsive.bootstrap4.min.css}"/>
    <link rel="stylesheet" th:href="@{/resources/lte3dot2/plugins/datatables-buttons/css/buttons.bootstrap4.min.css}"/>

    <link rel="stylesheet" th:href="@{/resources/lte3dot2/plugins/jquery-ui/jquery-ui.min.css}"/>
    <link rel="stylesheet" th:href="@{/resources/lte3dot2/plugins/select2/css/select2.min.css}"/>
    <link rel="stylesheet" th:href="@{/resources/lte3dot2/plugins/select2-bootstrap4-theme/select2-bootstrap4.min.css}"/>
    <!-- daterange picker -->
    <link rel="stylesheet" th:href="@{/resources/lte3dot2/plugins/daterangepicker/daterangepicker.css}"/>
    <!-- Theme style -->
    <link rel="stylesheet" th:href="@{/resources/lte3dot2/css/adminlte.min.css}"/>

    <link rel="stylesheet" th:href="@{/resources/lte3dot2/plugins/validation/validationEngine.jquery.css}"/>
    <link rel="stylesheet" th:href="@{/resources/lte3dot2/plugins/pace-progress/themes/black/pace-theme-flat-top.css}"/>
    <link rel="stylesheet" th:href="@{/resources/plugins/datepicker/datepicker3.css}"/>
    <style>
        th{
             background-color: #007bff;
           color: #fff;
       }


       /* Loader overlay (consolidated) */
       #loader {
         display: none; /* hidden until DOM is ready */
         /* positioned relative to the content container (not the viewport) */
         position: fixed;
         top: 0;
         left: 0;
         right: 0;
         bottom: 0;
         background-color: rgba(255,255,255,0.95);
         z-index: 1037; /* sits above content but below global UI like modals if needed */
         display: flex;
         justify-content: center;
         align-items: center;
       }

       /* Ensure the content container is the positioning context for the loader */
       section.content {
         position: relative;
       }

       .loader-content {
         text-align: center;
       }

       .loader-content img {
         width: auto;
         height: 324px;
         display: block;
       }


       .dashboard-bg {
           position: relative;
           z-index: 1;
       }

       .dashboard-bg::before {
           content: "";
           position: absolute;
           top: 0;
           left: 0;
           right: 0;
           bottom: 0;
           background: url("../resources/images/dashboard-bg.png") no-repeat center center;
           background-size: cover;
           opacity: 0.6;
           z-index: -1;
       }

       /* Define custom theme colors */
       :root {
         --blue-color: #033882;
         --orange-color: #DC402B;
       }

       /* Page-specific overrides */
       body.custom-page {
         background-color: var(--blue-color);
         color: white;
       }

       /* Sidebar container */
       aside.main-sidebar {
         /* keep AdminLTE default width (no override here) */
         background-color: var(--blue-color) !important;
         position: fixed;
         top: 0;
         left: 0;
         height: 100vh;
         color: white;
       }

       /* Brand link (logo area at top of sidebar) */
       aside.main-sidebar .brand-link {
         background-color: var(--blue-color) !important; /* same as sidebar */
         color: #fff !important;
         border-bottom: 1px solid rgba(255, 255, 255, 0.1); /* subtle line */
         text-align: center;
         padding: 15px;
       }

       aside.main-sidebar .brand-link img {
         max-height: 60px;
         object-fit: contain;
       }

       /* Sidebar nav links */
       .custom-sidebar .nav-link {
         display: block;
         padding: 12px 20px;
         color: white !important;
         font-size: 15px;
         text-decoration: none;
       }

       .custom-sidebar .nav-link {
         position: relative;
         transition: all 0.3s ease;
         border-radius: 50px; /* Rounded pill style */
         padding: 8px 16px;
       }

       .custom-sidebar .nav-link:hover {
         background-color: var(--orange-color) !important;
         color: #fff !important; /* White text */
         transition: all 0.3s ease;
       }

       .custom-sidebar .nav-link.active {
         background-color: var(--orange-color) !important;
         color: #fff !important; /* White text */
         transition: all 0.3s ease;
       }

             :root {
         --blue-color: #033882;
         --orange-color: #DC402B;
       }

       .loader {
         position: relative;
         transform: rotateZ(45deg);
         border-radius: 50%;
         width: 100px;
         height: 100px;
         color: var(--blue-color);
       }

       .loader:before,
       .loader:after {
         content: '';
         display: block;
         position: absolute;
         top: 0;
         left: 0;
         width: inherit;
         height: inherit;
         border-radius: 50%;
         transform: rotateX(70deg);
         animation: spin 1s linear infinite;
       }

       .loader:after {
         color: var(--orange-color);
         transform: rotateY(70deg);
         animation-delay: .4s;
       }

       @keyframes spin {
         0%,100% { box-shadow: .25em 0 0 0 currentcolor; }
         12% { box-shadow: .25em .25em 0 0 currentcolor; }
         25% { box-shadow: 0 .25em 0 0 currentcolor; }
         37% { box-shadow: -.25em .25em 0 0 currentcolor; }
         50% { box-shadow: -.25em 0 0 0 currentcolor; }
         62% { box-shadow: -.25em -.25em 0 0 currentcolor; }
         75% { box-shadow: 0 -.25em 0 0 currentcolor; }
         87% { box-shadow: .25em -.25em 0 0 currentcolor; }
       }

       /* Kill Pace’s old loader completely */
       .pace-running::before,
       .pace, .pace .pace-progress, .pace .pace-activity {
         display: none !important;
         content: none !important;
         background: none !important;
       }





    </style>

    <!-- html -->
    <!-- Put this script in the <head> (replaces existing loader JS) -->
    <script>
        const loader = {
          start: function() {
            console.log('START LOADER');
            const el = document.getElementById('loader');
            if (el) el.style.display = 'flex';
          },
          stop: function() {
            console.log('STOP LOADER');
            const el = document.getElementById('loader');
            if (el) el.style.display = 'none';
          }
        };

        // Show loader as soon as DOM is available, then hide when full page loads
        document.addEventListener('DOMContentLoaded', function() {
          // small timeout to ensure the loader element is parsed in body
          setTimeout(() => loader.start(), 10);
        });

        // Hide loader when everything (images, subresources) has loaded
        window.addEventListener('load', function() {
          // add slight delay so the user sees the loader briefly on slow pages
          setTimeout(() => loader.stop(), 150);
        });

         const warningTime = 25 * 60 * 1000;
         const logoutTime = 30 * 60 * 1000;
         let warningTimer, logoutTimer;

         function startTimers() {
           clearTimers();

           warningTimer = setTimeout(() => {
             const stayLoggedIn = confirm("You will be signed out soon. Do you want to stay logged in?");
             if (stayLoggedIn) {
               const csrfTokenEl = document.getElementById("csrf");
               const csrfToken = csrfTokenEl ? csrfTokenEl.value : null;
               fetch('/api/session/extend', {
                 method: 'POST',
                 headers: {
                   'Content-Type': 'application/json',
                   'X-CSRF-TOKEN': csrfToken
                 }
               })
               .then(response => {
                 if (response.ok) {
                   console.log("Session extended successfully.");
                   localStorage.setItem("session-extended", Date.now());
                   startTimers();
                 } else {
                   console.error("Failed to extend session.");
                 }
               })
               .catch(error => console.error("Error extending session:", error));
             } else {
               localStorage.setItem("force-logout", Date.now());
               logout();
             }
           }, warningTime);

           logoutTimer = setTimeout(() => {
             localStorage.setItem("force-logout", Date.now());
             logout();
           }, logoutTime);
         }

         function clearTimers() {
           clearTimeout(warningTimer);
           clearTimeout(logoutTimer);
         }

         function logout() {
           alert("You have been signed out.");
           window.location.href = "/logout.html?logSucc=true";
         }

         window.addEventListener("storage", (event) => {
           if (event.key === "session-extended") {
             console.log("Session extended in another tab. Resetting timers...");
             startTimers();
           }
           if (event.key === "force-logout") {
             console.log("Logout triggered from another tab.");
             logout();
           }
         });

         startTimers();
    </script>

</head>
<body class="hold-transition sidebar-mini pace-primary">
<div class="wrapper">

    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <div th:replace="~{/fragments/header}"></div>
    </nav>
    <!-- Left side column. contains the logo and sidebar -->

    <aside class="main-sidebar sidebar-dark-primary elevation-4 position-fixed">
        <div th:replace="~{/fragments/main-sidebar}"></div>
    </aside>

    <!-- Content Wrapper. Contains page content -->
    <div class="content-wrapper">
        <!-- Content Header (Page header) -->
        <section class="content-header" layout:fragment="header"></section>

        <!-- Main content -->
        <section class="content">
            <!-- Loader specific to the content fragment. This overlays only the content area and will not cover the sidebar/header/footer. -->
            <div id="loader">
                <div class="loader-content">
                    <img th:src="@{/resources/dist/img/scin.gif}" src="../../../resources/dist/img/scin.gif" alt="loader">
                </div>
            </div>

            <div layout:fragment="content"></div>

        </section>
        <!-- /.content -->
    </div>
    <!-- /.content-wrapper -->

    <footer class="main-footer">
        <strong>Copyright &copy; 2025 <a href="https://www.thehackettgroup.com">The Hackett Group</a>.</strong>
        All rights reserved.
        <div class="float-right d-none d-sm-inline-block">
            <b>Version</b> 1.0.0
        </div>
        <input type="hidden" name="_csrf" id="csrf" th:value="${_csrf.token}" />
    </footer>

    <!-- Control Sidebar -->
    <aside class="control-sidebar hold-transition sidebar-mini layout-fixed custom-page">
        <div th:replace="~{/fragments/control-sidebar}"></div>
    </aside>
</div>
<!-- ./wrapper -->

<div th:replace="~{/fragments/scripts}" ></div>

<div layout:fragment="scriptContent" ></div>



</body>
</html>
